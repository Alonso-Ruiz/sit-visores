<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>UPU San Borja | Simulador de cabida</title>

    <script>
        // Ciberseguridad
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', function(e) {
            if(e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && e.keyCode === 85)) { 
                e.preventDefault(); 
            }
        });
        // Bloquear drag de elementos internos, permitir drop de archivos externos
        document.ondragstart = function(e) { 
            if (e.dataTransfer.effectAllowed !== 'copyMove') return false; 
        };
    </script>

    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom": "https://esm.sh/react-dom@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",

            "three": "https://esm.sh/three@0.160.0",
            "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.12?external=react,react-dom,three",
            "@react-three/drei": "https://esm.sh/@react-three/drei@9.96.1?external=react,react-dom,three,@react-three/fiber"
        }
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        /* =========================================
           SISTEMA MINIMALISTA — RAIL + FLOATING PANELS
           Apple HIG · iOS design language
           ========================================= */
        :root {
            --bg-main:          #f5f5f7;
            --bg-panel:         #f5f5f7;
            --bg-center:        #ffffff;
            --bg-card:          #ffffff;
            --bg-input:         #f2f2f7;
            --text-main:        #1d1d1f;
            --text-muted:       #86868b;
            --text-inverse:     #ffffff;
            --border:           rgba(0,0,0,0.08);
            --accent:           #007aff;
            --btn-hover:        #e5e5ea;
            --theme-inverse-bg: #1d1d1f;
            --theme-inverse-text:#ffffff;
        }

        [data-theme="dark"] {
            --bg-main:          #000000;
            --bg-panel:         #111111;
            --bg-center:        #1c1c1e;
            --bg-card:          #2c2c2e;
            --bg-input:         #3a3a3c;
            --text-main:        #f5f5f7;
            --text-muted:       #98989d;
            --text-inverse:     #111111;
            --border:           rgba(255,255,255,0.08);
            --btn-hover:        #3a3a3c;
            --theme-inverse-bg: #f5f5f7;
            --theme-inverse-text:#1d1d1f;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                         "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ── IDE WRAPPER ── */
        .ide-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            background-color: var(--bg-main);
        }

        /* ───────────────────────────────────────────
           HEADER ULTRAFINO — 44px, solo iconos
        ─────────────────────────────────────────── */
        .hdr {
            height: 44px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            gap: 4px;
            flex-shrink: 0;
            z-index: 300;
            position: relative;
        }
        .hdr-group { display: flex; align-items: center; gap: 2px; }
        .hdr-sep {
            width: 1px; height: 18px;
            background: var(--border);
            margin: 0 4px;
            flex-shrink: 0;
        }
        .hdr-logo {
            font-size: 9px; font-weight: 900;
            letter-spacing: 0.28em;
            color: var(--text-muted);
            padding: 0 6px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* Header Button */
        .hb {
            width: 32px; height: 32px;
            border-radius: 7px;
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            transition: background 0.12s, color 0.12s;
            flex-shrink: 0;
        }
        .hb svg { width: 16px; height: 16px; }
        .hb:hover { background: var(--btn-hover); color: var(--text-main); }
        .hb:active { transform: scale(0.93); }
        .hb.on { background: var(--text-main); color: var(--bg-main); }
        .hb:disabled { opacity: 0.25; cursor: not-allowed; pointer-events: none; }
        /* view tabs ligeramente más anchos */
        .hb.vw { width: 34px; border-radius: 8px; }

        /* ── Clusters funcionales del header ─────────────────────────
           Agrupan botones por función (Vista · Cámara · Edición ·
           Historial) con borde sutil y micro-etiqueta. Grayscale puro:
           solo vars del tema, sin colores nuevos. */
        .hdr-cluster {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 2px 5px 2px 6px;
            border: 1px solid var(--border);
            border-radius: 10px;
        }
        .hdr-cluster-label {
            font-size: 7px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-right: 3px;
            user-select: none;
            pointer-events: none;
        }
        @media (max-width: 800px) {
            .hdr-cluster { padding: 2px; border-color: transparent; }
            .hdr-cluster-label { display: none; }
        }

        /* ───────────────────────────────────────────
           RSX — CAPA DE DIAGNÓSTICO DEL PANEL RESULTADOS
           Jerarquía: estado → alerta única → diagnóstico →
           recomendaciones → detalle técnico colapsado.
           Paleta estricta: gris=info · verde=cumple ·
           rojo=incumple · azul=dato técnico.
        ─────────────────────────────────────────── */
        .rsx-summary { padding: 10px 14px 4px; }
        .rsx-title {
            font-size: 9px; font-weight: 800; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--text-muted);
            margin-bottom: 6px;
        }
        .rsx-row {
            display: flex; align-items: center; gap: 8px;
            padding: 5px 8px; border-radius: 8px;
        }
        .rsx-row + .rsx-row { margin-top: 2px; }
        .rsx-row.bad { background: rgba(255,59,48,0.06); }
        .rsx-dot { width: 14px; text-align: center; font-weight: 900; font-size: 11px; flex-shrink: 0; }
        .rsx-dot.ok  { color: #34c759; }
        .rsx-dot.bad { color: #ff3b30; }
        .rsx-dot.na  { color: var(--text-muted); }
        .rsx-lbl {
            flex: 1; font-size: 10px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.04em;
            color: var(--text-main);
        }
        .rsx-val { font-size: 10px; font-weight: 900; color: var(--text-main); font-variant-numeric: tabular-nums; white-space: nowrap; }
        .rsx-lim { color: var(--text-muted); font-weight: 700; }
        .rsx-delta { font-size: 8px; font-weight: 800; color: var(--text-muted); margin-left: 4px; }
        .rsx-alert {
            margin: 10px 14px 0; padding: 10px 12px;
            border: 1.5px solid #ff3b30; border-radius: 12px;
            background: rgba(255,59,48,0.07);
        }
        .rsx-alert-t { font-size: 11px; font-weight: 900; color: #ff3b30; }
        .rsx-alert-s { font-size: 10px; font-weight: 700; color: var(--text-main); margin-top: 2px; }
        .rsx-diag {
            margin: 8px 14px 0; padding: 10px 12px;
            border: 1px solid var(--border); border-radius: 12px;
            background: var(--bg-card);
        }
        .rsx-diag-grid { display: flex; gap: 10px; margin: 6px 0; }
        .rsx-diag-cell { flex: 1; }
        .rsx-cell-l { font-size: 8px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); }
        .rsx-cell-v { font-size: 13px; font-weight: 900; color: var(--text-main); font-variant-numeric: tabular-nums; }
        .rsx-bar { height: 5px; border-radius: 3px; background: var(--bg-input); overflow: hidden; margin: 6px 0 4px; }
        .rsx-bar-fill { height: 100%; border-radius: 3px; background: #ff3b30; }
        .rsx-msg { font-size: 9px; font-weight: 700; color: var(--text-main); }
        .rsx-rec { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border); }
        .rsx-rec-t { font-size: 8px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); margin-bottom: 3px; }
        .rsx-rec ul { margin: 0; padding-left: 14px; }
        .rsx-rec li { font-size: 9px; font-weight: 600; color: var(--text-main); line-height: 1.5; }

        /* ───────────────────────────────────────────
           MAIN LAYOUT — rail | viewer | rail
        ─────────────────────────────────────────── */
        .ml {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
            min-height: 0;
        }

        /* ── ICON RAIL ── */
        .rail {
            width: 48px;
            flex-shrink: 0;
            background: var(--bg-card);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            gap: 2px;
            z-index: 20;
            border-right: 1px solid var(--border);
        }
        .rail.rail-r {
            border-right: none;
            border-left: 1px solid var(--border);
        }

        /* Rail Button */
        .rb {
            width: 36px; height: 36px;
            border-radius: 9px;
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: background 0.12s, color 0.12s;
            position: relative;
        }
        .rb svg { width: 18px; height: 18px; }
        .rb:hover { background: var(--btn-hover); color: var(--text-main); }
        .rb:active { transform: scale(0.93); }
        .rb.on { background: var(--text-main); color: var(--bg-main); }
        .rb:disabled { opacity: 0.25; cursor: not-allowed; pointer-events: none; }
        /* ──────────────────────────────────────────────────────────
           MACRO-ICON RAIL — 4 grupos jerárquicos en rail izquierdo
           Cada macroicono: icono SVG 17px + etiqueta tipográfica 6px
        ────────────────────────────────────────────────────────── */
        .rb-macro {
            width: 40px;
            height: 54px;
            border-radius: 10px;
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: background 0.12s, color 0.12s;
            position: relative;
            flex-shrink: 0;
        }
        .rb-macro svg { width: 17px; height: 17px; }
        .rb-macro:hover { background: var(--btn-hover); color: var(--text-main); }
        .rb-macro:active { transform: scale(0.93); }
        .rb-macro.on { background: var(--text-main); color: var(--bg-main); }
        .rb-macro:disabled { opacity: 0.25; cursor: not-allowed; pointer-events: none; }
        .rb-macro .rb-label {
            font-size: 6px;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: center;
            line-height: 1;
            opacity: 0.7;
        }
        .rb-macro.on .rb-label { opacity: 1; }
        .rb-macro .pip {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: #ff3b30;
            position: absolute;
            top: 5px; right: 5px;
            display: none;
        }
        .rb-macro.alert .pip { display: block; }

        /* Divisor semántico entre macrogrupos del rail */
        .rail-group-sep {
            width: 20px; height: 1px;
            background: var(--border);
            margin: 5px 0;
            flex-shrink: 0;
        }

        /* ── PANEL HEADER MACRO — cabecera semántica en floating panels ── */
        .ph-macro {
            padding: 14px 14px 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .ph-macro .ph-tag {
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .ph-macro .ph-tag svg { width: 10px; height: 10px; opacity: 0.6; flex-shrink: 0; }
        .ph-macro .ph-title {
            font-size: 12px;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }
        .ph-macro .ph-sub {
            font-size: 9px;
            font-weight: 600;
            color: var(--text-muted);
            margin-top: 1px;
        }
        .ph-macro .ph-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 7px;
            border-radius: 8px;
            font-size: 7px;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-top: 5px;
            align-self: flex-start;
        }
        .ph-badge.badge-input  { background: rgba(0,122,255,0.1);  color: #007aff; border: 1px solid rgba(0,122,255,0.2); }
        .ph-badge.badge-output { background: rgba(52,199,89,0.1);  color: #34c759; border: 1px solid rgba(52,199,89,0.2); }
        .ph-badge.badge-warn   { background: rgba(255,59,48,0.1);  color: #ff3b30; border: 1px solid rgba(255,59,48,0.2); }

        /* ── METRIC OUTPUT CARDS — resultados read-only ── */
        .metric-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 0 14px 10px;
        }
        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            position: relative;
            overflow: hidden;
        }
        .metric-card.full-width { grid-column: span 2; }
        .metric-card.accent-l  { border-left: 3px solid var(--accent); }
        .metric-card.accent-g  { border-left: 3px solid #34c759; }
        .metric-card.accent-r  { border-left: 3px solid #ff3b30; }
        .mc-label { font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); }
        .mc-value { font-size: 26px; font-weight: 900; color: var(--text-main); line-height: 1; letter-spacing: -0.02em; }
        .mc-value.sm { font-size: 18px; }
        .mc-unit  { font-size: 8px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
        .mc-status {
            display: inline-flex; align-items: center; gap: 3px;
            padding: 2px 6px; border-radius: 5px;
            font-size: 7px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em;
            margin-top: 3px; align-self: flex-start;
        }
        .mc-status.ok   { background: rgba(52,199,89,0.12); color: #34c759; }
        .mc-status.warn { background: rgba(255,59,48,0.10); color: #ff3b30; }
        .mc-status.info { background: rgba(0,122,255,0.10); color: #007aff; }

        /* ── PANEL TAB SWITCHER — Volumetría interna ── */
        .panel-tabs {
            display: flex;
            gap: 3px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .panel-tab {
            flex: 1;
            padding: 6px 4px;
            border-radius: 7px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            cursor: pointer;
            transition: background 0.12s, color 0.12s;
            text-align: center;
        }
        .panel-tab:hover { background: var(--btn-hover); color: var(--text-main); }
        .panel-tab.active { background: var(--text-main); color: var(--bg-main); border-color: var(--text-main); }

        /* Sección title dentro de ResultsPanel */
        .rs-section-title {
            font-size: 8px; font-weight: 900; letter-spacing: 0.18em;
            text-transform: uppercase; color: var(--text-muted);
            padding: 10px 14px 6px;
        }

        .rb .pip {
            width: 4px; height: 4px;
            border-radius: 50%;
            background: #ff3b30;
            position: absolute;
            bottom: 3px;
            display: none;
        }
        .rb.alert .pip { display: block; }
        .rb .pip-blue { background: var(--accent); }

        .rail-divider {
            width: 28px; height: 1px;
            background: var(--border);
            margin: 4px 0;
            flex-shrink: 0;
        }
        .rail-counter {
            font-size: 9px; font-weight: 900;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.2;
        }

        /* ───────────────────────────────────────────
           FLOATING PANEL — overlay sobre el viewer
        ─────────────────────────────────────────── */
        .fp {
            position: absolute;
            top: 0; bottom: 0;
            left: 48px;
            width: 300px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            z-index: 100;
            animation: fpIn 0.18s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 6px 0 24px rgba(0, 0, 0, 0.14);
        }
        .fp.fp-r {
            left: auto;
            right: 48px;
            border-right: none;
            border-left: 1px solid var(--border);
            box-shadow: -6px 0 24px rgba(0, 0, 0, 0.14);
            animation: fpInR 0.18s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        @keyframes fpIn  { from { transform: translateX(-14px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fpInR { from { transform: translateX(14px);  opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Backdrop semitransparente */
        .fp-backdrop {
            position: absolute;
            inset: 0;
            z-index: 90;
            background: rgba(0, 0, 0, 0.06);
        }
        [data-theme="dark"] .fp-backdrop { background: rgba(0, 0, 0, 0.28); }

        /* ── VIEWER AREA ── */
        .va {
            flex: 1;
            min-width: 0;
            min-height: 0;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── Componentes legados que siguen usándose ── */
        .panel-scroll { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
        .theme-card { background: var(--bg-card); border-radius: 14px; padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--border); }
        .theme-input { background: var(--bg-input); border: 1px solid transparent; border-radius: 8px; padding: 7px 10px; width: 100%; font-size: 13px; font-weight: 600; color: var(--text-main); transition: border-color 0.15s; box-sizing: border-box; }
        .theme-input:focus { background: var(--bg-card); border-color: var(--accent); outline: none; }
        .theme-input:disabled { opacity: 0.4; cursor: not-allowed; }
        .theme-text { color: var(--text-main); }
        .theme-text-muted { color: var(--text-muted); }
        .theme-bg-inverse { background: var(--theme-inverse-bg); color: var(--theme-inverse-text); }
        .theme-border { border-color: var(--border) !important; }

        /* ios-btn: usado internamente en LeftPanel / RightPanel */
        .ios-btn {
            background: transparent; color: var(--text-main); border: 1px solid transparent;
            padding: 5px 10px; border-radius: 8px; font-weight: 700; cursor: pointer;
            transition: background 0.12s; font-size: 10px; text-align: center;
            text-transform: uppercase; letter-spacing: 0.06em;
            display: flex; align-items: center; justify-content: center; gap: 4px;
        }
        .ios-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
        .ios-btn:hover { background: var(--btn-hover); }
        .ios-btn:active { transform: scale(0.96); }
        .ios-btn.active { background: var(--theme-inverse-bg); color: var(--theme-inverse-text); }
        .ios-btn:disabled { opacity: 0.28; cursor: not-allowed; pointer-events: none; }

        .btn-solid { border: none; padding: 9px; font-size: 11px; font-weight: 700; color: #fff; border-radius: 8px; cursor: pointer; transition: opacity 0.15s; text-transform: uppercase; letter-spacing: 0.08em; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-solid:hover { opacity: 0.88; }

        .bar-container { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 4px; }
        .bar-fill { height: 100%; transition: width 0.3s ease; border-radius: 2px; }

        /* 3D viewer ocupa TODA la va */
        .viewer-3d-container {
            flex: 1;
            position: relative;
            background: transparent;
            min-height: 0;
            overflow: hidden;
            touch-action: none;
            pointer-events: auto;
        }
        .viewer-3d-container canvas { width: 100% !important; height: 100% !important; display: block; outline: none; }

        .viewer-2d-container { background: transparent; position: relative; display: flex; flex-direction: column; flex-shrink: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; cursor: grab; }
        .viewer-2d-container:active { cursor: grabbing; }

        /* Resizer horizontal (2D split) */
        .resizer-h { height: 5px; background: transparent; cursor: row-resize; z-index: 50; flex-shrink: 0; transition: background 0.12s; border-top: 1px solid var(--border); }
        .resizer-h:hover, .resizer-h:active { background: var(--accent); opacity: 0.3; }

        /* ─────────────────────────────────────────
           MOBILE — sin dock inferior
           El header es la única barra de navegación.
           G6 (botones de panel) visible solo en móvil.
           Los rails se ocultan; los paneles abren
           desde el header o se swipe-to-dismiss.
        ───────────────────────────────────────── */
        .desktop-only { display: flex; }
        .mobile-only  { display: none; }

        /* G6 panel toggles — ocultos en header móvil, sustituidos por bottom nav */
        .mobile-panel-btns { display: none; }

        /* ── DRAG HANDLE — indicador superior del bottom sheet ── */
        .sheet-handle { display: none; }

        /* ── BOTTOM NAV BAR — base hidden, solo en mobile portrait ── */
        .mobile-bottom-nav { display: none; }
        .mobile-nav-btn    { display: none; }

        /* ══════════════════════════════════════════════════════════════════
           MOBILE PORTRAIT — PATRÓN INSTAGRAM REELS
           ─────────────────────────────────────────────────────────────────
           Viewer 3D visible SIEMPRE (como el video en Reels).
           Bottom Nav Bar persistente en el borde inferior.
           Panel sube desde abajo (58vh), dejando el viewer visible arriba.
           Handle bar en el borde superior del panel: toca para cerrar.
           Backdrop entre viewer y panel: toca para cerrar.
           ══════════════════════════════════════════════════════════════════ */
        @media (max-width: 800px) {
            .desktop-only { display: none !important; }
            .mobile-only  { display: flex !important; }

            /* G6 header → oculto. Acceso solo por bottom nav */
            .mobile-panel-btns { display: none !important; }

            .hdr { height: 48px; padding: 0 6px; }

            /* Rails ocultos */
            .rail { display: none !important; }

            /* ── DRAG HANDLE — barra visual en la cima del bottom sheet ── */
            .sheet-handle {
                display: block;
                width: 40px;
                height: 4px;
                background: var(--border);
                border-radius: 2px;
                margin: 10px auto 2px;
                flex-shrink: 0;
                cursor: pointer;
                transition: background 0.15s, transform 0.15s;
            }
            .sheet-handle:active {
                transform: scaleX(0.80);
                background: var(--text-muted);
            }

            /* ── BOTTOM SHEET — sube sobre bottom nav, viewer siempre visible ── */
            .fp, .fp.fp-r {
                left: 0;
                right: 0;
                width: 100%;
                bottom: 56px;
                top: auto;
                border: none;
                border-top: 1px solid var(--border);
                border-radius: 16px 16px 0 0;
                box-shadow: 0 -16px 48px rgba(0, 0, 0, 0.22);
                animation: fpMob 0.30s cubic-bezier(0.34, 1.20, 0.64, 1);
                max-height: 58vh;
            }

            /* Soporte para safe-area iPhone */
            @supports (padding-bottom: env(safe-area-inset-bottom)) {
                .fp, .fp.fp-r {
                    bottom: calc(56px + env(safe-area-inset-bottom));
                }
            }

            @keyframes fpMob {
                from { transform: translateY(32px); opacity: 0; }
                to   { transform: translateY(0);    opacity: 1; }
            }

            /* Backdrop: cubre el viewer pero NO la bottom nav */
            .fp-backdrop {
                bottom: 56px;
                background: rgba(0, 0, 0, 0.05);
            }

            @supports (padding-bottom: env(safe-area-inset-bottom)) {
                .fp-backdrop {
                    bottom: calc(56px + env(safe-area-inset-bottom));
                }
            }

            /* ── BOTTOM NAVIGATION BAR — 5 secciones persistentes ── */
            .mobile-bottom-nav {
                display: flex;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                height: 56px;
                background: var(--bg-card);
                border-top: 1px solid var(--border);
                z-index: 250;
                align-items: stretch;
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }

            .mobile-nav-btn {
                display: flex;
                flex: 1;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 3px;
                background: transparent;
                border: none;
                cursor: pointer;
                color: var(--text-muted);
                transition: color 0.12s, opacity 0.12s;
                padding: 6px 2px;
                position: relative;
                -webkit-tap-highlight-color: transparent;
            }

            .mobile-nav-btn svg {
                width: 19px;
                height: 19px;
            }

            .mobile-nav-btn .nav-label {
                font-size: 6.5px;
                font-weight: 900;
                letter-spacing: 0.10em;
                text-transform: uppercase;
                line-height: 1;
            }

            /* Estado activo: línea superior + color fuerte */
            .mobile-nav-btn.nav-active { color: var(--text-main); }

            .mobile-nav-btn.nav-active::before {
                content: '';
                position: absolute;
                top: 0;
                left: 50%;
                transform: translateX(-50%);
                width: 30px;
                height: 2px;
                background: var(--text-main);
                border-radius: 0 0 3px 3px;
            }

            /* Pip de alerta normativa */
            .mobile-nav-btn .nav-pip {
                width: 5px;
                height: 5px;
                border-radius: 50%;
                background: #ff3b30;
                position: absolute;
                top: 7px;
                right: calc(50% - 16px);
                pointer-events: none;
            }

            .mobile-nav-btn:active { opacity: 0.60; }

            /* ── LANDSCAPE: vuelve al modo panel lateral de la versión desktop ── */
            @media (orientation: landscape) {
                .mobile-bottom-nav  { display: none; }
                .mobile-panel-btns  { display: flex !important; }
                .sheet-handle       { display: none; }

                .fp, .fp.fp-r {
                    bottom: 0;
                    top: 0;
                    border-radius: 0;
                    max-height: 100%;
                    width: 280px;
                }
                .fp {
                    left: 0;
                    right: auto;
                    border-top: none;
                    border-right: 1px solid var(--border);
                    animation: fpIn 0.18s cubic-bezier(0.25, 0.46, 0.45, 0.94);
                }
                .fp.fp-r {
                    right: 0;
                    left: auto;
                    border-top: none;

        const PolyGeo = {
            // Área con signo (positiva=CCW, negativa=CW) — Shoelace
            signedArea(pts) {
                let a = 0;
                for (let i = 0, n = pts.length; i < n; i++) {
                    const j = (i + 1) % n;
                    a += pts[i].x * pts[j].y - pts[j].x * pts[i].y;

            // Centroid
            centroid(pts) {
                const a6 = 6 * this.signedArea(pts);
                let cx = 0, cy = 0;
                for (let i = 0, n = pts.length; i < n; i++) {
                    const j = (i + 1) % n;
                    const c = pts[i].x * pts[j].y - pts[j].x * pts[i].y;
                    cx += (pts[i].x + pts[j].x) * c;

            // Uses line-line intersection of adjacent offset edges to compute new vertices.
            offsetPerEdge(pts, dists) {
                const n = pts.length;
                if (n < 3) return [...pts];
                // Compute inward edge normals (for CCW polygon, inward = right of direction)
                const sa = this.signedArea(pts);
                const sign = sa > 0 ? 1 : -1; // CCW=+1 → inward is right = -perp
                const edgeNormals = [];
                for (let i = 0; i < n; i++) {
                    const a = pts[i], b = pts[(i+1)%n];
                    const dx = b.x - a.x, dy = b.y - a.y;
                    const len = Math.sqrt(dx*dx + dy*dy) || 1;
                    // Inward normal for CCW: rotate direction 90° clockwise = (dy/len, -dx/len)
                    edgeNormals.push({ x: sign * dy/len, y: -sign * dx/len });
                }
                // Offset each edge: shift by dist[i] * inward_normal
                // Edge i goes from pts[i]+off_i to pts[(i+1)%n]+off_i
                const offEdges = [];
                for (let i = 0; i < n; i++) {
                    const d = Number(dists[i]) || 0;
                    const nx = edgeNormals[i].x * d, ny = edgeNormals[i].y * d;
                    offEdges.push({
                        p1: { x: pts[i].x + nx,       y: pts[i].y + ny },
                        p2: { x: pts[(i+1)%n].x + nx, y: pts[(i+1)%n].y + ny }
                    });
                }
                // New vertex i = intersection of offset edge (i-1) and edge i
                const lineLine = (p1,p2,p3,p4) => {
                    const dx1=p2.x-p1.x, dy1=p2.y-p1.y;
                    const dx2=p4.x-p3.x, dy2=p4.y-p3.y;
                    const denom = dx1*dy2 - dy1*dx2;
                    if (Math.abs(denom) < 1e-10) return { x:(p1.x+p3.x)/2, y:(p1.y+p3.y)/2 };
                    const t = ((p3.x-p1.x)*dy2-(p3.y-p1.y)*dx2)/denom;
                    return { x: p1.x+t*dx1, y: p1.y+t*dy1 };
                };
                const result = [];
                for (let i = 0; i < n; i++) {
                    const prev = offEdges[(i+n-1)%n];
                    const cur  = offEdges[i];
                    result.push(lineLine(prev.p1, prev.p2, cur.p1, cur.p2));
                }
                return result;
            },
            // Check if polygon is still valid (non-degenerate) after offset
            isValid(pts) { return pts.length >= 3 && this.area(pts) > 0.01; },
            // Normalize polygon to centroid-origin, scale to meters
            normalize(pts) {
                const c = this.centroid(pts);
                return pts.map(p => ({ x: p.x - c.x, y: p.y - c.y }));
            },
            // Perimeter
            perimeter(pts) {
                let p = 0;

                    const j = (i+1)%pts.length;

                    p += Math.sqrt(dx*dx+dy*dy);

            // Works for both CW and CCW polygons. Returns clipped polygon.
            clipToRect(pts, rect) {
                if(!pts||pts.length<3) return [];
                const {minX,maxX,minY,maxY} = rect;
                // Each clip edge defined so "inside" is to the left of the directed edge
                // For a CCW rect the edges go: bottom→right, right→top, top→left, left→bottom
                const edges=[
                    [minX,minY, maxX,minY], // bottom edge: left→right, inside = above (y>minY)
                    [maxX,minY, maxX,maxY], // right edge:  bottom→top, inside = left of (x<maxX)
                    [maxX,maxY, minX,maxY], // top edge:    right→left, inside = below (y<maxY)
                    [minX,maxY, minX,minY], // left edge:   top→bottom, inside = right of (x>minX)
                ];
                const clipEdge=(poly,x0,y0,x1,y1)=>{
                    if(!poly.length) return [];
                    const out=[];
                    const inside=(p)=>(x1-x0)*(p.y-y0)-(y1-y0)*(p.x-x0)>=0;
                    const intersect=(a,b)=>{
                        const dx=b.x-a.x,dy=b.y-a.y,ex=x1-x0,ey=y1-y0;
                        const denom=dx*ey-dy*ex;
                        if(Math.abs(denom)<1e-10) return a;
                        const t=((x0-a.x)*ey-(y0-a.y)*ex)/denom;
                        return {x:a.x+t*dx,y:a.y+t*dy};
                    };
                    for(let i=0;i<poly.length;i++){
                        const a=poly[i],b=poly[(i+1)%poly.length];
                        const ai=inside(a),bi=inside(b);
                        if(ai){out.push({...a});if(!bi)out.push(intersect(a,b));}
                        else if(bi){out.push(intersect(a,b));}
                    }
                    return out;
                };
                let p=[...pts];
                for(const [x0,y0,x1,y1] of edges){ p=clipEdge(p,x0,y0,x1,y1); if(!p.length) return []; }
                return p;
            }
        };
