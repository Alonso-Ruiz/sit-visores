                                        />
                                        <Grid position={[0,-0.05,0]} args={[500,500]} cellSize={2} cellThickness={0.3} cellColor={isDarkMode?'#34473e':'#cdd8ca'} sectionSize={10} sectionThickness={0.7} sectionColor={isDarkMode?'#526a5b':'#aabaad'} fadeDistance={350}/>
                                        <ContactShadows position={[0,-0.25,0]} opacity={0.22} scale={250} blur={2} far={20}/>
                                        <OrbitControls makeDefault enableDamping dampingFactor={0.05} minDistance={5} maxDistance={3000} maxPolarAngle={Math.PI/2+0.1} enabled={!activeExtrusion}/>
                                    </Canvas>
                                </div>
                            )}

                            {/* ── VISTA 2D: corte intercalado ── */}
                            {activeView === '2d' && (
                                <div style={{ flex: 1, minHeight: 0, position: 'relative', overflow: 'hidden' }}>
                                    <div style={{ position:'absolute', top:10, left:'50%', transform:'translateX(-50%)', fontSize:8, fontWeight:900, letterSpacing:'0.18em', color: isDarkMode?'rgba(255,255,255,0.28)':'rgba(0,0,0,0.28)', textTransform:'uppercase', zIndex:5, pointerEvents:'none' }}>
                                        Corte A–A′ · {config.floors.length} Nivel(es) · H = {sys.indicators.hTotal.toFixed(1)}m
                                    </div>
                                    <Elevation2D sys={sys} isDarkMode={isDarkMode}/>
                                </div>
                            )}

                            {/* ── VISTA PLANTA — Dibujar / importar lote ── */}
                            {activeView === 'plant' && (
                                <PlantView
                                    polygon={config.lotePoligono || null}
                                    setPolygon={(poly) => {
                                        if (poly && poly.length >= 3) {
                                            // ALWAYS normalize to centroid-origin so 3D aligns at 0,0
                                            const norm = PolyGeo.normalize(PolyGeo.ensureCCW(poly));
                                            const bb = PolyGeo.bbox(norm);
                                            updateConfig('lotePoligono', norm);
                                            updateConfig('loteFrente', parseFloat(bb.w.toFixed(2)));
                                            updateConfig('loteFondo',  parseFloat(bb.h.toFixed(2)));
                                        } else {
                                            updateConfig('lotePoligono', null);
                                        }
                                    }}
                                    isDarkMode={isDarkMode}
                                    sys={sys}
                                    config={config}
                                    updateConfig={updateConfig}
                                    commitState={commitState}
                                    selectedEdge={selectedEdge}
                                    setSelectedEdge={setSelectedEdge}
                                />
                            )}
                        </div>
                        {/* /va */}

                        {/* programa panel → ProgPanel en rail izquierdo */}

                        {/* ── RAIL DERECHO ── */}
                        <div className="rail rail-r">

                            <button
                                className="rb"
                                onClick={() => { commitState(); updateConfig('floors', [...config.floors, { id: Date.now(), type: 'res', h: 3, isCollapsed: false, blockMods: {}, areaViv: 75, dorm: 3, pctCirculacion: 15 }]); }}
                                title="Añadir piso residencial"
                            >
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" width="18" height="18"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            </button>

                            <button
                                className="rb"
                                onClick={() => { commitState(); if (config.floors.length > 0) updateConfig('floors', config.floors.slice(0,-1)); }}
                                title="Eliminar último piso"
                                disabled={config.floors.length === 0}
                                style={{ opacity: config.floors.length === 0 ? 0.25 : 1 }}
                            >
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" width="18" height="18"><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            </button>

                            <div className="rail-divider"/>

                            <div className="rail-counter">
                                {config.floors.length}<br/>
                                <span style={{fontSize:7, letterSpacing:'0.05em'}}>PIS</span>
                            </div>
                        </div>

                    </div>
                    {/* /ml */}

                    {/* ═══════════════════════════════════════════════════════════════
                        MOBILE BOTTOM NAVIGATION — Patrón Instagram Reels
                        ─────────────────────────────────────────────────────────────
                        Visible SOLO en mobile portrait (max-width: 800px).
                        El viewer 3D permanece visible e interactivo por encima.
                        Cada botón abre un bottom-sheet que sube sobre esta barra.
                        Tocar el mismo ícono activo cierra el panel (toggle).
                        ═══════════════════════════════════════════════════════════════ */}
                    <nav className="mobile-bottom-nav">

                        {/* ① LOTE — Contexto Urbano */}
                        <button
                            className={`mobile-nav-btn ${openPanel === 'contexto' ? 'nav-active' : ''}`}
                            onClick={() => togglePanel('contexto')}
                            title="Lote · Vías · Retiros"
                        >
                            <Icons.CtxUrban/>
                            <span className="nav-label">Lote</span>
                        </button>

                        {/* ② NORMA — Normativa Edificatoria (con pip de alerta) */}
                        <button
                            className={`mobile-nav-btn ${openPanel === 'normativa' ? 'nav-active' : ''}`}
                            onClick={() => togglePanel('normativa')}
                            title="CE · Área Libre · Altura"
                        >
                            <Icons.CtxNorm/>
                            <span className="nav-label">Reglas</span>
                            {(sys.indicators.isExcessH || sys.indicators.isExcessCE || sys.indicators.isExcessHuella) && (
                                <span className="nav-pip"/>
                            )}
                        </button>

                        {/* ③ FORMA — Morfología */}
                        <button
                            className={`mobile-nav-btn ${openPanel === 'morfo' ? 'nav-active' : ''}`}
                            onClick={() => togglePanel('morfo')}
                            title="Morfología · Formas · Zonas"
                        >
                            <Icons.CtxVol/>
                            <span className="nav-label">Forma</span>
                        </button>

                        {/* ④ PROG — Programa Arquitectónico */}
                        <button
                            className={`mobile-nav-btn ${openPanel === 'programa' ? 'nav-active' : ''}`}
                            onClick={() => togglePanel('programa')}
                            title="Pisos · Usos · Estacionamientos"
                        >
                            <Icons.GridBuild/>
                            <span className="nav-label">Pisos y usos</span>
                        </button>

                        {/* ⑤ DATOS — Resultados */}
                        

                    </nav>

                    {showReport && (
                        <TechnicalReportModal
                            sys={sys}
                            config={config}
                            glRef={glRef}
                            onClose={() => setShowReport(false)}
                            buildAndExportPDF={buildAndExportPDF}
                            validateCompliance={validateCompliance}
                            generateUrbanNarrative={generateUrbanNarrative}
                        />
                    )}
                </div>
            );
        };




        const root = createRoot(document.getElementById('root'));
        root.render(<App />);

        // ==========================================
        // SISTEMA DRAG & DROP DE ARCHIVOS EXTERNOS
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            const dropZone = document.getElementById('root');
            
            // Prevenir comportamiento por defecto del navegador
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, preventDefaults, false);
                document.body.addEventListener(eventName, preventDefaults, false);
            });
            
            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }
            
            // Visual feedback durante drag
            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => {
                    dropZone.style.outline = '3px dashed var(--accent)';
                    dropZone.style.outlineOffset = '-10px';
                }, false);
            });
            
            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => {
                    dropZone.style.outline = 'none';
                }, false);
            });
            
            // Manejar drop
            dropZone.addEventListener('drop', handleDrop, false);
            
            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;
                
                if (files.length === 0) return;
                
                const file = files[0];
                const ext = file.name.split('.').pop().toLowerCase();
                
                // Validar tipo de archivo
                if (!['xlsx', 'xls', 'csv'].includes(ext)) {
                    alert('❌ Solo se aceptan archivos Excel (.xlsx, .xls) o CSV');
                    return;
                }
                
                // Disparar evento personalizado para React
                window.dispatchEvent(new CustomEvent('fileDropped', { 
                    detail: { file, type: ext } 
                }));
            }
        });
        // Enviar estado al parent React cada vez que cambia algo importante
function syncStateToParent(state) {
    if (window.parent !== window) {
        window.parent.postMessage({ type: 'SIMULATOR_STATE', data: state }, '*');
    }
}
    </script>
</body>
