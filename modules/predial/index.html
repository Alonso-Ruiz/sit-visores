                    const oppI = activeExtrusion.modifiesGlobal ? 0 : (blockMods.retI || 0);
                    const MIN_DIM = 0.5; // mínimo 50cm de bloque visible
                    if (activeExtrusion.face === 'retF') newRet = Math.max(0, Math.min(newRet, lotD - oppP - MIN_DIM));
                    if (activeExtrusion.face === 'retP') newRet = Math.max(0, Math.min(newRet, lotD - oppF - MIN_DIM));
                    if (activeExtrusion.face === 'retD') newRet = Math.max(0, Math.min(newRet, lotW - oppI - MIN_DIM));
                    if (activeExtrusion.face === 'retI') newRet = Math.max(0, Math.min(newRet, lotW - oppD - MIN_DIM));
                    
                    // Guardamos último delta para HUD
                    activeExtrusion._lastDelta = newRet - startRet;
                    activeExtrusion._lastVal = newRet;
                    
                    setConfig(prev => {
                        if (activeExtrusion.modifiesGlobal) {
                            return { ...prev, retirosNormativos: { ...prev.retirosNormativos, [activeExtrusion.normFace]: { ...prev.retirosNormativos[activeExtrusion.normFace], active: newRet > 0, val: Math.max(0, newRet) } } };
                        } else {
                            return { ...prev, floors: prev.floors.map(f => f.id === activeExtrusion.floorId ? { ...f, blockMods: { ...(f.blockMods || {}), [activeExtrusion.bIdx]: { ...((f.blockMods || {})[activeExtrusion.bIdx] || {retF:0, retP:0, retD:0, retI:0}), [activeExtrusion.face]: Math.max(0, newRet) } } } : f) };
                        }
                    });
                };
                
                const handleWindowUp = () => {
                    setActiveExtrusion(null); 
                    setHoveredFace(null); 
                    document.body.style.cursor = 'auto';
                };
                
                window.addEventListener('pointermove', handleWindowMove);
                window.addEventListener('pointerup', handleWindowUp);
                window.addEventListener('pointercancel', handleWindowUp);
                
                return () => {
                    window.removeEventListener('pointermove', handleWindowMove);
                    window.removeEventListener('pointerup', handleWindowUp);
                    window.removeEventListener('pointercancel', handleWindowUp);
                };
            }, [activeExtrusion, setActiveExtrusion, setConfig]);

            const renderEntorno = () => {
                const entorno = [];
                const drawPlane = (x1, x2, z1, z2, color, y, key) => (
                    <mesh key={key} position={[(x1+x2)/2, y, (z1+z2)/2]} rotation={[-Math.PI/2, 0, 0]} onPointerDown={handleCADClick}>
                        <planeGeometry args={[Math.max(0.1, x2-x1), Math.max(0.1, z2-z1)]} />
                        <meshStandardMaterial color={color} roughness={1} transparent={measureMode} opacity={measureMode ? 0.5 : 1} />
                    </mesh>
                );

                const l_zMax = dNum/2; const l_zMin = -dNum/2;
                const l_xMax = fNum/2; const l_xMin = -fNum/2;

                // ── Suelo global (calle) ──
                entorno.push(drawPlane(-100, 100, -100, 100, isDarkMode ? "#253830" : "#e0e8dd", -0.20, 'pista_global'));

                if (sys.geometry.hasCustomPoly && sys.geometry.lotePoly) {
                    const lotePoly   = sys.geometry.lotePoly;
                    const buildPoly3D = sys.geometry.buildPoly || lotePoly;
                    const hasRetiro   = sys.geometry.buildPoly
                        && PolyGeo.area(buildPoly3D) < PolyGeo.area(lotePoly) - 0.1;

                    const makeShape = (poly) => {
                        const s = new THREE.Shape();
                        s.moveTo(poly[0].x, -poly[0].y);
                        for(let i=1;i<poly.length;i++) s.lineTo(poly[i].x,-poly[i].y);
                        s.closePath();
                        return s;
                    };

                    // ── 1. VEREDA: franja exterior al lote para caras con vía pública ──────
                    const viasCaras3D = config.viasCaras || [];
                    const VEREDA_W    = 2.5;
                    // Signo del winding de lotePoly en PolyGeo:
                    // si CCW (sa>0) → al convertir con -y queda CW en Three.js XZ → outward = rotate derecha = (dz,-dx)
                    // si CW  (sa<0) → al convertir con -y queda CCW en Three.js XZ → outward = rotate izq = (-dz, dx)
                    const lotePolySign = PolyGeo.signedArea(lotePoly) > 0 ? 1 : -1;

                    viasCaras3D.filter(v => v.active && v.edgeIdx < lotePoly.length).forEach((v, vi) => {
                        const ei  = v.edgeIdx;
                        const a   = lotePoly[ei];
                        const b   = lotePoly[(ei+1) % lotePoly.length];
                        const ax3 = a.x, az3 = -a.y;
                        const bx3 = b.x, bz3 = -b.y;
                        const segLen = Math.hypot(bx3-ax3, bz3-az3);
                        if(segLen < 0.01) return;

                        const dx3 = (bx3-ax3)/segLen, dz3 = (bz3-az3)/segLen;
                        // CCW en PolyGeo → CW en Three.js → outward = rotate derecha = (dz3, -dx3)
                        // multiplicamos por lotePolySign para cubrir ambos casos
                        const nx_out = lotePolySign * dz3;
                        const nz_out = lotePolySign * (-dx3);

                        const verts = new Float32Array([
                            ax3,                   0.01, az3,
                            bx3,                   0.01, bz3,
                            bx3 + nx_out*VEREDA_W, 0.01, bz3 + nz_out*VEREDA_W,
                            ax3 + nx_out*VEREDA_W, 0.01, az3 + nz_out*VEREDA_W,
                        ]);
                        const geomV = new THREE.BufferGeometry();
                        geomV.setAttribute('position', new THREE.BufferAttribute(verts, 3));
                        geomV.setIndex([0,1,2, 0,2,3]);
                        geomV.computeVertexNormals();
                        entorno.push(
                            <mesh key={`vereda_${vi}`} raycast={()=>null}>
                                <ManagedGeometry object={geomV}/>
                                <meshStandardMaterial
                                    color={isDarkMode ? "#4a4a4e" : "#c8c8cc"}
                                    roughness={0.9}
                                    side={THREE.DoubleSide}
                                />
                            </mesh>
                        );
                        const vBorderPts = [
                            new THREE.Vector3(ax3 + nx_out*VEREDA_W, 0.03, az3 + nz_out*VEREDA_W),
                            new THREE.Vector3(bx3 + nx_out*VEREDA_W, 0.03, bz3 + nz_out*VEREDA_W),
                        ];
                        entorno.push(
                            <line key={`vereda_border_${vi}`} raycast={()=>null}>
                                <bufferGeometry attach="geometry"
                                    {...new THREE.BufferGeometry().setFromPoints(vBorderPts)}/>
                                <lineBasicMaterial color={isDarkMode?"#636366":"#aeaeb2"} transparent opacity={0.6}/>
                            </line>
                        );
                    });

                    // ── 2. ZONA DE RETIRO: anillo entre lotePoly y buildPoly ──────────────
                    if (hasRetiro) {
                        // Shape con hole: exterior=lotePoly, agujero=buildPoly
                        const retShp  = makeShape(lotePoly);
                        const holePath = new THREE.Path();
                        holePath.moveTo(buildPoly3D[0].x, -buildPoly3D[0].y);
                        for(let i=1;i<buildPoly3D.length;i++)
                            holePath.lineTo(buildPoly3D[i].x, -buildPoly3D[i].y);
                        holePath.closePath();
                        retShp.holes = [holePath];
                        entorno.push(
                            <mesh key="retiro_fill" rotation={[-Math.PI/2,0,0]} position={[0,0.02,0]} raycast={()=>null}>
                                <shapeGeometry args={[retShp]}/>
                                <meshBasicMaterial
                                    color={isDarkMode ? "#5a2a2a" : "#ffdddd"}
                                    transparent opacity={0.75} depthWrite={false}
                                    side={THREE.DoubleSide}
                                />
                            </mesh>
                        );
                        // Línea de retiro (buildPoly border) — roja fina
                        const bpBorderPts = buildPoly3D.map(p => new THREE.Vector3(p.x, 0.05, -p.y));
                        bpBorderPts.push(bpBorderPts[0].clone());
                        entorno.push(
                            <line key="retiro_border" raycast={()=>null}>
                                <bufferGeometry attach="geometry"
                                    {...new THREE.BufferGeometry().setFromPoints(bpBorderPts)}/>
                                <lineBasicMaterial color="#ff3b30" transparent opacity={0.7}/>
                            </line>
                        );
                        // Zona edificable interior (blanca)
                        entorno.push(
                            <mesh key="lote_inner" rotation={[-Math.PI/2,0,0]} position={[0,0,0]} onPointerDown={handleCADClick}>
                                <shapeGeometry args={[makeShape(buildPoly3D)]}/>
                                <meshStandardMaterial color={isDarkMode?"#1c1c1e":"#ffffff"} roughness={1} side={THREE.DoubleSide}/>
                            </mesh>
                        );
                    } else {
                        // Sin retiro: lote completo blanco
                        entorno.push(
                            <mesh key="lote_poly" rotation={[-Math.PI/2,0,0]} position={[0,0,0]} onPointerDown={handleCADClick}>
                                <shapeGeometry args={[makeShape(lotePoly)]}/>
                                <meshStandardMaterial color={isDarkMode?"#1c1c1e":"#ffffff"} roughness={1} side={THREE.DoubleSide}/>
                            </mesh>
                        );
                    }

                    // ── 3. BORDE DEL LOTE (límite de propiedad) ──────────────────────────
                    const edgePts = lotePoly.map(p => new THREE.Vector3(p.x, 0.04, -p.y));
                    edgePts.push(edgePts[0].clone());
                    entorno.push(
                        <line key="lote_border">
                            <bufferGeometry attach="geometry"
                                {...new THREE.BufferGeometry().setFromPoints(edgePts)}/>
                            <lineBasicMaterial color={isDarkMode?"#ffffff":"#1d1d1f"} linewidth={2}/>
                        </line>
                    );

                } else {
                    // ── LOTE RECTANGULAR (sin polígono personalizado) ────────────────────
                    entorno.push(drawPlane(l_xMin, l_xMax, l_zMin, l_zMax, isDarkMode?"#1c1c1e":"#ffffff", 0.0, 'lote_base'));

                    // Veredas del lote rectangular — fuente unificada:
                    // viasCaras (face-based, escrito por UrbanoPanel) tiene PRIORIDAD;
                    // config.vias (legacy) es fallback solo si ninguna cara está activa.
                    // Espejo exacto de la lógica de hMaxVias en sys.
                    // Mapeo de aristas del rectángulo CCW del motor → lados visuales
                    // (idéntico a edgeDists / retiroEfectivo*):
                    //   edge 0 → frontal (z máx) · edge 1 → derecho (x máx)
                    //   edge 2 → posterior (z mín) · edge 3 → izquierdo (x mín)
                    const VEREDA_W_R = 2.5;
                    const viasLeg = config.vias || {};
                    const vcActivas = (config.viasCaras || []).filter(v => v.active);
                    const viaEnLado = (edgeIdx, legVia) => vcActivas.length > 0
                        ? vcActivas.some(v => v.edgeIdx === edgeIdx)
                        : !!legVia?.active;
                    if (viaEnLado(0, viasLeg.frontal))
                        entorno.push(drawPlane(l_xMin, l_xMax, l_zMax, l_zMax+VEREDA_W_R,
                            isDarkMode?"#4a4a4e":"#c8c8cc", 0.01, 'vereda_f'));
                    if (viaEnLado(2, viasLeg.posterior))
                        entorno.push(drawPlane(l_xMin, l_xMax, l_zMin-VEREDA_W_R, l_zMin,
                            isDarkMode?"#4a4a4e":"#c8c8cc", 0.01, 'vereda_p'));
                    if (viaEnLado(1, viasLeg.derecho))
                        entorno.push(drawPlane(l_xMax, l_xMax+VEREDA_W_R, l_zMin, l_zMax,
                            isDarkMode?"#4a4a4e":"#c8c8cc", 0.01, 'vereda_d'));
                    if (viaEnLado(3, viasLeg.izquierdo))
                        entorno.push(drawPlane(l_xMin-VEREDA_W_R, l_xMin, l_zMin, l_zMax,
                            isDarkMode?"#4a4a4e":"#c8c8cc", 0.01, 'vereda_i'));

                    // Franjas de retiro
                    if (sys.limits.retiroEfectivoFrontal > 0)
                        entorno.push(drawPlane(l_xMin, l_xMax,
                            l_zMax - sys.limits.retiroEfectivoFrontal, l_zMax,
                            isDarkMode?"#5a2a2a":"#ffdddd", 0.02, 'ret_f'));
                    if (sys.limits.retiroEfectivoPosterior > 0)
                        entorno.push(drawPlane(l_xMin, l_xMax,
                            l_zMin, l_zMin + sys.limits.retiroEfectivoPosterior,
                            isDarkMode?"#5a2a2a":"#ffdddd", 0.02, 'ret_p'));
                    if (sys.limits.retiroEfectivoDerecho > 0)
                        entorno.push(drawPlane(
                            l_xMax - sys.limits.retiroEfectivoDerecho, l_xMax,
                            l_zMin, l_zMax,
                            isDarkMode?"#5a2a2a":"#ffdddd", 0.02, 'ret_d'));
                    if (sys.limits.retiroEfectivoIzquierdo > 0)
                        entorno.push(drawPlane(
                            l_xMin, l_xMin + sys.limits.retiroEfectivoIzquierdo,
                            l_zMin, l_zMax,
                            isDarkMode?"#5a2a2a":"#ffdddd", 0.02, 'ret_i'));
                }

                return entorno;
            };

            // === COLOR DE LA CAJA LÍMITE: alerta cuando se excede (P1.1 + requisito explícito) ===
            const limitColor = sys.indicators.isExcessH ? "#ff3b30" : "#007aff";
            const limitOpacityFill = sys.indicators.isExcessH ? 0.12 : 0.08;
            const limitOpacityEdges = sys.indicators.isExcessH ? 0.85 : 0.6;

            // === Cota arquitectónica: dibuja líneas de extensión + ticks de 45° + label ===
            const renderArchDimension = (p1, p2) => {
                const mid = new THREE.Vector3((p1.x+p2.x)/2, (p1.y+p2.y)/2, (p1.z+p2.z)/2);
                const dist = p1.distanceTo(p2);
                const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
                // Vector perpendicular para los ticks (en el plano XZ)
                const perp = new THREE.Vector3(-dir.z, 0, dir.x).normalize();
                const tickSize = 0.3;
                const t1a = new THREE.Vector3().copy(p1).addScaledVector(perp, tickSize).addScaledVector(dir, -tickSize);
                const t1b = new THREE.Vector3().copy(p1).addScaledVector(perp, -tickSize).addScaledVector(dir, tickSize);
                const t2a = new THREE.Vector3().copy(p2).addScaledVector(perp, tickSize).addScaledVector(dir, -tickSize);
                const t2b = new THREE.Vector3().copy(p2).addScaledVector(perp, -tickSize).addScaledVector(dir, tickSize);
                const dimColor = isDarkMode ? "#f5f5f7" : "#1d1d1f";
                
                return (
                    <group>
                        {/* Línea principal */}
                        <lineSegments>
                            <bufferGeometry attach="geometry" {...new THREE.BufferGeometry().setFromPoints([p1, p2])} />
                            <lineBasicMaterial color={dimColor} linewidth={2} />
                        </lineSegments>
                        {/* Tick izquierdo (45°) */}
                        <lineSegments>
                            <bufferGeometry attach="geometry" {...new THREE.BufferGeometry().setFromPoints([t1a, t1b])} />
                            <lineBasicMaterial color={dimColor} linewidth={2} />
                        </lineSegments>
                        {/* Tick derecho (45°) */}
                        <lineSegments>
                            <bufferGeometry attach="geometry" {...new THREE.BufferGeometry().setFromPoints([t2a, t2b])} />
                            <lineBasicMaterial color={dimColor} linewidth={2} />
                        </lineSegments>
                        {/* Label arquitectónico (encima de la cota) */}
                        <Html position={[mid.x, mid.y + 0.3, mid.z]} center>
                            <div className="measure-label" style={{pointerEvents:'none', whiteSpace:'nowrap'}}>
                                {dist.toFixed(2)} m
                            </div>
                        </Html>
                    </group>
                );
            };

            // === HUD ΔX/ΔY/ΔZ durante extrusión y medición ===
            const renderDeltaHUD = () => {
                if (activeExtrusion && activeExtrusion._lastVal !== undefined) {
                    const labelMap = { retF: 'Frente', retP: 'Fondo', retD: 'Der.', retI: 'Izq.' };
                    return (
                        <Html position={[0, (sys.indicators.hTotal || 5) + 2, 0]} center>
                            <div className="measure-label" style={{pointerEvents:'none', whiteSpace:'nowrap', fontSize:'11px'}}>
                                Retiro {labelMap[activeExtrusion.face]}: {activeExtrusion._lastVal.toFixed(2)} m
                                {activeExtrusion._lastDelta !== 0 && <span style={{opacity:0.7, marginLeft:6}}>(Δ {activeExtrusion._lastDelta >= 0 ? '+' : ''}{activeExtrusion._lastDelta.toFixed(2)})</span>}
                            </div>
                        </Html>
                    );
                }
                if (measureMode && measurePts.length === 1 && currentMousePos) {
                    const dx = Math.abs(currentMousePos.x - measurePts[0].x);
                    const dy = Math.abs(currentMousePos.y - measurePts[0].y);
                    const dz = Math.abs(currentMousePos.z - measurePts[0].z);
                    return (
                        <Html position={[currentMousePos.x, currentMousePos.y + 0.5, currentMousePos.z]} center>
                            <div className="measure-label" style={{pointerEvents:'none', whiteSpace:'nowrap', fontSize:'10px'}}>
                                ΔX {dx.toFixed(2)} · ΔY {dy.toFixed(2)} · ΔZ {dz.toFixed(2)}
                            </div>
                        </Html>
                    );
                }
                return null;
            };

            return (
                <group onPointerMove={handleMeasurePointerMove}>
                    {renderEntorno()}

                    {/* ── RESALTADO DE CARA DEL LOTE ─────────────────────────────────── */}
                    {/* El plano vertical sigue la arista de buildPoly (cara real del bloque). */}
                    {/* La línea en el suelo sigue lotePoly (límite de propiedad).             */}
                    {selectedEdge !== null && selectedEdge !== undefined && (() => {
                        const lotePoly    = sys.geometry?.lotePoly;
                        const buildPoly3D = sys.geometry?.buildPoly || lotePoly;
                        if (!lotePoly || lotePoly.length < 2) return null;

                        const ei      = selectedEdge % lotePoly.length;
                        const retiroVal = (config.retirosCaras || []).find(r => r.edgeIdx === ei)?.val || 0;
                        const faceH   = Math.max(4, (sys.indicators.hTotal || 0) + 2);

                        // ── Arista del LOTE (límite de propiedad) ──
                        const a   = lotePoly[ei];
                        const b   = lotePoly[(ei + 1) % lotePoly.length];
                        const ax3 = a.x, az3 = -a.y;
                        const bx3 = b.x, bz3 = -b.y;
                        const ptA = new THREE.Vector3(ax3, 0.06, az3);
                        const ptB = new THREE.Vector3(bx3, 0.06, bz3);

                        // ── Arista del BUILDPOLY (cara real del bloque edificado) ──
                        const bpEi  = ei % buildPoly3D.length;
                        const bpa   = buildPoly3D[bpEi];
                        const bpb   = buildPoly3D[(bpEi + 1) % buildPoly3D.length];
                        const bpax3 = bpa.x, bpaz3 = -bpa.y;
                        const bpbx3 = bpb.x, bpbz3 = -bpb.y;
                        const bpSegLen = Math.hypot(bpbx3-bpax3, bpbz3-bpaz3);
                        const bpCx = (bpax3 + bpbx3) / 2;
                        const bpCz = (bpaz3 + bpbz3) / 2;
                        /* Rotación Y correcta para alinear el eje X local del plano con la
                           arista (dx, dz): θ = atan2(−dz, dx). La forma anterior atan2(dx, dz)
                           difiere en +90° constante → el plano se veía perpendicular a la cara. */
                        const bpAngle = Math.atan2(-(bpbz3 - bpaz3), bpbx3 - bpax3);

                        return (
                            <group key={`lot-face-hl-${ei}`} raycast={() => null}>

                                {/* Línea del límite de propiedad en el suelo — naranja */}
                                <line raycast={() => null}>
                                    <bufferGeometry attach="geometry"
                                        {...new THREE.BufferGeometry().setFromPoints([ptA, ptB])}
                                    />
                                    <lineBasicMaterial color="#ff9f0a" transparent opacity={0.9} linewidth={3}/>
                                </line>

                                {/* Plano vertical sobre la cara EDIFICABLE (buildPoly) */}
                                {bpSegLen > 0.01 && (<>
                                    <mesh
                                        position={[bpCx, faceH / 2, bpCz]}
                                        rotation={[0, bpAngle, 0]}
                                        raycast={() => null}
                                    >
                                        <planeGeometry args={[bpSegLen, faceH]} />
                                        <meshBasicMaterial
                                            color="#ff9f0a"
                                            side={THREE.DoubleSide}
                                            transparent opacity={0.22}
                                            depthWrite={false}
                                        />
                                    </mesh>
                                    <lineSegments
                                        position={[bpCx, faceH / 2, bpCz]}
                                        rotation={[0, bpAngle, 0]}
                                        raycast={() => null}
                                    >
                                        <edgesGeometry args={[new THREE.PlaneGeometry(bpSegLen, faceH)]} />
                                        <lineBasicMaterial color="#ff9f0a" transparent opacity={0.85} />
                                    </lineSegments>
                                </>)}

                                {/* Franja de retiro en el suelo entre lotePoly y buildPoly */}
                                {retiroVal > 0 && bpSegLen > 0.01 && (() => {
                                    const geom = new THREE.BufferGeometry();
                                    const verts = new Float32Array([
                                        ax3,   0.03, az3,
                                        bx3,   0.03, bz3,
                                        bpbx3, 0.03, bpbz3,
                                        ax3,   0.03, az3,
                                        bpbx3, 0.03, bpbz3,
                                        bpax3, 0.03, bpaz3,
                                    ]);
                                    geom.setAttribute('position', new THREE.BufferAttribute(verts, 3));
                                    geom.computeVertexNormals();
                                    return (
                                        <mesh raycast={() => null}>
                                            <ManagedGeometry object={geom}/>
                                            <meshBasicMaterial color="#ff9f0a" transparent opacity={0.28}
                                                depthWrite={false} side={THREE.DoubleSide}/>
                                        </mesh>
                                    );
                                })()}

                                {/* Label flotante */}
                                <Html
                                    position={[bpCx, faceH + 0.5, bpCz]}
                                    center raycast={() => null}
                                    style={{ pointerEvents: 'none' }}
                                >
                                    <div style={{
                                        background:'rgba(0,0,0,0.88)', color:'#ff9f0a',
                                        fontSize:'9px', fontWeight:900,
                                        fontFamily:'-apple-system,BlinkMacSystemFont,sans-serif',
                                        letterSpacing:'0.13em', textTransform:'uppercase',
                                        padding:'3px 9px', borderRadius:5,
                                        border:'1px solid rgba(255,159,10,0.55)',
                                        whiteSpace:'nowrap', userSelect:'none',
                                        boxShadow:'0 2px 8px rgba(0,0,0,0.5)'
                                    }}>
                                        Cara {ei+1} · {bpSegLen.toFixed(1)}m
                                        {retiroVal > 0 && ` · R=${retiroVal}m`}
                                    </div>
                                </Html>

                            </group>
                        );
                    })()}
                    {/* Lote border — polygon or rect */}
                    {sys.geometry?.hasCustomPoly && sys.geometry?.lotePoly ? null : (
                        <lineSegments position={[0, 0.01, 0]} rotation={[-Math.PI / 2, 0, 0]}>
                            <edgesGeometry args={[new THREE.PlaneGeometry(fNum, dNum)]} />
                            <lineBasicMaterial color={isDarkMode ? "#fff" : "#111"} linewidth={2} />
                        </lineSegments>
                    )}

                    {/* === CAJA LÍMITE — usa buildPoly cuando hay lote irregular, si no bbox rectangular === */}
                    {sys.limits.hLimitEfectivo > 0 && (() => {
                        const bp = sys.geometry?.buildPoly;
                        const H = sys.limits.hLimitEfectivo;
                        if (bp && bp.length >= 3 && sys.geometry?.hasCustomPoly) {
                            // Envolvente poligonal extruida — memoizada, con dispose (ver EnvelopePoly)
                            return (
                                <EnvelopePoly
                                    bp={bp}
                                    H={H}
                                    color={limitColor}
                                    fillOpacity={limitOpacityFill}
                                    edgeOpacity={limitOpacityEdges}
                                />
                            );
                        }
                        return (
                            <group position={[0, H/2, 0]}>
                                <mesh raycast={()=>null}>
                                    <boxGeometry args={[fNum, H, dNum]}/>
                                    <meshBasicMaterial color={limitColor} transparent opacity={limitOpacityFill} depthWrite={false} side={THREE.DoubleSide}/>
                                </mesh>
                                <lineSegments raycast={()=>null}>
                                    <edgesGeometry args={[new THREE.BoxGeometry(fNum, H, dNum)]}/>
                                    <lineBasicMaterial color={limitColor} transparent opacity={limitOpacityEdges}/>
                                </lineSegments>
                            </group>
                        );
                    })()}

                    <group>
                        {sys.floors && sys.floors.map((floor, fIdx) => {
                            const yPos = currentY; currentY += (floor.h || 3);
                            if(!floor.blocks) return null;

                            return (
                                <group key={`floor-${floor.id}`} position={[0, yPos, 0]}>
                                    {floor.blocks.map((b, bIdx) => {
                                        // Use stored polygon if available (irregular lot), else build rect polygon
                                        let polygon;
                                        if (b.polygon && b.polygon.length >= 3) {
                                            // Convert PolyGeo coords {x,y} → Three.js shape coords {x,y}
                                            // PolyGeo: x=east, y=north → Three.js shape (XZ plane): x=east, y=-north
                                            polygon = b.polygon.map(p => ({ x: p.x, y: -p.y }));
                                        } else {
                                            polygon = [ { x: b.x - b.w/2, y: -(b.z + b.d/2) }, { x: b.x + b.w/2, y: -(b.z + b.d/2) }, { x: b.x + b.w/2, y: -(b.z - b.d/2) }, { x: b.x - b.w/2, y: -(b.z - b.d/2) } ];
                                        }
                                        const isHoveredBlock = isPushPullMode && hoveredFace && hoveredFace.floorId === floor.id && hoveredFace.bIdx === bIdx;
                                        
                                        return (
                                            <group key={`b-${bIdx}`}>
                                                <CustomExtrudedBlock 
                                                    polygon={polygon} height={floor.h || 3} color={sys.indicators.isExcessH ? colors.red_alert : (floor.type==='res'?colors.res : floor.type==='com'?colors.com:colors.eq)}
                                                    isSelected={selectedFloorId === floor.id} measureMode={measureMode}
                                                    onPointerDown={(e) => {
                                                        if (measureMode) return handleCADClick(e);
                                                        e.stopPropagation(); setSelectedFloorId(floor.id);
                                                        if (!isPushPullMode || activeExtrusion) return;
                                                        
                                                        const n = e.face.normal; let faceType = null; let cursorStyle = 'grab';
                                                        if (n.y > 0.5) { faceType = 'retP'; cursorStyle = cursorZ; } else if (n.y < -0.5) { faceType = 'retF'; cursorStyle = cursorZ; } else if (n.x > 0.5) { faceType = 'retD'; cursorStyle = cursorX; } else if (n.x < -0.5) { faceType = 'retI'; cursorStyle = cursorX; }
                                                        
                                                        if (faceType) {
                                                            commitState(); 
                                                            document.body.style.cursor = cursorStyle;
                                                            const isGroundFloor = (fIdx === 0);
                                                            const faceMap = { retF: 'frontal', retP: 'posterior', retD: 'derecho', retI: 'izquierdo' };
                                                            
                                                            // ¿Modificamos el global o solo este piso?
                                                            // Bug 1.4 fix: Si primerPisoIndependiente=true, el primer piso usa blockMods locales.
                                                            const modifiesGlobal = isGroundFloor && !config.primerPisoIndependiente;
                                                            let startRetVal = floor.blockMods?.[bIdx]?.[faceType] || 0;
                                                            
                                                            if (modifiesGlobal) {
                                                                startRetVal = Number(sys.limits[`retiroEfectivo${faceMap[faceType].charAt(0).toUpperCase() + faceMap[faceType].slice(1)}`]) || 0;
                                                            }
                                                            
                                                            const baseRefW = b.baseRef ? b.baseRef.w : b.w; 
                                                            const baseRefD = b.baseRef ? b.baseRef.d : b.d;
                                                            
                                                            setActiveExtrusion({ 
                                                                floorId: floor.id, bIdx: bIdx, face: faceType, 
                                                                startPoint: e.point.clone(), startRet: startRetVal, 
                                                                baseW: baseRefW, baseD: baseRefD, 
                                                                floorData: floor, cursor: cursorStyle, 
                                                                modifiesGlobal: modifiesGlobal, normFace: faceMap[faceType],
                                                                _lastVal: startRetVal, _lastDelta: 0
                                                            });
                                                        }
                                                    }}
                                                    onPointerMove={(e) => {
                                                        if (measureMode || !isPushPullMode || activeExtrusion) return; 
                                                        e.stopPropagation();
                                                        const n = e.face.normal; let faceType = null;
                                                        if (n.y > 0.5) faceType = 'retP'; else if (n.y < -0.5) faceType = 'retF'; else if (n.x > 0.5) faceType = 'retD'; else if (n.x < -0.5) faceType = 'retI';
                                                        if (faceType) { document.body.style.cursor = faceType === 'retP' || faceType === 'retF' ? cursorZ : cursorX; setHoveredFace({ floorId: floor.id, bIdx, face: faceType }); }
                                                    }}
                                                    onPointerOut={() => { if (!activeExtrusion) { document.body.style.cursor = 'auto'; setHoveredFace(null); } }}
                                                />
                                                {isPushPullMode && hoveredFace && hoveredFace.floorId === floor.id && hoveredFace.bIdx === bIdx && hoveredFace.face === 'retF' && (<mesh position={[b.x, (floor.h||3)/2, b.z + b.d/2 + 0.02]}><planeGeometry args={[b.w, floor.h||3]} /><meshBasicMaterial color="#007aff" side={THREE.DoubleSide} transparent opacity={0.5} depthWrite={false} /></mesh>)}
                                                {isPushPullMode && hoveredFace && hoveredFace.floorId === floor.id && hoveredFace.bIdx === bIdx && hoveredFace.face === 'retP' && (<mesh position={[b.x, (floor.h||3)/2, b.z - b.d/2 - 0.02]} rotation={[0, Math.PI, 0]}><planeGeometry args={[b.w, floor.h||3]} /><meshBasicMaterial color="#007aff" side={THREE.DoubleSide} transparent opacity={0.5} depthWrite={false} /></mesh>)}
                                                {isPushPullMode && hoveredFace && hoveredFace.floorId === floor.id && hoveredFace.bIdx === bIdx && hoveredFace.face === 'retD' && (<mesh position={[b.x + b.w/2 + 0.02, (floor.h||3)/2, b.z]} rotation={[0, Math.PI/2, 0]}><planeGeometry args={[b.d, floor.h||3]} /><meshBasicMaterial color="#007aff" side={THREE.DoubleSide} transparent opacity={0.5} depthWrite={false} /></mesh>)}
                                                {isPushPullMode && hoveredFace && hoveredFace.floorId === floor.id && hoveredFace.bIdx === bIdx && hoveredFace.face === 'retI' && (<mesh position={[b.x - b.w/2 - 0.02, (floor.h||3)/2, b.z]} rotation={[0, -Math.PI/2, 0]}><planeGeometry args={[b.d, floor.h||3]} /><meshBasicMaterial color="#007aff" side={THREE.DoubleSide} transparent opacity={0.5} depthWrite={false} /></mesh>)}
                                            </group>
                                        );
                                    })}
                                </group>
                            );
                        })}
                    </group>

                    {/* HUD Δxyz / valor actual (extrusión + medición) */}
                    {renderDeltaHUD()}

                    {/* Indicador de snap (cuadrado para endpoint, círculo para midpoint) */}
                    {measureMode && currentMousePos && (
                        <group position={currentMousePos}>
                            {snapType === 'endpoint' && (
                                <mesh raycast={() => null}>
                                    <boxGeometry args={[0.5, 0.5, 0.5]} />
                                    <meshBasicMaterial color="#007aff" wireframe={true} />
                                </mesh>
                            )}
                            {snapType === 'midpoint' && (
                                <mesh raycast={() => null}>
                                    <sphereGeometry args={[0.3, 12, 8]} />
                                    <meshBasicMaterial color="#34c759" wireframe={true} />
                                </mesh>
                            )}
                            {!snapType && (
                                <mesh raycast={() => null}>
                                    <boxGeometry args={[0.3, 0.3, 0.3]} />
                                    <meshBasicMaterial color={isDarkMode ? "#f5f5f7" : "#1d1d1f"} wireframe={true} />
                                </mesh>
                            )}
                        </group>
                    )}

                    {/* Cota arquitectónica final (entre 2 puntos confirmados) */}
                    {measureMode && measurePts.length === 2 && renderArchDimension(measurePts[0], measurePts[1])}
                    
                    {/* Línea ghost (entre primer punto fijado y posición actual del mouse) */}
                    {measureMode && measurePts.length === 1 && currentMousePos && (
                        <lineSegments raycast={() => null}>
                            <bufferGeometry attach="geometry" {...new THREE.BufferGeometry().setFromPoints([measurePts[0], currentMousePos])} />
                            <lineBasicMaterial color={isDarkMode ? "#f5f5f7" : "#1d1d1f"} transparent opacity={0.4} />
                        </lineSegments>
                    )}
                </group>
            );
        });
        /* =========================================================================
           4. PANELES UI DESACOPLADOS
           ========================================================================= */
        /* =========================================================================
           PANEL A — PARÁMETROS URBANOS
           Lote · Vías · Retiros normativos · CE Base · Área Libre · Altura máxima
           Contiene los datos que vienen desde afuera del proyecto (normativa pública)
           ========================================================================= */
        const UrbanoPanel = ({ config, updateConfig, commitState, sys, section, selectedEdge, setSelectedEdge }) => {
            const show = (s) => !section || section === s;
            const safeSetEdge = setSelectedEdge || (() => {});

            // ── Face-based logic ─────────────────────────────────────────────
            // Number of faces = all polygon edges, no cap
            // En modo lanzamiento el motor ignora lotePoligono (rectángulo f×d),
            // así que el panel debe hacer lo mismo: 4 caras alineadas a edgeDists.
            const poly = LAUNCH_SIMPLE ? null : config.lotePoligono;
            const nFaces = poly && poly.length >= 3 ? poly.length : 4;

            // Edge labels: computed from bearing of each edge
            const edgeLabel = (i) => {
                if (!poly || poly.length < 2) return `Cara ${i+1}`;
                const a = poly[i], b = poly[(i+1)%poly.length];
                const ang = ((Math.atan2(b.y-a.y, b.x-a.x)*180/Math.PI) % 360 + 360) % 360;
                const card = ang < 45||ang>=315?'E':ang<135?'N':ang<225?'O':'S';
                const len = Math.hypot(b.x-a.x, b.y-a.y);
                return `Cara ${i+1} (${card} · ${len.toFixed(1)}m)`;
            };

            // viasCaras: [{edgeIdx, ancho, factor, active}] stored in config.viasCaras
            const viasCaras = config.viasCaras || [];
            const retirosCaras = config.retirosCaras || [];

            const updateViasCara = (idx, field, val) => {
                commitState();
                const arr = [...viasCaras];
                const existing = arr.findIndex(v => v.edgeIdx === idx);
                if (existing >= 0) arr[existing] = {...arr[existing], [field]: val};
                else arr.push({edgeIdx: idx, ancho: field==='ancho'?val:8, factor: field==='factor'?val:1.5, active: true, [field]: val});
                updateConfig('viasCaras', arr);
            };
            const toggleViasCara = (idx) => {
                commitState();
                const arr = [...viasCaras];
                const existing = arr.findIndex(v => v.edgeIdx === idx);
                if (existing >= 0) arr[existing] = {...arr[existing], active: !arr[existing].active};
                else arr.push({edgeIdx: idx, ancho: 8, factor: 1.5, active: true});
                updateConfig('viasCaras', arr);
            };
            const getVia = (idx) => viasCaras.find(v=>v.edgeIdx===idx) || {ancho:8, factor:1.5, active:false};

            const updateRetiroCara = (idx, val) => {
                commitState();
                const arr = [...retirosCaras];
                const existing = arr.findIndex(r => r.edgeIdx === idx);
                const v = Math.max(0, parseFloat(val)||0);
                if (existing >= 0) arr[existing] = {...arr[existing], val: v, active: v>0};
                else arr.push({edgeIdx: idx, val: v, active: v>0});
                updateConfig('retirosCaras', arr);
                // Also keep legacy retiros in sync for first 4 faces
                const faceMap = ['frontal','derecho','posterior','izquierdo'];
                if (idx < 4) updateConfig('retirosNormativos', {...config.retirosNormativos, [faceMap[idx]]: {active: v>0, val: v}});
            };
            const getRetiro = (idx) => (retirosCaras.find(r=>r.edgeIdx===idx)||{val:0, active:false});

            return (
                <div className="panel-scroll">

                    {/* PANEL HEADER — condicional por section */}
                    {!section && (
                        <div style={{padding:'14px 14px 0', borderBottom:'1px solid var(--border)', paddingBottom:12, marginBottom:2}}>
                            <div className="text-[9px] font-black uppercase tracking-widest theme-text-muted">Parámetros Urbanos</div>
                            <div className="text-[11px] font-black theme-text mt-1">Lote · Vías · Retiros · Altura</div>
                        </div>
                    )}
                    {section === 'contexto' && (
                        <div className="ph-macro">
                            <div className="ph-tag">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><rect x="2" y="7" width="9" height="14" rx="1"/><rect x="13" y="3" width="9" height="18" rx="1"/></svg>
                                Contexto Urbano
                            </div>
                            <div className="ph-title">Lote · Vías · Retiros</div>
                            <div className="ph-sub">Datos preexistentes del predio y vías colindantes</div>
                            <span className="ph-badge badge-input">⬤ Configuración</span>
                        </div>
                    )}
                    {section === 'normativa' && (
                        <div className="ph-macro">
                            <div className="ph-tag">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                                Normativa Edificatoria
                            </div>
                            <div className="ph-title">CE · Área Libre · Altura</div>
                            <div className="ph-sub">Coeficientes y límites reglamentarios del proyecto</div>
                            <span className="ph-badge badge-input">⬤ Configuración</span>
                        </div>
                    )}

                    {show('contexto') && <CollapsibleCard title="Lote">
                        <div className="flex gap-2 mb-2 border-b theme-border pb-3">
                            <div className="flex-1"><label className="text-[10px] font-bold theme-text-muted uppercase">Frente (m)</label><input type="number" className="theme-input mt-1" value={config.loteFrente} onChange={e=>updateConfig('loteFrente', cleanNumber(e.target.value))} onFocus={commitState}/></div>
                            <div className="flex-1"><label className="text-[10px] font-bold theme-text-muted uppercase">Fondo (m)</label><input type="number" className="theme-input mt-1" value={config.loteFondo} onChange={e=>updateConfig('loteFondo', cleanNumber(e.target.value))} onFocus={commitState}/></div>
                        </div>
                        <div className="text-[12px] font-black text-[#007aff] text-right mb-2">
                            ÁREA: {sys.limits.aLote.toFixed(1)} m²
                            {poly && <span className="text-[9px] font-bold text-[#34c759] ml-2">· {poly.length} vértices (forma real)</span>}
                        </div>
                        {poly && <div className="text-[8px] font-bold text-[#34c759] mb-2 p-2 rounded-lg" style={{background:'rgba(52,199,89,0.08)',border:'1px solid rgba(52,199,89,0.2)'}}>
                            ✓ Lote personalizado cargado — la forma real controla morfología y cálculos
                            <button className="ml-2 text-[#ff3b30]" onClick={()=>{commitState();updateConfig('lotePoligono',null);}}>× Borrar</button>
                        </div>}
                    </CollapsibleCard>}

                    {show('contexto') && <CollapsibleCard title="Vías Públicas por Cara">
                        <div className="text-[8px] theme-text-muted mb-3">
                            {poly ? `Lote con ${nFaces} caras — activa las caras que colindan con vía pública` : 'Sin polígono: activa las caras que tienen vía'}
                        </div>
                        {Array.from({length: nFaces}, (_,i)=>{
                            const via = getVia(i);
                            const isActive = selectedEdge === i;
                            return (
                                <div
                                    key={i}
                                    className={`mb-2 p-2 rounded-lg border ${via.active?'border-[#007aff]':'theme-border'}`}
                                    style={{
                                        background: isActive ? 'rgba(255,159,10,0.10)' : (via.active?'rgba(0,122,255,0.05)':'var(--bg-input)'),
                                        border: isActive ? '1.5px solid #ff9f0a' : undefined,
                                        cursor: 'pointer',
                                        transition: 'background 0.1s, border-color 0.1s'
                                    }}
                                    onMouseEnter={() => safeSetEdge(i)}
                                    onMouseLeave={() => { if(selectedEdge === i) safeSetEdge(null); }}
                                    onClick={() => safeSetEdge(isActive ? null : i)}
                                >
                                    <div className="flex items-center justify-between mb-1">
                                        <label className="flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" checked={via.active||false} onChange={()=>toggleViasCara(i)} className="accent-[#007aff] w-3.5 h-3.5"/>
                                            <span className={`text-[9px] font-black uppercase ${isActive ? 'text-[#ff9f0a]' : 'text-[#007aff]'}`}>
                                                {isActive ? '▶ ' : ''}{edgeLabel(i)}
                                            </span>
                                        </label>
                                        {isActive && (
                                            <span style={{fontSize:7,fontWeight:900,color:'#ff9f0a',background:'rgba(255,159,10,0.15)',padding:'1px 5px',borderRadius:3,letterSpacing:'0.1em'}}>ACTIVA</span>
                                        )}
                                    </div>
                                    {via.active && (
                                        <div className="flex gap-2 mt-1">
                                            <div className="flex-1">
                                                <div className="text-[7px] theme-text-muted mb-0.5">ANCHO VÍA (m)</div>
                                                <input type="number" className="theme-input py-1 text-center font-bold" value={via.ancho||8} step="0.5" onChange={e=>updateViasCara(i,'ancho',cleanNumber(e.target.value))} onFocus={()=>{commitState();safeSetEdge(i);}}/>
                                            </div>
                                            <div className="w-14">
                                                <div className="text-[7px] theme-text-muted mb-0.5">FACTOR H</div>
                                                <input type="number" className="theme-input py-1 text-center" value={via.factor||1.5} step="0.1" onChange={e=>updateViasCara(i,'factor',cleanNumber(e.target.value))} onFocus={()=>{commitState();safeSetEdge(i);}}/>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                        {/* Legacy: compute max H from all active vias */}
                        {viasCaras.some(v=>v.active) && (
                            <div className="mt-2 p-2 rounded-lg" style={{background:'rgba(0,122,255,0.08)'}}>
                                <div className="text-[8px] font-black text-[#007aff] uppercase">H Máx calculada</div>
                                <div className="text-[14px] font-black text-[#007aff]">
                                    {Math.max(...viasCaras.filter(v=>v.active).map(v=>(Number(v.factor)||1.5)*((Number(v.ancho)||0)))).toFixed(1)}m
                                    <span className="text-[8px] font-normal ml-1">= max(factor × ancho vía)</span>
                                </div>
                            </div>
                        )}
                    </CollapsibleCard>}

                    {show('contexto') && <CollapsibleCard title="Retiros por Cara">
                        <div className="text-[8px] theme-text-muted mb-3">
                            Asigna el retiro normativo a cada cara del lote. En la vista Planta puedes hacer lo mismo tocando una arista.
                        </div>
                        {Array.from({length: nFaces}, (_,i)=>{
                            const ret = getRetiro(i);
                            const isActive = selectedEdge === i;
                            return (
                                <div
                                    key={i}
                                    className="flex items-center justify-between mb-2 p-2 rounded-lg"
                                    style={{
                                        background: isActive ? 'rgba(255,159,10,0.10)' : 'transparent',
                                        border: isActive ? '1.5px solid #ff9f0a' : '1px solid transparent',
                                        cursor: 'pointer',
                                        transition: 'background 0.1s'
                                    }}
                                    onMouseEnter={() => safeSetEdge(i)}
                                    onMouseLeave={() => { if(selectedEdge === i) safeSetEdge(null); }}
                                    onClick={() => safeSetEdge(isActive ? null : i)}
                                >
                                    <span className={`text-[9px] font-bold ${isActive ? 'text-[#ff9f0a]' : 'theme-text'}`}>
                                        {isActive ? '▶ ' : ''}{edgeLabel(i)}
                                    </span>
                                    <div className="flex items-center gap-2">
                                        <input type="number" className="theme-input w-16 py-1 text-center" value={ret.val||0} step="0.1" min="0"
                                            onChange={e=>updateRetiroCara(i, e.target.value)}
                                            onFocus={()=>{commitState();safeSetEdge(i);}}
                                            onClick={e=>e.stopPropagation()}
                                        />
                                        <span className="text-[8px] theme-text-muted">m</span>
                                    </div>
                                </div>
                            );
                        })}
                        <div className="pt-2 border-t theme-border mt-1">
                            <label className="flex items-center gap-2 cursor-pointer text-[10px] font-bold theme-text">
                                <input type="checkbox" checked={config.primerPisoIndependiente || false} onChange={() => { commitState(); updateConfig('primerPisoIndependiente', !config.primerPisoIndependiente); }} className="accent-[#007aff] w-4 h-4 flex-shrink-0" />
                                <span>Primer Piso Independiente</span>
                            </label>
                            <span className="text-[8px] theme-text-muted block mt-1 leading-tight pl-6">
                                Actívalo para que el 1er piso tenga su propio retiro (retranqueo de plataforma comercial). La torre de pisos superiores sigue usando los retiros normativos arriba.
                            </span>

                            {/* ── Retranqueo del P1 por cara ──────────────────────────────
                                Visible solo con el modo independiente activo. Escribe
                                config.floors[0].blockMods[0] — la MISMA estructura que
                                consume el motor, Push/Pull y el panel Programa, así las
                                tres vías de edición permanecen sincronizadas. */}
                            {config.primerPisoIndependiente && (() => {
                                const p1     = config.floors && config.floors[0];
                                const p1Mods = (p1 && p1.blockMods && p1.blockMods[0]) || { retF: 0, retP: 0, retD: 0, retI: 0 };
                                const setP1Ret = (faceKey, val) => {
                                    updateConfig('floors', config.floors.map((f, idx) => idx === 0
                                        ? {
                                            ...f,
                                            blockMods: {
                                                ...(f.blockMods || {}),
                                                0: {
                                                    ...((f.blockMods || {})[0] || { retF: 0, retP: 0, retD: 0, retI: 0 }),
                                                    [faceKey]: Math.max(0, Number(val) || 0)
                                                }
                                            }
                                        }
                                        : f));
                                };
                                /* Mapeo cara → face key, idéntico a edgeDists del motor */
                                const carasP1 = [
                                    { n: 1, lado: 'Frente', key: 'retF' },
                                    { n: 2, lado: 'Der.',   key: 'retD' },
                                    { n: 3, lado: 'Fondo',  key: 'retP' },
                                    { n: 4, lado: 'Izq.',   key: 'retI' },
                                ];
                                return (
                                    <div className="mt-2 ml-6 p-2 rounded-lg border theme-border" style={{background: 'var(--bg-input)'}}>
                                        <div className="text-[8px] font-bold theme-text-muted uppercase mb-1" style={{letterSpacing: '0.06em'}}>
                                            Retranqueo 1er Piso por cara (m)
                                        </div>
                                        <div className="flex gap-1">
                                            {carasP1.map(c => (
                                                <div key={c.key} className="flex-1 flex flex-col items-center">
                                                    <span className="text-[7px] font-bold theme-text-muted uppercase leading-none mb-0.5">
                                                        C{c.n} · {c.lado}
                                                    </span>
                                                    <input
                                                        type="number"
                                                        className="w-full bg-transparent border theme-border text-center text-[10px] rounded theme-text font-bold py-0.5"
                                                        value={p1Mods[c.key] || 0}
                                                        step="0.5"
                                                        min="0"
                                                        onChange={e => setP1Ret(c.key, cleanNumber(e.target.value))}
                                                        onFocus={commitState}
                                                    />
                                                </div>
                                            ))}
                                        </div>
                                        <span className="text-[7px] theme-text-muted block mt-1 leading-tight">
                                            0 = el 1er piso llega a la línea de propiedad. También editable con Push/Pull o en el panel Programa (piso 1).
                                        </span>
                                    </div>
                                );
                            })()}
                        </div>
                    </CollapsibleCard>}

                    {show('normativa') && <CollapsibleCard title="Coeficientes Normativos y Área Libre">
                        <div className="flex gap-2 mb-3">
                            <div className="flex-1">
                                <label className="text-[10px] font-bold theme-text-muted uppercase">CE Base</label>
                                <input type="number" className="theme-input mt-1" value={config.ceBase} step="0.5" onChange={e => updateConfig('ceBase', cleanNumber(e.target.value))} onFocus={commitState} />
                                <div className="text-[7px] theme-text-muted mt-0.5">Área total / Área lote</div>
                            </div>
                        </div>
                        <div className="text-[9px] font-bold theme-text-muted uppercase mb-2">Coeficientes de Ocupación</div>
                        <div className="flex gap-2 mb-3">
                            <div className="flex-1 p-2 rounded-lg border theme-border" style={{background:'var(--bg-input)'}}>
                                <label className="text-[9px] font-black text-[#007aff] uppercase">COS</label>
                                <div className="text-[7px] theme-text-muted mb-1">Ocupación Suelo (1er piso)</div>
                                <div className="flex items-center gap-1">
                                    <input type="number" className="theme-input flex-1 py-1 text-center text-[11px] font-black" value={config.cosBase ?? 0.7} step="0.05" min="0" max="1" onChange={e => updateConfig('cosBase', cleanNumber(e.target.value))} onFocus={commitState} />
                                    <span className="text-[9px] font-bold text-[#007aff]">×</span>
                                </div>
                                {(Number(config.cosBase) > 0) && (<div className="text-[8px] font-bold text-[#007aff] mt-1 text-right">Máx: {((Number(config.cosBase)||0)*sys.limits.aLote).toFixed(0)} m²</div>)}
                            </div>
                            <div className="flex-1 p-2 rounded-lg border theme-border" style={{background:'var(--bg-input)'}}>
                                <label className="text-[9px] font-black text-[#5856d6] uppercase">COPS</label>
                                <div className="text-[7px] theme-text-muted mb-1">Pisos Superiores</div>
                                <div className="flex items-center gap-1">
                                    <input type="number" className="theme-input flex-1 py-1 text-center text-[11px] font-black" value={config.copsBase ?? 0.5} step="0.05" min="0" max="1" onChange={e => updateConfig('copsBase', cleanNumber(e.target.value))} onFocus={commitState} />
                                    <span className="text-[9px] font-bold text-[#5856d6]">×</span>
                                </div>
                                {(Number(config.copsBase) > 0) && (<div className="text-[8px] font-bold text-[#5856d6] mt-1 text-right">Máx: {((Number(config.copsBase)||0)*sys.limits.aLote).toFixed(0)} m²</div>)}
                            </div>
                        </div>
                        <div className="text-[9px] font-bold theme-text-muted uppercase mb-2">% Área Libre Mínima por Uso</div>
                        <div className="flex flex-col gap-2">
                            <div className="flex items-center justify-between p-2 rounded-lg border theme-border" style={{background:'var(--bg-input)'}}>
                                <div>
                                    <div className="text-[9px] font-black text-[#F28C28] uppercase">Residencial</div>
                                    <div className="text-[8px] theme-text-muted">Mínimo normativo</div>
                                </div>
                                <div className="flex items-center gap-1">
                                    <input type="number" className="theme-input w-14 py-1 text-center text-[10px]" value={config.pctLibreRes ?? 30} step="5" min="0" max="100" onChange={e => updateConfig('pctLibreRes', cleanNumber(e.target.value))} onFocus={commitState}/>
                                    <span className="text-[9px] font-bold text-[#F28C28]">%</span>
                                </div>
                            </div>
                            <div className="flex items-center justify-between p-2 rounded-lg border theme-border" style={{background:'var(--bg-input)'}}>
                                <div>
                                    <div className="text-[9px] font-black text-[#C62828] uppercase">Comercio / Equipamiento</div>
                                    <div className="text-[8px] theme-text-muted">Mínimo Normativo</div>
                                </div>
                                <div className="flex items-center gap-1">
                                    <input type="number" className="theme-input w-14 py-1 text-center text-[10px]" value={config.pctLibreCom ?? 0} step="5" min="0" max="100" onChange={e => updateConfig('pctLibreCom', cleanNumber(e.target.value))} onFocus={commitState}/>
                                    <span className="text-[9px] font-bold text-[#C62828]">%</span>
                                </div>
                            </div>
                        </div>
                        {/* Resultado inline: Área techada máxima */}
                        {(config.ceBase > 0) && (
                            <div className="mt-3 pt-2 border-t theme-border">
                                <div className="flex justify-between text-[10px]">
                                    <span className="font-bold theme-text-muted uppercase">Área Techada Máx.</span>
                                    <span className="font-black text-[#007aff]">{((sys?.limits?.aTechadaMax)||0).toFixed(0)} m²</span>
                                </div>
                            </div>
                        )}
                    </CollapsibleCard>}

                    {show('normativa') && <CollapsibleCard title="Altura Máxima Normativa">
                        <div className="flex p-1 rounded-lg mb-3" style={{background: 'var(--bg-input)'}}>
                            <button className={`flex-1 py-1.5 text-[10px] font-bold rounded-md transition-all ${config.metodoAltura === 'normativo' ? 'ios-btn active shadow-sm' : 'theme-text-muted'}`} onClick={() => {commitState(); updateConfig('metodoAltura', 'normativo');}}>
                                Método Vías
                            </button>
                            <button className={`flex-1 py-1.5 text-[10px] font-bold rounded-md transition-all ${config.metodoAltura === 'coeficiente' ? 'ios-btn active shadow-sm' : 'theme-text-muted'}`} onClick={() => {commitState(); updateConfig('metodoAltura', 'coeficiente');}}>
                                CE + Huella
                            </button>
                        </div>
                        {config.metodoAltura === 'normativo' && (
                            <div className="text-[9px] theme-text-muted font-bold leading-tight">
                                H máxima = Factor × (Ancho vía + Retiro frontal)<br/>
                                <span className="text-[#007aff] font-black mt-1 block">
                                    H Máxima: {((sys?.limits?.hLimitEfectivo)||0).toFixed(1)} m
                                </span>
                            </div>
                        )}
                        {config.metodoAltura === 'coeficiente' && (
                            <>
                                <div className="flex items-center justify-between">
                                    <label className="text-[10px] font-bold text-[#007aff] uppercase">H Libre / Piso (m)</label>
                                    <input type="number" className="theme-input w-16 py-1 px-2 text-center text-[#007aff] font-bold" value={config.alturaPorPisoCoef} step="0.1" onChange={e=>updateConfig('alturaPorPisoCoef', cleanNumber(e.target.value))} onFocus={commitState}/>
                                </div>
                                <div className="text-[9px] theme-text-muted font-bold mt-2">
                                    H máxima = (CE × Lote / Huella) × H piso
                                    <span className="text-[#007aff] font-black mt-1 block">
                                        H Máxima: {((sys?.limits?.hLimitEfectivo)||0).toFixed(1)} m
                                    </span>
                                </div>
                            </>
                        )}
                    </CollapsibleCard>}
                </div>
            );
        };

        /* =========================================================================
           PANEL B — MORFOLOGÍA
           Zonas morfológicas · Formas · Parámetros de forma
           Decisiones de diseño volumétrico del arquitecto
           ========================================================================= */
        const MorphPanel = ({ config, updateConfig, commitState, sys }) => {
            const addMorphZone = () => {
                commitState();
                const newZones = [...config.morphologyZones];
                let nextStart = 1;
                if (newZones.length > 0) {
                    const lastZone = newZones[newZones.length - 1];
                    nextStart = Math.min(config.floors.length, lastZone.morphFloorEnd + 1);
                }
                newZones.push({
                    id: Date.now(), morphology: 'lleno', morphFloorStart: nextStart, morphFloorEnd: config.floors.length,
                    morphOrientation: '0', paramDistBloques: 5, paramNumBloques: 2,
                    paramL_Cuerpo: 6, paramL_Brazo: 6, paramU_Cuerpo: 5, paramU_BrazoI: 5, paramU_BrazoD: 5,
                    paramPatioFren: 5, paramPatioPost: 5, paramPatioIzq: 5, paramPatioDer: 5
                });
                updateConfig('morphologyZones', newZones);
            };
            const removeMorphZone = (id) => { commitState(); updateConfig('morphologyZones', config.morphologyZones.filter(z => z.id !== id)); };
            const updateZoneProp = (id, prop, val) => { updateConfig('morphologyZones', config.morphologyZones.map(z => z.id === id ? { ...z, [prop]: val } : z)); };

            // Compute edge labels from lotePoly for morph orientation guidance
            const lotePoly = sys?.geometry?.lotePoly;
            const buildBB = sys?.geometry ? PolyGeo.bbox(sys.geometry.buildPoly || sys.geometry.lotePoly || [{x:0,y:0}]) : null;
            const getEdgeLabel = (i) => {
                if(!lotePoly||lotePoly.length<2) return ['Frente','Der.','Fondo','Izq.'][i%4];
                const a=lotePoly[i%lotePoly.length],b=lotePoly[(i+1)%lotePoly.length];
                const ang=(Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI+360)%360;
                const card=ang<45||ang>=315?'E':ang<135?'N':ang<225?'O':'S';
                return `Cara ${i+1} (${card})`;
            };

            return (
                <div className="panel-scroll">
                    <div style={{padding:'14px 14px 0', borderBottom:'1px solid var(--border)', paddingBottom:12, marginBottom:2}}>
                        <div className="text-[9px] font-black uppercase tracking-widest theme-text-muted">Morfología</div>
                        <div className="text-[11px] font-black theme-text mt-1">Formas · Zonas · Volumetría</div>
                        {lotePoly && <div className="text-[8px] text-[#34c759] font-bold mt-1">{lotePoly.length} caras · Área edificable: {sys.limits.aLote.toFixed(1)} m²</div>}
                    </div>

                    <CollapsibleCard title="Zonas Morfológicas" defaultOpen={true}>
                        <div className="text-[9px] theme-text-muted font-bold mb-2">Aplica diferentes formas a distintos rangos de pisos. Cada zona puede tener su propia volumetría.</div>

                        {config.morphologyZones.map((zone, zIdx) => (
                            <div key={zone.id} className="rounded-xl p-3 mb-3 border theme-border relative" style={{background: 'var(--bg-input)'}}>
                                <div className="flex justify-between items-center mb-2 pb-1 border-b theme-border">
                                    <span className="font-black text-[10px] text-[#007aff] uppercase">Zona {zIdx + 1}</span>
                                    {config.morphologyZones.length > 1 && (
                                        <button className="text-red-500 hover:bg-red-50 rounded p-1 text-[10px] font-bold" onClick={() => removeMorphZone(zone.id)}>✕</button>
                                    )}
                                </div>

                                <div className="flex gap-2 mb-3">
                                    <div className="flex-1 flex flex-col">
                                        <label className="text-[9px] font-bold theme-text-muted">Piso inicio:</label>
                                        <select className="theme-input py-1 px-2 text-[10px] text-center" value={zone.morphFloorStart} onChange={e => { commitState(); updateZoneProp(zone.id, 'morphFloorStart', Number(e.target.value)); }}>
                                            {config.floors.map((f, i) => (<option key={f.id} value={i + 1}>{i + 1}</option>))}
                                        </select>
                                    </div>
                                    <div className="flex-1 flex flex-col">
                                        <label className="text-[9px] font-bold theme-text-muted">Piso fin:</label>
                                        <select className="theme-input py-1 px-2 text-[10px] text-center" value={zone.morphFloorEnd} onChange={e => { commitState(); updateZoneProp(zone.id, 'morphFloorEnd', Number(e.target.value)); }}>
                                            {config.floors.map((f, i) => (<option key={f.id} value={i + 1}>{i + 1}</option>))}
                                            <option value={100}>Todos</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-1.5 mb-2">
                                    {[
                                        { id: 'lleno',        name: 'Lleno Base' },
                                        { id: 'patio_central',name: 'Patio Central' },
                                        { id: 'forma_l',      name: 'Forma L' },
                                        { id: 'forma_u',      name: 'Forma U' },
                                        { id: 'dos_bloques',  name: 'Bloques Sep.' }
                                    ].map(m => (
                                        <button key={m.id} className={`py-1.5 text-[9px] font-bold rounded-md transition-all border theme-border ${zone.morphology === m.id ? 'ios-btn active shadow-sm' : 'theme-text hover:bg-gray-200'}`} onClick={() => { commitState(); updateZoneProp(zone.id, 'morphology', m.id); }}>
                                            {m.name}
                                        </button>
                                    ))}
                                </div>

                                {zone.morphology !== 'lleno' && (
                                    <div className="flex flex-col gap-2 p-2 rounded border theme-border mt-2" style={{background: 'var(--bg-card)'}}>
                                        {zone.morphology === 'dos_bloques' && (<>
                                            <div className="flex justify-between items-center"><span className="text-[8px] font-bold uppercase theme-text">Separación</span>
                                                <select className="text-[9px] border theme-border rounded px-1 theme-input py-1 w-32" value={zone.morphOrientation||'0'} onChange={e=>{commitState(); updateZoneProp(zone.id, 'morphOrientation', e.target.value)}}>
                                                    <option value="0">{getEdgeLabel(0)}↔{getEdgeLabel(2)} (eje fondo)</option>
                                                    <option value="1">{getEdgeLabel(1)}↔{getEdgeLabel(3)} (eje lateral)</option>
                                                </select>
                                            </div>
                                            <div className="flex justify-between items-center"><span className="text-[8px] font-bold uppercase theme-text">Cant. Bloques</span><select className="text-[9px] border theme-border rounded px-1 theme-input py-1 w-20" value={zone.paramNumBloques} onChange={e => {commitState(); updateZoneProp(zone.id, 'paramNumBloques', Number(e.target.value))}}><option value={2}>2 Bloques</option><option value={3}>3 Bloques</option></select></div>
                                            <div className="flex justify-between items-center"><span className="text-[8px] font-bold uppercase theme-text">Separación (m)</span><input type="number" className="w-16 border theme-border text-center text-[10px] rounded font-bold theme-input py-1" value={zone.paramDistBloques ?? 5} step="0.5" min="0" onChange={e => updateZoneProp(zone.id, 'paramDistBloques', cleanNumber(e.target.value))} onFocus={commitState} /></div>
                                        </>)}
                                        {zone.morphology === 'forma_l' && (<>
                                            <div className="text-[8px] theme-text-muted mb-2">El cuerpo cubre el ancho completo del lote. El brazo sale perpendicular en la esquina elegida.</div>
                                            <div className="flex justify-between items-center mb-1"><span className="text-[8px] font-bold uppercase theme-text">Esquina</span>
                                                <select className="text-[9px] border theme-border rounded px-1 theme-input py-1 w-28" value={zone.morphOrientation||'0'} onChange={e=>{commitState(); updateZoneProp(zone.id, 'morphOrientation', e.target.value)}}>
                                                    <option value="0">{getEdgeLabel(2)}-{getEdgeLabel(3)}</option>
                                                    <option value="1">{getEdgeLabel(2)}-{getEdgeLabel(1)}</option>
                                                    <option value="2">{getEdgeLabel(0)}-{getEdgeLabel(3)}</option>
                                                    <option value="3">{getEdgeLabel(0)}-{getEdgeLabel(1)}</option>
                                                </select>
                                            </div>
                                            <div className="flex justify-between items-center mt-1"><span className="text-[8px] font-bold uppercase theme-text">Grosor Cuerpo (m)</span><input type="number" className="w-16 border theme-border text-center text-[10px] rounded font-bold theme-input py-1" value={zone.paramL_Cuerpo ?? 6} step="0.5" min="0" onChange={e => updateZoneProp(zone.id, 'paramL_Cuerpo', cleanNumber(e.target.value))} onFocus={commitState} /></div>
                                            <div className="flex justify-between items-center mt-1"><span className="text-[8px] font-bold uppercase theme-text">Grosor Brazo (m)</span><input type="number" className="w-16 border theme-border text-center text-[10px] rounded font-bold theme-input py-1" value={zone.paramL_Brazo ?? 6} step="0.5" min="0" onChange={e => updateZoneProp(zone.id, 'paramL_Brazo', cleanNumber(e.target.value))} onFocus={commitState} /></div>
                                        </>)}
