                                        {zone.morphology === 'forma_u' && (<>
                                            <div className="text-[8px] theme-text-muted mb-2">El cuerpo cierra un lado y dos brazos corren a lo largo del lote. Abierto hacia una cara.</div>
                                            <div className="flex justify-between items-center mb-1"><span className="text-[8px] font-bold uppercase theme-text">Abierto hacia</span>
                                                <select className="text-[9px] border theme-border rounded px-1 theme-input py-1 w-28" value={zone.morphOrientation||'0'} onChange={e=>{commitState(); updateZoneProp(zone.id, 'morphOrientation', e.target.value)}}>
                                                    <option value="1">{getEdgeLabel(0)} (Frente)</option>
                                                    <option value="0">{getEdgeLabel(2)} (Fondo)</option>
                                                    <option value="2">{getEdgeLabel(3)} (Izq.)</option>
                                                    <option value="3">{getEdgeLabel(1)} (Der.)</option>
                                                </select>
                                            </div>
                                            <div className="flex justify-between items-center mt-1"><span className="text-[8px] font-bold uppercase theme-text">Grosor Cuerpo (m)</span><input type="number" className="w-16 border theme-border text-center text-[10px] rounded font-bold theme-input py-1" value={zone.paramU_Cuerpo ?? 5} step="0.5" min="0" onChange={e => updateZoneProp(zone.id, 'paramU_Cuerpo', cleanNumber(e.target.value))} onFocus={commitState} /></div>
                                            <div className="flex justify-between items-center mt-1"><span className="text-[8px] font-bold uppercase theme-text">Grosor Brazo Izq. (m)</span><input type="number" className="w-16 border theme-border text-center text-[10px] rounded font-bold theme-input py-1" value={zone.paramU_BrazoI ?? 5} step="0.5" min="0" onChange={e => updateZoneProp(zone.id, 'paramU_BrazoI', cleanNumber(e.target.value))} onFocus={commitState} /></div>
                                            <div className="flex justify-between items-center mt-1"><span className="text-[8px] font-bold uppercase theme-text">Grosor Brazo Der. (m)</span><input type="number" className="w-16 border theme-border text-center text-[10px] rounded font-bold theme-input py-1" value={zone.paramU_BrazoD ?? 5} step="0.5" min="0" onChange={e => updateZoneProp(zone.id, 'paramU_BrazoD', cleanNumber(e.target.value))} onFocus={commitState} /></div>
                                        </>)}
                                                                                {zone.morphology === 'patio_central' && (<>
                                            <div className="text-[8px] theme-text-muted mb-2">Grosor de cada ala que rodea el patio central. El patio abre al centro del lote.</div>
                                            <div className="flex justify-between items-center mt-1"><span className="text-[8px] font-bold uppercase theme-text">{getEdgeLabel(0)} — Frente (m)</span><input type="number" className="w-14 border theme-border text-center text-[10px] rounded font-bold theme-input py-1" value={zone.paramPatioFren ?? 5} step="0.5" min="0" onChange={e => updateZoneProp(zone.id, 'paramPatioFren', cleanNumber(e.target.value))} onFocus={commitState} /></div>
                                            <div className="flex justify-between items-center mt-1"><span className="text-[8px] font-bold uppercase theme-text">{getEdgeLabel(2)} — Fondo (m)</span><input type="number" className="w-14 border theme-border text-center text-[10px] rounded font-bold theme-input py-1" value={zone.paramPatioPost ?? 5} step="0.5" min="0" onChange={e => updateZoneProp(zone.id, 'paramPatioPost', cleanNumber(e.target.value))} onFocus={commitState} /></div>
                                            <div className="flex justify-between items-center mt-1"><span className="text-[8px] font-bold uppercase theme-text">{getEdgeLabel(3)} — Izq. (m)</span><input type="number" className="w-14 border theme-border text-center text-[10px] rounded font-bold theme-input py-1" value={zone.paramPatioIzq ?? 5} step="0.5" min="0" onChange={e => updateZoneProp(zone.id, 'paramPatioIzq', cleanNumber(e.target.value))} onFocus={commitState} /></div>
                                            <div className="flex justify-between items-center mt-1"><span className="text-[8px] font-bold uppercase theme-text">{getEdgeLabel(1)} — Der. (m)</span><input type="number" className="w-14 border theme-border text-center text-[10px] rounded font-bold theme-input py-1" value={zone.paramPatioDer ?? 5} step="0.5" min="0" onChange={e => updateZoneProp(zone.id, 'paramPatioDer', cleanNumber(e.target.value))} onFocus={commitState} /></div>
                                        </>)}
                                    </div>
                                )}
                            </div>
                        ))}

                        <button className="ios-btn !py-2 w-full mt-1 border theme-border border-dashed" onClick={addMorphZone}>+ AÑADIR ZONA MORFOLÓGICA</button>
                    </CollapsibleCard>
                </div>
            );
        };


        /* =========================================================================
           PANEL C — VOLUMETRÍA
           Wrapper con tabs internos. Compone MorphPanel + RightPanel sin tocarlos.
           Tab state es LOCAL al componente — cero impacto en el motor paramétrico.
           ========================================================================= */
        const VolumetriaPanel = ({ config, updateConfig, commitState, sys, selectedFloorId, setSelectedFloorId }) => {
            const [activeTab, setActiveTab] = useState('morfo');

            return (

        /* =========================================================================

        /* PANEL — PROGRAMA (tabs: Por Pisos / Estacionamientos) */

        const ResultsPanel = ({ sys, config }) => {
            const statusOk   = (cond) => cond ? '✓ Cumple' : '✗ Excede';
            const statusCls  = (cond) => cond ? 'ok' : 'warn';

            /* ══ RSX: CAPA DE DIAGNÓSTICO — solo presentación ══════════════════
               Lee sys.indicators / sys.limits ya calculados. No modifica
               variables, funciones ni flujo de datos. Jerarquía:
               1 estado → 2 alerta única → 3 diagnóstico+soluciones → 4 detalle. */
            const rsxNum = (v) => Number(v) || 0;
            const rsxInd = sys.indicators;
            const rsxLim = sys.limits;

            /* Estado por indicador — bad usa los flags isExcess* existentes;
               na = sin límite configurado (no se juzga cumplimiento). */
            const rsxEstados = [
                { id: 'alibre', lbl: 'Área libre',        bad: !!rsxInd.isExcessHuella, na: false,                              real: rsxNum(rsxInd.aLibreReal),    ref: rsxNum(rsxLim.aLibreMin),      unit: 'm²' },
                { id: 'altura', lbl: 'Altura',            bad: !!rsxInd.isExcessH,      na: rsxNum(rsxLim.hLimitEfectivo) <= 0, real: rsxNum(rsxInd.hTotal),        ref: rsxNum(rsxLim.hLimitEfectivo), unit: 'm'  },
                { id: 'ce',     lbl: 'Coef. edificación', bad: !!rsxInd.isExcessCE,     na: rsxNum(rsxLim.aTechadaMax) <= 0,    real: rsxNum(rsxInd.aTechadaUsada), ref: rsxNum(rsxLim.aTechadaMax),    unit: 'm²' },
                { id: 'cos',    lbl: 'COS',               bad: !!rsxInd.isExcessCOS,    na: rsxNum(rsxInd.cosMax) <= 0,         real: rsxNum(rsxInd.huellaP1),      ref: rsxNum(rsxInd.cosMax),         unit: 'm²' },
                { id: 'cops',   lbl: 'COPS',              bad: !!rsxInd.isExcessCOPS,   na: rsxNum(rsxInd.copsMax) <= 0,        real: rsxNum(rsxInd.huellaSupMax),  ref: rsxNum(rsxInd.copsMax),        unit: 'm²' },
                { id: 'den',    lbl: 'Densidad',          bad: false,                   na: true,                               real: rsxNum(rsxInd.densidadNeta),  ref: 0,                             unit: 'hab/ha' },
            ];

            /* Cambio instantáneo: delta vs el render anterior. useRef no
               dispara re-renders — cero costo para el Canvas 3D. */
            const rsxPrev = useRef({});
            const rsxDeltas = {};
            rsxEstados.forEach(e => {
                const p = rsxPrev.current[e.id];
                rsxDeltas[e.id] = (p !== undefined) ? (e.real - p) : 0;
            });
            useEffect(() => {
                const next = {};
                rsxEstados.forEach(e => { next[e.id] = e.real; });
                rsxPrev.current = next;
            });

            const rsxFallas = rsxEstados.filter(e => e.bad && !e.na);
            const rsxAlerta = rsxFallas.length > 0 ? rsxFallas[0] : null;

            /* Recomendaciones informativas — no modifican el modelo. */
            const rsxRecs = {
                alibre: ['Aumentar retiros del lote', 'Generar terrazas descubiertas', 'Reducir la ocupación del 1er piso', 'Disminuir el área techada'],
                altura: ['Reducir el número de pisos', 'Disminuir la altura por piso', 'Aumentar ancho de vía o retiro frontal (H = factor × (vía + retiro))'],
                ce:     ['Reducir el área techada total', 'Quitar pisos o reducir plantas típicas'],
                cos:    ['Retranquear el primer piso (retiro independiente)', 'Reducir la huella del podio'],
                cops:   ['Reducir las plantas típicas de la torre', 'Aplicar retiros en pisos superiores'],
            };
            const rsxDec = (e) => e.unit === 'm' ? 1 : 0;
            const rsxMsg = (e) => e.id === 'alibre'
                ? `Faltan ${(e.ref - e.real).toFixed(0)} m² para cumplir la norma.`
                : `Excede el límite por ${(e.real - e.ref).toFixed(rsxDec(e))} ${e.unit}.`;

            return (
                <div style={{ display: 'flex', flexDirection: 'column', height: '100%', overflow: 'hidden' }}>

                    {/* HEADER */}
                    <div className="ph-macro">
                        <div className="ph-tag">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" width="10" height="10"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                            Resultados del Proyecto
                        </div>
                        <div className="ph-title">Área Libre · Densidad · Normativa</div>
                        <div className="ph-sub">Indicadores calculados automáticamente — solo lectura</div>
                        <span className="ph-badge badge-output">● Output</span>
                    </div>

                    <div style={{ flex: 1, overflowY: 'auto', minHeight: 0 }}>

                        {/* ══ 1. ESTADO DEL PROYECTO — siempre visible ══ */}
                        <div className="rsx-summary">
                            <div className="rsx-title">Estado del proyecto</div>
                            {rsxEstados.map(e => (
                                <div key={e.id} className={`rsx-row ${e.bad && !e.na ? 'bad' : ''}`}>
                                    <span className={`rsx-dot ${e.na ? 'na' : (e.bad ? 'bad' : 'ok')}`}>
                                        {e.na ? '•' : (e.bad ? '✗' : '✓')}
                                    </span>
                                    <span className="rsx-lbl">{e.lbl}</span>
                                    <span className="rsx-val">
                                        {e.real.toFixed(rsxDec(e))}
                                        {!e.na && e.ref > 0 && <span className="rsx-lim"> / {e.ref.toFixed(rsxDec(e))}</span>}
                                        <span className="rsx-lim"> {e.unit}</span>
                                        {Math.abs(rsxDeltas[e.id]) > 0.05 && (
                                            <span className="rsx-delta">
                                                {rsxDeltas[e.id] > 0 ? '▲' : '▼'}{Math.abs(rsxDeltas[e.id]).toFixed(rsxDec(e))}
                                            </span>
                                        )}
                                    </span>
                                </div>
                            ))}
                        </div>

                        {/* ══ 2. ALERTA PRINCIPAL — única ══ */}
                        {rsxAlerta ? (
                            <div className="rsx-alert">
                                <div className="rsx-alert-t">⚠ {rsxAlerta.lbl} {rsxAlerta.id === 'alibre' ? 'insuficiente' : 'excedido'}</div>
                                <div className="rsx-alert-s">{rsxMsg(rsxAlerta)}</div>
                            </div>
                        ) : (
                            <div className="rsx-alert" style={{borderColor: '#34c759', background: 'rgba(52,199,89,0.07)'}}>
                                <div className="rsx-alert-t" style={{color: '#34c759'}}>✓ El proyecto cumple la normativa</div>
                            </div>
                        )}

                        {/* ══ 3. DIAGNÓSTICO — auto-expandido solo por incumplimiento ══ */}
                        {rsxFallas.map(e => {
                            const esDeficit = e.id === 'alibre';
                            const pct = Math.min(
                                (esDeficit ? e.real / Math.max(e.ref, 0.01) : e.ref / Math.max(e.real, 0.01)) * 100,
                                100
                            );
                            return (
                                <div key={e.id} className="rsx-diag">
                                    <div className="rsx-title" style={{marginBottom: 2}}>{e.lbl}</div>
                                    <div className="rsx-diag-grid">
                                        <div className="rsx-diag-cell">
                                            <div className="rsx-cell-l">{esDeficit ? 'Generada' : 'Actual'}</div>
                                            <div className="rsx-cell-v">{e.real.toFixed(rsxDec(e))} {e.unit}</div>
                                        </div>
                                        <div className="rsx-diag-cell">
                                            <div className="rsx-cell-l">{esDeficit ? 'Requerida' : 'Límite'}</div>
                                            <div className="rsx-cell-v" style={{color: '#007aff'}}>{e.ref.toFixed(rsxDec(e))} {e.unit}</div>
                                        </div>
                                        <div className="rsx-diag-cell">
                                            <div className="rsx-cell-l">{esDeficit ? 'Déficit' : 'Exceso'}</div>
                                            <div className="rsx-cell-v" style={{color: '#ff3b30'}}>{Math.abs(e.ref - e.real).toFixed(rsxDec(e))} {e.unit}</div>
                                        </div>
                                    </div>
                                    <div className="rsx-bar">
                                        <div className="rsx-bar-fill" style={{width: `${pct}%`}}/>
                                    </div>
                                    <div className="rsx-msg">{e.real.toFixed(rsxDec(e))} / {e.ref.toFixed(rsxDec(e))} {e.unit} — {rsxMsg(e)}</div>
                                    <div className="rsx-rec">
                                        <div className="rsx-rec-t">Posibles soluciones</div>
                                        <ul>
                                            {rsxRecs[e.id].map((r, i) => <li key={i}>{r}</li>)}
                                        </ul>
                                    </div>
                                </div>
                            );
                        })}

                        {/* ══ 4. DETALLE TÉCNICO — colapsado por defecto.
                               TODO el contenido previo del panel vive aquí, intacto. ══ */}
                        <div style={{marginTop: 10}}>
                        <CollapsibleCard title="Detalle técnico normativo" defaultOpen={false}>

                        {/* Área Libre Generada — movido desde panel Programa */}
                        <CollapsibleCard title="Área Libre Generada">
                        {/* Área techada para referencia */}
                        <div className="flex justify-between items-center mb-1">
                            <span className="text-[10px] font-bold theme-text-muted uppercase">Área Techada</span>
                            <span className={`text-[11px] font-black ${sys.indicators.isExcessCE ? 'text-red-500' : 'theme-text'}`}>
                                {(sys.indicators.aTechadaUsada||0).toFixed(0)} m²
                                {sys.limits.aTechadaMax > 0 && <span className="font-bold text-[9px] theme-text-muted"> / máx {(sys.limits.aTechadaMax||0).toFixed(0)}</span>}
                            </span>
                        </div>
                        <div className="bar-container mb-3">
                            <div className={`bar-fill ${sys.indicators.isExcessCE ? 'bg-red-500' : 'bg-[#007aff]'}`} style={{ width: `${Math.min(((sys.indicators.aTechadaUsada||0) / Math.max(sys.limits.aTechadaMax||1, sys.indicators.aTechadaUsada||1)) * 100, 100)}%` }}/>
                        </div>

                        {/* Desglose por uso */}
                        <div className="text-[9px] font-bold theme-text-muted uppercase mb-2">Mínimo obligatorio por uso</div>
                        <div className="flex flex-col gap-2 mb-3">
                            {/* Residencial */}

                                <div className="flex justify-between items-center mb-1">
                                    <div className="flex items-center gap-1">
                                        <div style={{width:8,height:8,borderRadius:2,background:colors.res,flexShrink:0}}/>
                                        <span className="text-[9px] font-black text-[#F28C28] uppercase">Residencial</span>
                                        <span className="text-[8px] theme-text-muted">({config.pctLibreRes ?? 30}% del lote × frac. res.)</span>
                                    </div>
                                    <span className="text-[10px] font-black theme-text">{(sys.limits.aLibreMinRes||0).toFixed(1)} m²</span>
                                </div>
                                <div className="bar-container">
                                    <div className="bar-fill" style={{width:`${Math.min(((sys.limits.aLibreMinRes||0)/Math.max(sys.limits.aLote||1,1))*100,100)}%`, background:'#F28C28'}}/>
                                </div>
                            </div>
                            {/* Comercio / Equipamiento */}
                            <div className="p-2 rounded-lg border theme-border" style={{background:'var(--bg-input)'}}>
                                <div className="flex justify-between items-center mb-1">
                                    <div className="flex items-center gap-1">
                                        <div style={{width:8,height:8,borderRadius:2,background:colors.com,flexShrink:0}}/>
                                        <span className="text-[9px] font-black text-[#C62828] uppercase">Comercio + Eq.</span>
                                        <span className="text-[8px] theme-text-muted">({config.pctLibreCom ?? 0}%)</span>
                                    </div>
                                    <span className="text-[10px] font-black theme-text">{(sys.limits.aLibreMinNonRes||0).toFixed(1)} m²</span>
                                </div>
                                <div className="bar-container">
                                    <div className="bar-fill" style={{width:`${Math.min(((sys.limits.aLibreMinNonRes||0)/Math.max(sys.limits.aLote||1,1))*100,100)}%`, background:'#C62828'}}/>
                                </div>
                            </div>
                        </div>

                        {/* Resultado total */}
                        <div className={`p-3 rounded-xl border-2 ${sys.indicators.isExcessHuella ? 'border-red-400' : 'border-green-400'}`} style={{background:'var(--bg-card)'}}>
                            <div className="flex justify-between items-start mb-2">
                                <div>
                                    <div className="text-[9px] font-bold theme-text-muted uppercase">Mínimo ponderado total</div>
                                    <div className="text-[18px] font-black text-[#007aff]">{(sys.limits.aLibreMin||0).toFixed(1)} m²</div>
                                </div>
                                <div className="text-right">
                                    <div className="text-[9px] font-bold theme-text-muted uppercase">Generada real</div>
                                    <div className={`text-[18px] font-black ${sys.indicators.isExcessHuella ? 'text-red-500' : 'text-green-600'}`}>{(sys.indicators.aLibreReal||0).toFixed(1)} m²</div>
                                </div>
                            </div>
                            <div className="bar-container mb-1">
                                <div className={`bar-fill ${sys.indicators.isExcessHuella ? 'bg-red-500' : 'bg-green-500'}`} style={{ width: `${Math.min(((sys.indicators.aLibreReal||0) / Math.max(sys.limits.aLibreMin||1, 1)) * 100, 100)}%` }}/>
                            </div>
                            <div className={`text-[9px] font-black uppercase text-center mt-1 ${sys.indicators.isExcessHuella ? 'text-red-500' : 'text-green-600'}`}>
                                {sys.indicators.isExcessHuella ? '⚠ DÉFICIT de área libre' : '✓ Cumple área libre mínima'}
                            </div>
                        </div>
                    </CollapsibleCard>

                        {/* Densidad Neta — movido desde panel Programa */}
                        <CollapsibleCard title="Densidad Neta">
                        <div className="grid grid-cols-2 gap-3">
                            <div className="border theme-border rounded-xl p-3 flex flex-col items-center justify-center text-center" style={{background:'var(--bg-card)'}}>
                                <div className="text-[9px] font-bold theme-text-muted uppercase mb-1">Densidad Neta</div>
                                <div className="text-[28px] font-black theme-text">{Math.round(sys.indicators.densidadNeta||0)}</div>
                                <div className="text-[9px] font-bold text-[#007aff]">HAB / HA</div>
                            </div>
                            <div className="border theme-border rounded-xl p-3 flex flex-col items-center justify-center text-center" style={{background:'var(--bg-card)'}}>
                                <div className="text-[9px] font-bold theme-text-muted uppercase mb-1">Habitantes Est.</div>
                                <div className="text-[28px] font-black theme-text">{Math.round(sys.indicators.poblacion||0)}</div>
                                <div className="text-[9px] font-bold text-[#F28C28]">HAB TOTALES</div>
                            </div>
                        </div>
                        {/* Mezcla de usos */}
                        {sys.indicators.aTechadaUsada > 0 && (
                            <div className="mt-3 pt-2 border-t theme-border">
                                <div className="text-[9px] font-bold theme-text-muted uppercase mb-2">Mezcla de Usos (área techada)</div>
                                <div className="flex gap-1 h-2 rounded overflow-hidden">
                                    <div style={{flex: Math.max(0.01, (sys.indicators.aResTotal||0)), background: colors.res, transition:'flex 0.3s'}}/>
                                    <div style={{flex: Math.max(0.001, (sys.indicators.aComTotal||0)), background: colors.com, transition:'flex 0.3s'}}/>
                                    <div style={{flex: Math.max(0.001, (sys.indicators.aEqTotal||0)), background: colors.eq, transition:'flex 0.3s'}}/>
                                </div>
                                <div className="flex gap-3 mt-1.5">
                                    <span className="text-[8px] font-bold" style={{color:colors.res}}>RES {(((sys.indicators.aResTotal||0)/Math.max(sys.indicators.aTechadaUsada,1))*100).toFixed(0)}%</span>
                                    <span className="text-[8px] font-bold" style={{color:colors.com}}>COM {(((sys.indicators.aComTotal||0)/Math.max(sys.indicators.aTechadaUsada,1))*100).toFixed(0)}%</span>
                                    <span className="text-[8px] font-bold" style={{color:colors.eq}}>EQ {(((sys.indicators.aEqTotal||0)/Math.max(sys.indicators.aTechadaUsada,1))*100).toFixed(0)}%</span>
                                </div>
                            </div>
                        )}
                    </CollapsibleCard>

                        {/* ── SECCIÓN: SUPERFICIE ── */}
                        <div className="rs-section-title">Superficie</div>
                        <div className="metric-grid">
                            <div className="metric-card accent-l">

                                <div className="mc-unit">m²</div>

                                <div className="mc-value sm" style={{color: sys.indicators.isExcessHuella ? '#ff3b30' : 'var(--text-main)'}}>
                                    {sys.indicators.aLibreReal.toFixed(0)}
                                </div>
                                <div className="mc-unit">m²</div>
                                <span className={`mc-status ${statusCls(!sys.indicators.isExcessHuella)}`}>
                                    {statusOk(!sys.indicators.isExcessHuella)}
                                </span>
                            </div>
                            <div className="metric-card full-width" style={{background:'var(--bg-input)'}}>
                                <div className="mc-label">Área Libre Mínima Requerida</div>
                                <div className="flex items-end gap-2 mt-1">

                                {/* Desglose base + terraza cuando hay datos */}
                                {sys.limits.aLibreTerraza > 0.1 && (
                                    <div className="flex gap-2 mt-2 pt-2 border-t theme-border">

            const handleAddFloor = (type) => { 
                commitState(); 
                const maxH = type === 'res' ? 3 : 4; 
                const newFloor = { id: Date.now(), type, h: maxH, isCollapsed: false, blockMods: {}, unitVerticalFactor: 1 };
                if (type === 'res') {
                    newFloor.areaViv = 75; newFloor.dorm = 3; newFloor.pctCirculacion = 15;
                } else {
                    newFloor.useCatId = config.nonResCategories.length > 0 ? config.nonResCategories[0].id : null;
                }
                updateConfig('floors', [...config.floors, newFloor]); 
            };
            const handleDelFloor = (id) => { commitState(); updateConfig('floors', config.floors.filter(f => f.id !== id)); };
            
            const handleDupFloor = (floor) => { 
                commitState(); 
                const cloned = JSON.parse(JSON.stringify(floor)); 
                cloned.id = Date.now(); 
                updateConfig('floors', [...config.floors, cloned]); 
            };
            
            const handleUseChange = (id, newType) => { 
                commitState(); 
                updateConfig('floors', config.floors.map(f => {
                    if (f.id === id) {
                        const updated = { ...f, type: newType, h: Math.min(f.h, newType === 'res' ? 3 : 4) };
                        if (newType === 'res') {
                            updated.areaViv = f.areaViv || 75; updated.dorm = f.dorm || 3; updated.pctCirculacion = f.pctCirculacion !== undefined ? f.pctCirculacion : 15;
                            delete updated.useCatId;
                        } else {
                            updated.useCatId = f.useCatId || (config.nonResCategories.length > 0 ? config.nonResCategories[0].id : null);
                            delete updated.areaViv; delete updated.dorm; delete updated.pctCirculacion;
                        }
                        return updated;
                    }
                    return f;
                })); 
            };
            
            const handleHeightChange = (id, newH) => updateConfig('floors', config.floors.map(f => f.id === id ? { ...f, h: newH } : f));
            const handleAreaVivChange = (id, newA) => updateConfig('floors', config.floors.map(f => f.id === id ? { ...f, areaViv: newA } : f));
            const handleDormChange = (id, newD) => updateConfig('floors', config.floors.map(f => f.id === id ? { ...f, dorm: newD } : f));
            const handlePctCirculacionChange = (id, newPct) => updateConfig('floors', config.floors.map(f => f.id === id ? { ...f, pctCirculacion: newPct } : f));
            const handleUnitFactorChange = (id, v) => { commitState(); updateConfig('floors', config.floors.map(f => f.id === id ? { ...f, unitVerticalFactor: Number(v) } : f)); };
            const handleUseCatChange = (id, newCatId) => { commitState(); updateConfig('floors', config.floors.map(f => f.id === id ? { ...f, useCatId: newCatId } : f)); };
            const toggleCollapse = (id) => updateConfig('floors', config.floors.map(f => f.id === id ? { ...f, isCollapsed: !f.isCollapsed } : f));

                // no a retirosNormativos globales. Antes el toggle 'primerPisoIndependiente'
                // funcionaba en el cálculo pero el UI seguía editando los globales.
                if (isGroundFloor && !config.primerPisoIndependiente) {
                    const faceMap = { retF: 'frontal', retP: 'posterior', retD: 'derecho', retI: 'izquierdo' };
                    updateConfig('retirosNormativos', { ...config.retirosNormativos, [faceMap[faceKey]]: { active: val > 0, val: val } });
                } else {
                    updateConfig('floors', config.floors.map(f => f.id === id ? { ...f, blockMods: { ...(f.blockMods || {}), [bIdx]: { ...((f.blockMods || {})[bIdx] || { retF: 0, retP: 0, retD: 0, retI: 0 }), [faceKey]: Math.max(0, val) } } } : f));
                }

                commitState(); const newFloors = [...config.floors];

                else if (direction === 'down' && index > 0) { [newFloors[index], newFloors[index - 1]] = [newFloors[index - 1], newFloors[index]]; updateConfig('floors', newFloors); }
            };

        const TechnicalReportModal = ({ sys, config, glRef, onClose, buildAndExportPDF, validateCompliance, generateUrbanNarrative }) => {
            const [isExporting, setIsExporting] = useState(false);
            const [capturedImg, setCapturedImg]  = useState(null);

            // Capturar canvas en el montaje (síncrono, preserveDrawingBuffer: true)
            React.useEffect(() => {
                if (glRef.current) {
                    try {
                        const dataUrl = glRef.current.domElement.toDataURL('image/png');
                        setCapturedImg(dataUrl);
                    } catch (e) {
                        console.warn('Canvas capture failed:', e);
                    }
                }
            }, []);

            // Cerrar con Escape
            React.useEffect(() => {
                const handleKey = (e) => { if (e.key === 'Escape') onClose(); };
                window.addEventListener('keydown', handleKey);
                return () => window.removeEventListener('keydown', handleKey);
            }, [onClose]);

            const compliance = validateCompliance(sys, config);
            const narrative  = generateUrbanNarrative(sys, config);
            const today      = new Date().toLocaleDateString('es-PE', { year:'numeric', month:'long', day:'numeric' });
            const floorCount = config.floors.length;
            const useMap     = { res: 'Residencial', com: 'Comercial', eq: 'Equipamiento' };
            const useColor   = { res: 'rp-use-res', com: 'rp-use-com', eq: 'rp-use-eq' };

            const statusClass = (s) => {
                if (s === 'Compatible') return 'rp-status-ok';
                if (s === 'Compatible con ajuste') return 'rp-status-warn';
                if (s === 'Informativo') return 'rp-status-info';
                return 'rp-status-error';

                const idx = sys.floors.length - 1 - rIdx;
                const area = (f.areaReal || 0).toFixed(1);
                return { num: idx + 1, type: f.type, h: (f.h||3).toFixed(1), area, isBase: idx === 0 };

                                className="report-btn-pdf"
                                onClick={() => buildAndExportPDF(setIsExporting)}
                                disabled={isExporting}
                            >

                                {isExporting ? 'Exportando…' : 'Exportar PDF'}

                        {/* CARÁTULA */}

                            <div className="rp-cover-title">Informe Técnico</div>
                            <div className="rp-cover-subtitle">Análisis normativo</div>
                            <div className="rp-cover-meta">
                                <div className="rp-cover-meta-item">
                                    <div className="rp-meta-label">Área de Lote</div>
                                    <div className="rp-meta-value">{sys.limits.aLote.toFixed(1)} m²</div>
                                </div>
                                <div className="rp-cover-meta-item">
                                    <div className="rp-meta-label">Niveles Propuestos</div>
                                    <div className="rp-meta-value">{floorCount} nivel{floorCount !== 1 ? 'es' : ''}</div>
                                </div>

                                    <div className="rp-meta-label">Fecha de Emisión</div>

                                        <span className="rp-cell-label">Frente</span>
                                        <span className="rp-cell-value">{sys.inputs.f}</span>
                                        <span className="rp-cell-unit">metros</span>

            const toggleMode = (mode) => { setIsPushPullMode(mode === 'pushpull' ? !isPushPullMode : false); setMeasureMode(mode === 'measure' ? !measureMode : false); setMeasurePts([]); if (mode !== 'pushpull') setActiveExtrusion(null); };

            const commitState = () => { setHistory(prev => { const newHist = [...prev, JSON.parse(JSON.stringify(config))]; if (newHist.length > 15) newHist.shift(); return newHist; }); setFuture([]); };
            const undo = () => { if (history.length === 0) return; const previousState = history[history.length - 1]; setFuture(prev => [JSON.parse(JSON.stringify(config)), ...prev]); setHistory(prev => prev.slice(0, -1)); setConfig(previousState); setSelectedFloorId(null); };
            const redo = () => { if (future.length === 0) return; const nextState = future[0]; setHistory(prev => [...prev, JSON.parse(JSON.stringify(config))]); setFuture(prev => prev.slice(1)); setConfig(nextState); setSelectedFloorId(null); };

            useEffect(() => {
                const handleMouseMove = (e) => { /* floating panels — no drag resize */ };
                const handleMouseUp = () => { dragState.current = null; };
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') { setIsPushPullMode(false); setActiveExtrusion(null); setMeasureMode(false); setMeasurePts([]); setOpenPanel(null); document.body.style.cursor = 'auto'; }
                    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) { if (e.shiftKey) redo(); else undo(); } else if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y')) { redo(); }
                };
                window.addEventListener('mousemove', handleMouseMove); window.addEventListener('mouseup', handleMouseUp); window.addEventListener('keydown', handleKeyDown);
                return () => { window.removeEventListener('mousemove', handleMouseMove); window.removeEventListener('mouseup', handleMouseUp); window.removeEventListener('keydown', handleKeyDown); };
            }, [config, history, future]);

            const updateConfig = (key, value) => setConfig(prev => ({ ...prev, [key]: value }));

            const handleSaveJSON = () => { 
                // P3.2 — Permitir nombrar archivos al guardar

                if (userName === null) return; // cancelado
                const safeName = (userName.trim() || defaultName).replace(/[^a-zA-Z0-9_\-]/g, '_');
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(config, null, 2)); 
                const anchorNode = document.createElement('a'); 
                anchorNode.setAttribute("href", dataStr); 
                anchorNode.setAttribute("download", `${safeName}.json`); 
                document.body.appendChild(anchorNode); 
                anchorNode.click(); 
                anchorNode.remove(); 
            };
            
            // P3.1 — Parser CSV simple (formato: tipo,h,areaViv,dorm,pctCirculacion)
            // Cabecera esperada (case-insensitive): tipo,h,areaviv,dorm,pctcirculacion,usecatid
            const parseCSVtoFloors = (csvText) => {
                const lines = csvText.split(/\r?\n/).filter(l => l.trim().length > 0);
                if (lines.length < 2) throw new Error("CSV vacío o sin filas de datos");
                const header = lines[0].split(',').map(s => s.trim().toLowerCase());
                const idxTipo = header.indexOf('tipo');
                const idxH = header.indexOf('h');
                const idxAv = header.indexOf('areaviv');
                const idxDorm = header.indexOf('dorm');
                const idxPct = header.indexOf('pctcirculacion');
                const idxCat = header.indexOf('usecatid');
                if (idxTipo < 0 || idxH < 0) throw new Error("Cabecera CSV requiere mínimo: tipo,h");
                
                const newFloors = [];
                for (let i = 1; i < lines.length; i++) {
                    const cols = lines[i].split(',').map(s => s.trim());
                    const tipo = (cols[idxTipo] || 'res').toLowerCase();
                    const validType = ['res','com','eq'].includes(tipo) ? tipo : 'res';
                    const h = parseFloat(cols[idxH]) || (validType === 'res' ? 3 : 4);
                    const floor = { 
                        id: Date.now() + i, 
                        type: validType, 
                        h: h, 
                        isCollapsed: false, 
                        blockMods: {} 
                    };
                    if (validType === 'res') {
                        floor.areaViv = idxAv >= 0 ? (parseFloat(cols[idxAv]) || 75) : 75;
                        floor.dorm = idxDorm >= 0 ? (parseInt(cols[idxDorm]) || 3) : 3;
                        floor.pctCirculacion = idxPct >= 0 ? (parseFloat(cols[idxPct]) || 15) : 15;
                    } else {
                        floor.useCatId = idxCat >= 0 ? (cols[idxCat] || null) : null;
                    }
                    newFloors.push(floor);
                }
                return newFloors;
            };
            
            const handleLoadFile = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const ext = (file.name.split('.').pop() || '').toLowerCase();
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        if (ext === 'csv') {
                            // P3.1 — Importación CSV: reemplaza solo los floors, mantiene el resto del config
                            const newFloors = parseCSVtoFloors(event.target.result);
                            if (newFloors.length === 0) throw new Error("No se generaron pisos del CSV");
                            commitState();
                            setConfig(prev => ({ ...prev, floors: newFloors }));
                            alert(`Importados ${newFloors.length} niveles desde CSV.`);
                        } else {
                            // JSON (compatibilidad con flujo anterior)
                            const loadedConfig = JSON.parse(event.target.result);
                            if (!loadedConfig.nonResCategories || loadedConfig.nonResCategories.length === 0 || !loadedConfig.nonResCategories[0].parentUse) {
                                loadedConfig.nonResCategories = [
                                    { id: 'cat_com', parentUse: 'com', pctOfParent: 100, name: 'Comercial (Legacy)', estReduccion: loadedConfig.estReduccionCom || 20, estCalcMetodo: loadedConfig.estCalcMetodoCom || 'area_util', estAreaUtil: loadedConfig.estAreaUtilCom || 50, estM2PorPersona: loadedConfig.estM2PorPersonaCom || 5, estPersonaPorCajo: loadedConfig.estPersonaPorCajoCom || 10 }
                                ];
                            }
                            loadedConfig.floors = loadedConfig.floors.map(f => {
                                if (f.type === 'res' && f.pctCirculacion === undefined) f.pctCirculacion = 15;
                                return f;
                            });
                            commitState(); 
                            setConfig({ ...config, ...loadedConfig });
                        }
                    } catch (error) { 
                        alert("Error al cargar archivo: " + (error.message || "formato inválido")); 
                    }
                };
                reader.readAsText(file);

            // Alias retro-compatibilidad (otras partes del código pueden referenciar handleLoadJSON)

            /* =========================================================================
               SYS.COMPLIANCE — Matriz de validación técnica paramétrica
               Desacoplado de UI. Solo recibe sys + config, devuelve array de filas.
               ========================================================================= */
            const validateCompliance = (sys, config) => {
                const rows = [];

                // ── Altura máxima ──────────────────────────────────────────────
                const hReq  = sys.limits.hLimitEfectivo;
                const hProp = sys.indicators.hTotal;
                const hDiff = hProp - hReq;
                const hPct  = hReq > 0.1 ? ((hDiff / hReq) * 100) : 0;
                rows.push({
                    parameter: 'Altura total (H)',
                    required:  hReq > 0.1 ? `${hReq.toFixed(1)} m` : 'Sin restricción',
                    proposed:  `${hProp.toFixed(1)} m`,
                    difference: hReq > 0.1 ? `${hDiff >= 0 ? '+' : ''}${hDiff.toFixed(1)} m` : '—',
                    percentageDifference: hReq > 0.1 ? `${hDiff >= 0 ? '+' : ''}${hPct.toFixed(1)}%` : '—',
                    status: !sys.indicators.isExcessH
                        ? 'Compatible'
                        : (hDiff < 0.5 ? 'Requiere revisión' : 'No compatible'),
                    strategy: sys.indicators.isExcessH
                        ? 'Reducción de altura en nivel superior o ajuste de entrepiso'
                        : 'Proyecto compatible con la envolvente normativa'
                });

                // ── Coeficiente de Edificación ─────────────────────────────────
                const ceReq  = Number(config.ceBase) || 0;
                const ceProp = sys.limits.aLote > 0
                    ? sys.indicators.aTechadaUsada / sys.limits.aLote
                    : 0;
                const ceDiff = ceProp - ceReq;
                const cePct  = ceReq > 0.01 ? ((ceDiff / ceReq) * 100) : 0;
                rows.push({
                    parameter: 'Coeficiente de Edificación (CE)',
                    required:  ceReq > 0 ? ceReq.toFixed(1) : 'Sin restricción',
                    proposed:  ceProp.toFixed(2),
                    difference: ceReq > 0 ? `${ceDiff >= 0 ? '+' : ''}${ceDiff.toFixed(2)}` : '—',
                    percentageDifference: ceReq > 0 ? `${ceDiff >= 0 ? '+' : ''}${cePct.toFixed(1)}%` : '—',
                    status: !sys.indicators.isExcessCE
                        ? 'Compatible'
                        : (Math.abs(ceDiff) < 0.1 ? 'Compatible con ajuste' : 'No compatible'),
                    strategy: sys.indicators.isExcessCE
                        ? 'Reducción de footprint o redistribución programática por piso'
                        : 'Coeficiente dentro del rango normativo'
                });

                // ── Área libre ─────────────────────────────────────────────────
                const alReq  = sys.limits.aLibreMin;
                const alProp = sys.indicators.aLibreReal;
                const alDiff = alProp - alReq;
                const alPct  = alReq > 0.1 ? ((alDiff / alReq) * 100) : 0;
                rows.push({
                    parameter: 'Área libre efectiva',
                    required:  `${alReq.toFixed(1)} m²`,
                    proposed:  `${alProp.toFixed(1)} m²`,
                    difference: `${alDiff >= 0 ? '+' : ''}${alDiff.toFixed(1)} m²`,
                    percentageDifference: `${alDiff >= 0 ? '+' : ''}${alPct.toFixed(1)}%`,
                    status: !sys.indicators.isExcessHuella
                        ? 'Compatible'
                        : (Math.abs(alDiff) < 4 ? 'Compatible con ajuste' : 'Requiere compensación'),
                    strategy: sys.indicators.isExcessHuella
                        ? `Déficit de ${Math.abs(alDiff).toFixed(1)} m² — incorporar retranqueos, patios interiores o vacíos compositivos en pisos superiores`
                        : 'Área libre normativa cubierta (suelo + terrazas sobre plataformas)'
                });

                // ── Retiro frontal ─────────────────────────────────────────────
                const rfConfig = config.retirosNormativos?.frontal;
                if (rfConfig?.active) {
                    const rfReq  = Number(rfConfig.val) || 0;
                    const rfProp = sys.limits.retiroEfectivoFrontal;
                    rows.push({
                        parameter: 'Retiro frontal',
                        required:  `${rfReq.toFixed(1)} m`,
                        proposed:  `${rfProp.toFixed(1)} m`,
                        difference: `${(rfProp - rfReq) >= 0 ? '+' : ''}${(rfProp - rfReq).toFixed(1)} m`,
                        percentageDifference: rfReq > 0 ? `${(((rfProp - rfReq) / rfReq) * 100).toFixed(1)}%` : '—',
                        status: rfProp >= rfReq - 0.01 ? 'Compatible' : 'Requiere revisión',
                        strategy: rfProp < rfReq
                            ? 'Ajustar retiro frontal según norma de zonificación vigente'
                            : 'Retiro frontal según norma'
                    });
                }

                // ── Densidad neta ──────────────────────────────────────────────
                const densNeta = sys.indicators.densidadNeta;
                rows.push({
                    parameter: 'Densidad neta estimada',
                    required:  '— hab/ha',
                    proposed:  `${Math.round(densNeta)} hab/ha`,
                    difference: '—',
                    percentageDifference: '—',
                    status: 'Informativo',
                    strategy: densNeta > 1000
                        ? 'Verificar compatibilidad con densidad máxima del PDU/RNE'
                        : 'Densidad dentro de rango residencial común'
                });

                return rows;
            };

            const generateUrbanNarrative = (sys, config) => {
                const nPisos    = config.floors.length;

                const hasCom    = tiposMix.includes('com') || tiposMix.includes('eq');
                const lotType   = config.lotType || 'medianero';
                const lotLabel  = { medianero: 'medianero', esquina: 'esquina', '3_frentes': 'tres frentes', '4_frentes': 'cuatro frentes' }[lotType] || lotType;

                const contexto = `El proyecto se emplaza en un lote de ${sys.limits.aLote.toFixed(1)} m² (frente ${sys.inputs.f}m × fondo ${sys.inputs.d}m), en condición de lote ${lotLabel}. La envolvente normativa define una altura máxima de ${sys.limits.hLimitEfectivo > 0 ? sys.limits.hLimitEfectivo.toFixed(1) + ' m' : 'libre según reglamento'} y un coeficiente de edificación de ${Number(config.ceBase) || 0}.`;

                let estrategia = '';
                if (isMixed && hasRes && hasCom) {
                    estrategia = `La propuesta desarrolla un programa de uso mixto en ${nPisos} nivel${nPisos > 1 ? 'es' : ''}, articulando un zócalo de usos no residenciales en los primeros niveles con vivienda en los niveles superiores. Esta disposición programática responde a la lógica de densificación progresiva, maximizando el aprovechamiento del coeficiente de edificación mediante una transición escalonada de la huella construida.`;
                } else if (hasRes) {
                    estrategia = `El proyecto propone un programa exclusivamente residencial de ${nPisos} nivel${nPisos > 1 ? 'es' : ''}, con una estrategia volumétrica orientada a optimizar el área útil por planta respetando las condiciones de retiro, área libre y altura máxima establecidas en la normativa vigente.`;
                } else {
                    estrategia = `El proyecto desarrolla un programa no residencial de ${nPisos} nivel${nPisos > 1 ? 'es' : ''}, con distribución de usos orientada a maximizar la eficiencia programática dentro de los parámetros normativos del lote analizado.`;
                }

                const libre = !sys.indicators.isExcessHuella
                    ? `El proyecto genera ${sys.indicators.aLibreReal.toFixed(1)} m² de área libre efectiva (${((sys.indicators.aLibreReal / sys.limits.aLote) * 100).toFixed(1)}% del lote), superando el mínimo normativo exigido de ${sys.limits.aLibreMin.toFixed(1)} m²${sys.limits.aLibreTerraza > 0.1 ? ', incorporando ' + sys.limits.aLibreTerraza.toFixed(1) + ' m² en terrazas generadas por retranqueos de pisos superiores' : ''}.`
                    : `El área libre efectiva generada asciende a ${sys.indicators.aLibreReal.toFixed(1)} m², registrando un déficit de ${sys.limits.aLibreFaltante.toFixed(1)} m² respecto al mínimo normativo de ${sys.limits.aLibreMin.toFixed(1)} m². Se recomienda incorporar estrategias de retranqueo progresivo, patio interior, vacío compositivo o terraza computable en los niveles superiores para cerrar la brecha normativa.`;

                const altura = !sys.indicators.isExcessH
                    ? `La altura total propuesta de ${sys.indicators.hTotal.toFixed(1)} m resulta compatible con el límite normativo de ${sys.limits.hLimitEfectivo > 0 ? sys.limits.hLimitEfectivo.toFixed(1) + ' m' : '(sin restricción activa)'}, con un margen disponible de ${sys.limits.hLimitEfectivo > 0 ? (sys.limits.hLimitEfectivo - sys.indicators.hTotal).toFixed(1) + ' m' : '—'}.`
                    : `La altura total de ${sys.indicators.hTotal.toFixed(1)} m supera el límite normativo de ${sys.limits.hLimitEfectivo.toFixed(1)} m en ${(sys.indicators.hTotal - sys.limits.hLimitEfectivo).toFixed(1)} m, requiriendo ajuste de entrepiso, reducción de nivel o revisión del método de cálculo de altura máxima.`;

                const densidad = `La densidad neta resultante es de ${Math.round(sys.indicators.densidadNeta)} hab/ha, para una población estimada de ${Math.round(sys.indicators.poblacion)} habitantes. El proyecto requiere ${sys.indicators.estReq} cajón${sys.indicators.estReq !== 1 ? 'es' : ''} de estacionamiento, cubiertos mediante ${sys.parking?.sotanos?.numSotanos || 0} nivel${(sys.parking?.sotanos?.numSotanos || 0) !== 1 ? 'es' : ''} de sótano estimado${(sys.parking?.sotanos?.numSotanos || 0) !== 1 ? 's' : ''}.`;

                const allOk = !sys.indicators.isExcessH && !sys.indicators.isExcessCE && !sys.indicators.isExcessHuella;
                const conclusion = allOk
                    ? `El proyecto cumple con la totalidad de los parámetros normativos evaluados en el presente informe —altura, coeficiente de edificación y área libre— configurando una propuesta técnicamente viable y compatible con la zonificación vigente del lote analizado.`
                    : `El proyecto presenta observaciones en ${[sys.indicators.isExcessH && 'altura máxima', sys.indicators.isExcessCE && 'coeficiente de edificación', sys.indicators.isExcessHuella && 'área libre mínima'].filter(Boolean).join(', ')}, requiriendo ajustes volumétricos y/o programáticos para alcanzar compatibilidad normativa integral.`;

                return { contexto, estrategia, libre, altura, densidad, conclusion };
            };

                        // Leer HOJA 1: Programación
                        const progSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const progJson = XLSX.utils.sheet_to_json(progSheet);
                        
                        if (progJson.length === 0) {
                            alert('❌ La hoja de programación está vacía');
                            return;
                        }
                        
                        // Validar columnas obligatorias
                        const requiredCols = ['PISO', 'ALTURA_PISO', 'USO_PRINCIPAL', 'AREA_CONSTRUIDA'];
                        const firstRow = progJson[0];
                        const missingCols = requiredCols.filter(col => !(col in firstRow));
                        
                        if (missingCols.length > 0) {
                            alert(`❌ Faltan columnas obligatorias: ${missingCols.join(', ')}`);
                            return;
                        }
                        
                        // PROCESAR DATOS Y GENERAR MASA 3D
                        processExcelAndGenerateMass(progJson, workbook);
                        
                        alert('✅ Programación importada correctamente. Generando masa edificatoria...');
                        
                    } catch (error) {
                        console.error('Error al leer Excel:', error);
                        alert('❌ Error al procesar el archivo. Verifica el formato.');
                    }
                };
                
                reader.readAsBinaryString(file);
                e.target.value = ''; // Reset input

                    else { const personas = Math.floor(aUtilNeto / (Number(cat.estM2PorPersona) || 5)); req = Math.ceil(personas / (Number(cat.estPersonaPorCajo) || 10)); }
                    
                    estReqNonRes += req;
                    return { ...cat, assignedArea, aUtilNeto, req };
                });

                const estReqRes = Math.ceil(viviendasTotales * ((Number(config.estResNum) || 0) / (Number(config.estResDen) || 1)));
                const estReqTotal = estReqRes + estReqNonRes;

                /* =========================================================================
                   MOTOR DE ÁREA LIBRE — USO MIXTO (COM + RES)

                   Principio normativo aplicado:
                   1. Para uso mixto, la exigencia QUE APLICA es la MÁXIMA entre todos
                      los usos presentes. NO se promedian ni se suman los porcentajes.
                   2. El piso comercial inferior "pre-genera" área libre con su retiro.
                   3. Los pisos residenciales superiores deben completar el DIFERENCIAL
                      faltante mediante retranqueos, patios o vacíos sobre la plataforma.
                   4. El área de terraza sobre una plataforma inferior computa como
                      continuidad del área libre del nivel del terreno.

                   Ejemplo: Lote=120m², COM 20%, RES 30%
                     → aLibreMin = 120 × max(0.20, 0.30) = 36 m²
                     → Piso 1 aporta: 120 × 0.20 = 24 m² (libre suelo)
                     → Diferencial: 36 − 24 = 12 m² (debe venir de retranqueo piso 2)
                     → Si piso 2 reduce huella 12 m² → terraza = 12 m² → cumple
                   ========================================================================= */
                const pctLibreRes = (Number(config.pctLibreRes) ?? 30) / 100;
                const pctLibreCom = (Number(config.pctLibreCom) ?? 0) / 100;
                const aResTotal   = aTechadaUsada - areaComTotal - areaEqTotal;

                // Detección de uso mixto: coexiste área residencial Y comercial/eq
                const hasRes  = aResTotal > 0.1;
                const hasCom  = (areaComTotal + areaEqTotal) > 0.1;
                const isMixed = hasRes && hasCom;

                // Porcentaje exigible efectivo:
                //   · Uso mixto  → el MÁXIMO entre residencial y comercio (no promedio)
                //   · Solo RES   → pctLibreRes
                //   · Solo COM   → pctLibreCom
                const pctLibreEfectivo = isMixed
                    ? Math.max(pctLibreRes, pctLibreCom)
                    : (hasRes ? pctLibreRes : pctLibreCom);

                // Área libre mínima normativa total del proyecto
                const aLibreMin = aLote * pctLibreEfectivo;

                // === ÁREA LIBRE REAL: suelo + terrazas sobre plataformas inferiores ===
                //
                // aLibreBase   = libre al nivel del terreno (lote − huella piso 1)
                // aLibreTerraza = vacíos acumulados cuando la huella SE REDUCE en pisos
                //                 superiores (retranqueo → terraza computable)
                // Si la huella AUMENTA, no se descuenta (no existe vacío computable).
                const huellaPiso1 = processedFloors.length > 0
                    ? (processedFloors[0].areaReal || 0)
                    : aLote;
                // Area libre base = lote minus the actual first floor footprint
                // For polygon lotes: compare areas directly
                const aLibreBase = Math.max(0, aLote - huellaPiso1);

                let aLibreTerraza = 0;
                for (let idx = 1; idx < processedFloors.length; idx++) {
                    const delta = (processedFloors[idx - 1].areaReal || 0)
                                - (processedFloors[idx].areaReal     || 0);
                    if (delta > 0.01) aLibreTerraza += delta;
                }

                // Total computable = libre en suelo + terrazas sobre plataformas
                const aLibreReal = aLibreBase + aLibreTerraza;

                // === BREAKDOWN NORMATIVO MIXTO (expuesto en limits para la UI) ===
                //
                // aLibreAportadaCom   : lo que el piso comercial genera con su propio retiro
                // aLibreReqRes        : lo que exige el uso residencial sobre el lote total
                // aLibreDiferencial   : brecha que los pisos superiores deben cerrar
                // aLibreTerrComputada : cuánto del diferencial ya fue cubierto con retranqueos
                // aLibreFaltante      : m² que aún faltan para cumplir la norma
                const aLibreAportadaCom   = isMixed ? Math.max(0, aLote * pctLibreCom) : 0;
                const aLibreReqRes        = isMixed ? Math.max(0, aLote * pctLibreRes)  : 0;
                const aLibreDiferencial   = isMixed ? Math.max(0, aLibreReqRes - aLibreAportadaCom) : 0;
                const aLibreTerrComputada = isMixed
                    ? Math.min(aLibreTerraza, aLibreDiferencial)
                    : aLibreTerraza;
                const aLibreFaltante = Math.max(0, aLibreMin - aLibreReal);

                // Mantiene nombres legacy para consumidores existentes
                const aLibreMinRes    = aLote * pctLibreRes;
                const aLibreMinNonRes = aLote * pctLibreCom;

                // H máx: usa viasCaras (nuevo) o vias legacy
                const viasCarasAll = config.viasCaras || [];
                const viasLegacy  = config.vias || {};
                let hMaxVias = [];
                // New face-based vias
                viasCarasAll.filter(v=>v.active).forEach(v => {
                    const retForFace = (config.retirosCaras||[]).find(r=>r.edgeIdx===v.edgeIdx);
                    const retVal = retForFace ? Number(retForFace.val)||0 : 0;
                    hMaxVias.push((Number(v.factor)||1.5) * ((Number(v.ancho)||0) + retVal));
                });
                // Legacy fallback if no viasCaras defined
                if (hMaxVias.length === 0 && viasLegacy.frontal?.active) {
                    hMaxVias.push((Number(viasLegacy.frontal.factor)||1.5)*((Number(viasLegacy.frontal.ancho)||0)+rF));
                }
                const hMaxBase = hMaxVias.length > 0 ? Math.max(...hMaxVias) : 0;
                let hLimitEfectivo = (config.metodoAltura === 'coeficiente') ? (aLote * (Number(config.ceBase)||0) / Math.max(0.1,areaOcupadaBaseGlobal)) * (Number(config.alturaPorPisoCoef) || 3.0) : hMaxBase;

                const parkingReq = parkingEngine.calcRequerimiento(viviendasTotales, catStats, config.estResNum, config.estResDen);
                const factorOcSot = (Number(config.factorOcupacionSotano) || 85) / 100;
                const pctCircSot = (Number(config.pctCirculacionSotano) || 50) / 100;
                const capacidadPorSotano = parkingEngine.calcCapacidadPorSotano(aLote, factorOcSot, pctCircSot, parkingEngine.AREA_RAMPA);
                const sotanos = parkingEngine.determinarSotanos(parkingReq.total, capacidadPorSotano, 5);

                return {
                    inputs: { f: fNum, d: dNum, lotType: config.lotType, pctLibreRes: config.pctLibreRes ?? 30, pctLibreCom: config.pctLibreCom ?? 0, vias: config.vias || {}, viasCaras: config.viasCaras || [] },
                    limits: {
                        // ── Base ──
                        aLote,
                        aLibreMin,
                        // ── Breakdown mixto ──
                        aLibreBase,
                        aLibreTerraza,
                        aLibreAportadaCom,
                        aLibreReqRes,
                        aLibreDiferencial,
                        aLibreTerrComputada,
                        aLibreFaltante,
                        isMixed,
                        // ── Legacy ──
                        aLibreMinRes,
                        aLibreMinNonRes,
                        // ── CE y alturas ──
                        aTechadaMax: aLote * (Number(config.ceBase)||0),
                        hMaxBase,
                        hLimitEfectivo,
                        retiroEfectivoFrontal:   edgeDists[0] || rF_leg,
                        retiroEfectivoPosterior: edgeDists[2] || rP_leg,
                        retiroEfectivoDerecho:   edgeDists[1] || rD_leg,
                        retiroEfectivoIzquierdo: edgeDists[3] || rI_leg,
                        edgeDists
                    },
                    geometry: { bW, bD, bCX, bCZ, lotePoly: lotePolyCCW, buildPoly, hasCustomPoly },
                    indicators: {
                        hTotal,
                        aTechadaUsada,
                        // aLibreReal ahora incluye suelo + terrazas sobre plataformas inferiores
                        aLibreReal,
                        aResTotal:    Math.max(0, aResTotal),
                        aComNonRes:   areaComTotal + areaEqTotal,
                        poblacion:    poblacionTotal,
                        densidadNeta: (poblacionTotal / (aLote / 10000)) || 0,
                        estReq:       estReqTotal,
                        isExcessH:      hTotal > hLimitEfectivo + 0.1,
                        isExcessCE:     aTechadaUsada > aLote * (Number(config.ceBase)||0) + 1,
                        // isExcessHuella: compara aLibreReal (suelo+terrazas) vs aLibreMin
                        isExcessHuella: aLibreReal < aLibreMin - 0.1,
                        aComTotal: areaComTotal,
                        aEqTotal:  areaEqTotal,
                        catStats,
                        // COS / COPS
                        huellaP1: processedFloors.length > 0 ? (processedFloors[0].areaReal || 0) : 0,
                        huellaSupMax: processedFloors.length > 1 ? Math.max(...processedFloors.slice(1).map(f => f.areaReal || 0)) : 0,
                        isExcessCOS:  (Number(config.cosBase) || 0) > 0 && processedFloors.length > 0 && (processedFloors[0].areaReal || 0) > aLote * (Number(config.cosBase) || 0) + 0.5,
                        isExcessCOPS: (Number(config.copsBase) || 0) > 0 && processedFloors.length > 1 && Math.max(...processedFloors.slice(1).map(f => f.areaReal || 0)) > aLote * (Number(config.copsBase) || 0) + 0.5,
                        cosMax: aLote * (Number(config.cosBase) || 0),
                        copsMax: aLote * (Number(config.copsBase) || 0),
                    },
                    parking: { 
                        req: parkingReq, 
                        capacidadPorSotano, 
                        sotanos,
                        areaPorCajon: parkingEngine.AREA_PORcajon,
                        config: { factorOcSot: factorOcSot * 100, pctCircSot: pctCircSot * 100 }
                    },
                    floors: processedFloors
                };
            }, [config]);

            return (
                <div className="ide-wrapper" data-theme={isDarkMode ? 'dark' : 'light'}>

                    {/* ════════════════════════════════════════════════════
                        HEADER — 44px, 5 grupos funcionales
                        G1 ARCHIVO | G2 HISTORIAL | G3 MODELADO | G4 VISTAS | G5 SISTEMA

                    <header className="hdr">
                        {/* G1: ARCHIVO */}
                        <div className="hdr-group">
                            <span className="hdr-logo">UPU</span>
                            <div className="hdr-sep"/>
                            <button className="hb" onClick={() => fileInputRef.current.click()} title="Abrir proyecto (.json / .csv)"><Icons.Open/></button>

                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            </button>
                            <button className="hb" onClick={() => excelImportRef.current.click()} title="Importar Excel">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                            </button>
                            <button className="hb" onClick={exportProjectToExcel} title="Exportar Excel">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" width="16" height="16"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                            </button>
                        </div>

                        {/* G2 + G3 + G4 + G5 centrado — reorganizado en clusters funcionales:
                            VISTA (proyección) | CÁMARA (movimiento) | EDICIÓN (modelado) | HISTORIAL */}
                        <div className="hdr-group" style={{gap: 6}}>

                            {/* ── CLUSTER 1: VISTA — proyecciones del modelo (2D / 3D / Planta†) ── */}
                            <div className="hdr-cluster">
                                <span className="hdr-cluster-label">Vista</span>
                                <button className={`hb vw ${activeView === '3d' ? 'on' : ''}`} onClick={() => setActiveView('3d')} title="Modelo 3D paramétrico"><Icons.View3D/></button>

                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 9h18M9 3v18"/><circle cx="15.5" cy="15.5" r="2.5"/><path d="M12 6h3M6 12v3"/></svg>
                                    </button>
                                )}
                            </div>

                            {/* ── CLUSTER 2: CÁMARA — movimiento / navegación ── */}

                            </div>

                            {/* ── CLUSTER 3: EDICIÓN — herramientas de modelado CAD ── */}

                                <button className={`hb ${isPushPullMode ? 'on' : ''}`} onClick={() => toggleMode('pushpull')} title="Push/Pull — extruir retiros"><Icons.Extrude/></button>

                                <>
                                    <div className="hdr-sep"/>

                                        className="hb"
                                        onClick={() => setShowReport(true)}

                                    </button>
                                </>
                            )}
                        </div>

                        {/* G6: PANELES — visible solo en móvil — 5 grupos */}
                        <div className="hdr-group mobile-panel-btns">
                            <button className={`hb ${openPanel === 'contexto' ? 'on' : ''}`} onClick={() => togglePanel('contexto')} title="Lote"><Icons.CtxUrban/></button>
                            <button className={`hb ${openPanel === 'normativa' ? 'on' : ''}`} onClick={() => togglePanel('normativa')} title="Normativa"><Icons.CtxNorm/></button>
                            <button className={`hb ${openPanel === 'morfo' ? 'on' : ''}`} onClick={() => togglePanel('morfo')} title="Morfología"><Icons.CtxVol/></button>
                            <button className={`hb ${openPanel === 'programa' ? 'on' : ''}`} onClick={() => togglePanel('programa')} title="Programa"><Icons.GridBuild/></button>

                        <input ref={excelImportRef} type="file" accept=".xlsx,.xls,.csv" onChange={handleExcelImport} style={{display:'none'}}/>
                        <input type="file" ref={fileInputRef} accept=".json,.csv" style={{display:'none'}} onChange={handleLoadFile}/>
                    </header>

                    {/* ════════════════════════════════════════════════════
                        LAYOUT: 2 RAILS IZQUIERDOS | VIEWER | 1 RAIL DERECHO
                        Rails: Urbano · Morfo (izquierda) | Programa (derecha)
                        ════════════════════════════════════════════════════ */}
                    <section className="upu-guide" aria-label="Pasos para crear un escenario">
                        <div className="upu-guide__intro"><strong>Tu escenario, paso a paso</strong><details><summary>¿Cómo empezar?</summary><div className="upu-guide__panel"><ol><li>Define el tamaño o importa la geometría del lote.</li><li>Ingresa las reglas que correspondan al predio.</li><li>Ajusta la forma del escenario.</li><li>Define los pisos y sus usos.</li></ol><p className="upu-guide__tip"><strong>Consejos:</strong> arrastra la escena para girarla y usa la rueda para acercarte. Guarda tu proyecto desde el botón del disquete.</p></div></details></div>
                        <div className="upu-steps">{[['contexto','Lote',Icons.CtxUrban],['normativa','Reglas',Icons.CtxNorm],['morfo','Forma',Icons.CtxVol],['programa','Pisos y usos',Icons.GridBuild]].map(([id,label,StepIcon]) => <button key={id} type="button" aria-label={label} title={label} aria-pressed={openPanel===id} className={openPanel===id?'active':''} onClick={() => togglePanel(id)}><StepIcon/></button>)}</div>
                    </section>
                    <div className="ml">

                        {/* ── RAIL IZQUIERDO: 5 macrogrupos jerárquicos ── */}

                        {/* ── VIEWER AREA — siempre completo ── */}

                            {/* ── VISTA 3D ── */}
                            {activeView === '3d' && (
