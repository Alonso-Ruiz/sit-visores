           PARSERS: DXF y SHP → array de puntos {x,y} en metros
           ========================================================================= */
        const parseDXF = (text) => {
            // Extrae LWPOLYLINE y POLYLINE, convierte a pts en metros
            const lines = text.split(/\r?\n/).map(s => s.trim());
            const polys = [];
            let i = 0;
            while (i < lines.length) {
                if (lines[i] === 'LWPOLYLINE') {
                    let pts = []; let x = null;
                    i++;
                    while (i < lines.length && lines[i] !== 'SEQEND' && lines[i] !== 'ENDSEC') {
                        const code = parseInt(lines[i]);
                        const val  = parseFloat(lines[i+1]);
                        if (code === 10) x = val;
                        if (code === 20 && x !== null) { pts.push({ x, y: val }); x = null; }
                        i += 2;
                        if (lines[i] === 'LWPOLYLINE' || lines[i] === 'LINE' || lines[i] === 'POLYLINE') break;
                    }
                    if (pts.length >= 3) polys.push(pts);
                } else {
                    i++;
                }
            }
            if (polys.length === 0) {
                // Fallback: try LINE entities to build polygon
                const pts = [];
                i = 0;
                while (i < lines.length) {
                    if (lines[i] === 'LINE') {
                        let x1=null,y1=null,x2=null,y2=null;
                        let j = i+1;
                        while (j < lines.length && j < i+30) {
                            const c = parseInt(lines[j]), v = parseFloat(lines[j+1]);
                            if (c===10) x1=v; if(c===20) y1=v;
                            if (c===11) x2=v; if(c===21) y2=v;
                            j+=2;
                        }
                        if (x1!==null && y1!==null) pts.push({x:x1,y:y1});
                        if (x2!==null && y2!==null) pts.push({x:x2,y:y2});
                    }
                    i++;
                }
                if (pts.length >= 3) polys.push(pts);
            }
            return polys[0] || null;
        };

        const parseSHP = (buffer) => {
            // SHP binary format — reads first polygon record (type 5)
            const view = new DataView(buffer);
            // File code at 0 = 9994
            const fileCode = view.getInt32(0, false);
            if (fileCode !== 9994) throw new Error('No es un archivo SHP válido');
            // First record starts at byte 100
            let offset = 100;
            // Skip record header (8 bytes)
            offset += 8;
            const shapeType = view.getInt32(offset, true); offset += 4;
            if (shapeType !== 5 && shapeType !== 25) throw new Error('Solo se soportan polígonos (tipo 5)');
            // Bounding box (4×double = 32 bytes)
            offset += 32;
            const numParts  = view.getInt32(offset, true); offset += 4;
            const numPoints = view.getInt32(offset, true); offset += 4;
            // Parts array
            const parts = [];
            for (let i = 0; i < numParts; i++) { parts.push(view.getInt32(offset, true)); offset += 4; }
            // Points
            const pts = [];
            for (let i = 0; i < numPoints; i++) {
                const x = view.getFloat64(offset, true); offset += 8;
                const y = view.getFloat64(offset, true); offset += 8;
                pts.push({ x, y });
            }
            // Normalize: translate to local origin in meters (assuming projection in meters)
            const firstPart = pts.slice(parts[0], parts[1] || pts.length);
            const bb = PolyGeo.bbox(firstPart);
            return firstPart.map(p => ({ x: p.x - bb.minX, y: p.y - bb.minY }));
        };

        /* ── Helper canvas: roundRect compatible con todos los navegadores ── */
        function roundRect(ctx, x, y, w, h, r){
            ctx.beginPath();
            ctx.moveTo(x+r, y);
            ctx.lineTo(x+w-r, y);
            ctx.quadraticCurveTo(x+w, y, x+w, y+r);
            ctx.lineTo(x+w, y+h-r);
            ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
            ctx.lineTo(x+r, y+h);
            ctx.quadraticCurveTo(x, y+h, x, y+h-r);
            ctx.lineTo(x, y+r);
            ctx.quadraticCurveTo(x, y, x+r, y);
            ctx.closePath();
        }

        /* =========================================================================
           VISTA PLANTA — Canvas 2D para dibujar / importar el lote
           Props: polygon, setPolygon, isDarkMode, aLote
           ========================================================================= */
        const PlantView = ({ polygon, setPolygon, isDarkMode, sys, config, updateConfig, commitState, selectedEdge, setSelectedEdge }) => {
            const canvasRef   = useRef(null);
            const fileRef     = useRef(null);
            const numInputRef = useRef(null);
            const [mode, setMode]             = useState('draw');
            const [pts, setPts]               = useState(polygon ? [...polygon] : []);
            const [closed, setClosed]         = useState(!!(polygon && polygon.length >= 3));
            const [scale, setScale]           = useState(20);
            const scaleRef = useRef(20);
            useEffect(()=>{ scaleRef.current=scale; },[scale]);
            const [pan, setPan]               = useState({ x: 0, y: 0 });
            const [mouseM, setMouseM]         = useState(null);
            const [isPanning, setIsPanning]   = useState(false);
            const [panStart, setPanStart]     = useState(null);
            const [hoverClose, setHoverClose] = useState(false);
            const [editDist, setEditDist]     = useState('');
            const [editAngle, setEditAngle]   = useState('');
            const [inputActive, setInputActive] = useState(false);
            const [hoverEdge, setHoverEdge]   = useState(null);
            const SNAP_PX = 14, CLOSE_PX = 16;

            useEffect(() => {
                if (polygon && polygon.length >= 3) { setPts([...polygon]); setClosed(true); }
            }, []);

            useEffect(() => {
                if (inputActive && numInputRef.current) numInputRef.current.focus();
            }, [inputActive]);

            const getRect = () => canvasRef.current ? canvasRef.current.getBoundingClientRect() : { width:800, height:600 };
            const toCanvas = (wx, wy) => { const r=getRect(); return { cx: r.width/2+pan.x+wx*scale, cy: r.height/2+pan.y-wy*scale }; };
            const toWorld  = (cx, cy) => { const r=getRect(); return { wx:(cx-r.width/2-pan.x)/scale, wy:-(cy-r.height/2-pan.y)/scale }; };
            const getEv = (e) => { const r=getRect(); const cl=e.touches?e.touches[0]:e; return { x:cl.clientX-r.left, y:cl.clientY-r.top }; };

            const getSnap = (rawWx, rawWy) => {
                let best=null, bestD=SNAP_PX/scale;
                pts.forEach(p => { const d=Math.hypot(p.x-rawWx,p.y-rawWy); if(d<bestD){bestD=d;best=p;} });
                if (best) return { wx:best.x, wy:best.y, type:'vertex' };
                if (pts.length>=1) {
                    const last=pts[pts.length-1];
                    const dx=Math.abs(rawWx-last.x), dy=Math.abs(rawWy-last.y);
                    if (dx<dy*0.12) return { wx:last.x, wy:rawWy, type:'ortho' };
                    if (dy<dx*0.12) return { wx:rawWx, wy:last.y, type:'ortho' };
                }
                return { wx:rawWx, wy:rawWy, type:null };
            };

            const edgeAngle = (i) => {
                if (pts.length<2) return 0;
                const a=pts[i], b=pts[(i+1)%pts.length];
                return Math.atan2(b.y-a.y, b.x-a.x)*180/Math.PI;
            };
            const interiorAngle = (i) => {
                if (pts.length<3) return 90;
                const n=pts.length;
                const prev=pts[(i+n-1)%n], cur=pts[i], next=pts[(i+1)%n];
                const v1x=prev.x-cur.x,v1y=prev.y-cur.y,v2x=next.x-cur.x,v2y=next.y-cur.y;
                return Math.atan2(Math.abs(v1x*v2y-v1y*v2x), v1x*v2x+v1y*v2y)*180/Math.PI;
            };

            useEffect(() => {
                const c=canvasRef.current; if(!c) return;
                const ctx=c.getContext('2d');
                const r=c.getBoundingClientRect();
                const dpr=window.devicePixelRatio||1;
                c.width=r.width*dpr; c.height=r.height*dpr;
                ctx.scale(dpr,dpr);
                const W=r.width, H=r.height;
                const bg=isDarkMode?'#1c1c1e':'#f0f0f5';
                const fg=isDarkMode?'#f5f5f7':'#1d1d1f';
                const mut=isDarkMode?'#3a3a3c':'#d1d1d6';
                const acc='#007aff';
                ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
                const gridSz=scale>=8?1:(scale>=3?5:10);
                const ox=W/2+pan.x, oy=H/2+pan.y;
                ctx.strokeStyle=mut; ctx.lineWidth=0.5; ctx.globalAlpha=0.4;
                for(let x=ox%(gridSz*scale);x<W;x+=gridSz*scale){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
                for(let y=oy%(gridSz*scale);y<H;y+=gridSz*scale){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
                ctx.globalAlpha=1; ctx.lineWidth=1; ctx.globalAlpha=0.3;
                ctx.beginPath();ctx.moveTo(ox,0);ctx.lineTo(ox,H);ctx.stroke();
                ctx.beginPath();ctx.moveTo(0,oy);ctx.lineTo(W,oy);ctx.stroke();
                ctx.globalAlpha=1;

                // ══════════════════════════════════════════════════════════════════
                // ZONA EDIFICABLE — solo se dibuja si el usuario configuró retiros
                // explícitamente en la vista Planta (retirosCaras, face-based).
                // Los valores de retirosNormativos del panel lateral NO alimentan
                // este dibujo — evita mostrar zonas no pedidas por el usuario.
                // ══════════════════════════════════════════════════════════════════
                if(closed && pts.length >= 3){
                    const retirosC  = config.retirosCaras || [];

                    // Solo continuar si hay al menos una cara con retiro > 0 explícito
                    const hasExplicitRetiro = retirosC.some(r => Number(r.val) > 0);
                    if(hasExplicitRetiro){
                        // Garantizar CCW (signedArea > 0) antes del offset
                        // offsetPerEdge requiere CCW para calcular normales inward
                        const rawPts = PolyGeo.ensureCCW([...pts]);
                        const ptsNorm = PolyGeo.signedArea(rawPts) > 0 ? rawPts : [...rawPts].reverse();
                        const nEdgesLoc = ptsNorm.length;
                        const aLoteLoc  = PolyGeo.area(ptsNorm);

                        const edgeDistsLoc = Array.from({length: nEdgesLoc}, (_, i) => {
                            const rc = retirosC.find(r => r.edgeIdx === i);
                            return (rc && Number(rc.val) > 0) ? Number(rc.val) : 0;
                        });

                        let bpLocal = PolyGeo.offsetPerEdge(ptsNorm, edgeDistsLoc);

                        // Validación: bpLocal DEBE ser más pequeño que el lote
                        if(PolyGeo.isValid(bpLocal) && PolyGeo.area(bpLocal) >= aLoteLoc * 0.99){
                            const bpAlt = PolyGeo.offsetPerEdge(ptsNorm, edgeDistsLoc.map(d => -d));
                            bpLocal = (PolyGeo.isValid(bpAlt) && PolyGeo.area(bpAlt) < aLoteLoc * 0.99)
                                ? bpAlt : null;
                        }

                        if(!PolyGeo.isValid(bpLocal)) bpLocal = null;

                        if(bpLocal && bpLocal.length >= 3){
                            // Dibujar con clip = lote, garantía absoluta de no salir
                            ctx.save();
                            ctx.beginPath();
                            ptsNorm.forEach((p,i)=>{
                                const{cx,cy}=toCanvas(p.x,p.y);
                                if(i===0) ctx.moveTo(cx,cy); else ctx.lineTo(cx,cy);
                            });
                            ctx.closePath();
                            ctx.clip();

                            ctx.beginPath();
                            bpLocal.forEach((p,i)=>{
                                const{cx,cy}=toCanvas(p.x,p.y);
                                if(i===0) ctx.moveTo(cx,cy); else ctx.lineTo(cx,cy);
                            });
                            ctx.closePath();
                            ctx.fillStyle = isDarkMode ? 'rgba(0,122,255,0.20)' : 'rgba(0,122,255,0.14)';
                            ctx.fill();
                            ctx.restore();

                            // Etiqueta del área edificable
                            const cenBp  = PolyGeo.centroid(bpLocal);
                            const{cx:cbx,cy:cby} = toCanvas(cenBp.x, cenBp.y);
                            const areaBp = PolyGeo.area(bpLocal);
                            ctx.save();
                            ctx.fillStyle    = isDarkMode ? 'rgba(0,122,255,0.9)' : 'rgba(0,98,204,0.85)';
                            ctx.font         = 'bold 8px -apple-system,sans-serif';
                            ctx.textAlign    = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(`${areaBp.toFixed(1)} m² edificable`, cbx, cby + 16);
                            ctx.restore();

                            // Líneas de retiro: se leen directamente de bpLocal[i]→bpLocal[i+1]
                            // que ya tienen el offset correcto calculado por offsetPerEdge.
                            // No recalcular la normal manualmente — evita errores de signo.
                            retirosC.filter(r => r.val > 0 && r.edgeIdx < ptsNorm.length).forEach(r => {
                                const i  = r.edgeIdx;
                                // Usar los vértices del bpLocal para esa arista
                                const bp_i   = i % bpLocal.length;
                                const bp_i1  = (i + 1) % bpLocal.length;
                                const{cx:ax2,cy:ay2} = toCanvas(bpLocal[bp_i].x,  bpLocal[bp_i].y);
                                const{cx:bx2,cy:by2} = toCanvas(bpLocal[bp_i1].x, bpLocal[bp_i1].y);
                                ctx.save();
                                ctx.strokeStyle = '#ff3b30';
                                ctx.lineWidth   = 1.2;
                                ctx.setLineDash([5, 3]);
                                ctx.globalAlpha = 0.85;
                                ctx.beginPath(); ctx.moveTo(ax2,ay2); ctx.lineTo(bx2,by2); ctx.stroke();
                                ctx.setLineDash([]);
                                ctx.fillStyle   = '#ff3b30';
                                ctx.globalAlpha = 0.9;
                                ctx.font        = 'bold 7px -apple-system,sans-serif';
                                ctx.textAlign   = 'center'; ctx.textBaseline = 'middle';
                                ctx.fillText(`R=${r.val}m`, (ax2+bx2)/2, (ay2+by2)/2 - 7);
                                ctx.restore();
                            });
                        }
                    }
                }

                // ══════════════════════════════════════════════════════════════════
                // POLÍGONO DEL LOTE (siempre encima del offset)
                // ══════════════════════════════════════════════════════════════════
                if(closed && pts.length>=3){
                    ctx.save();
                    ctx.fillStyle  = isDarkMode ? 'rgba(0,122,255,0.10)' : 'rgba(0,122,255,0.07)';
                    ctx.strokeStyle= acc; ctx.lineWidth=2; ctx.setLineDash([]);
                    ctx.beginPath();
                    pts.forEach((p,i)=>{const{cx,cy}=toCanvas(p.x,p.y);if(i===0)ctx.moveTo(cx,cy);else ctx.lineTo(cx,cy);});
                    ctx.closePath(); ctx.fill(); ctx.stroke();
                    ctx.restore();

                    // Dimensiones de aristas + bearing
                    // activeEdge: hoverEdge tiene prioridad visual; si no hay hover, selectedEdge (desde panel) sigue resaltado
                    const activeEdge = (hoverEdge !== null && hoverEdge !== undefined) ? hoverEdge : (selectedEdge !== null && selectedEdge !== undefined ? selectedEdge : null);
                    pts.forEach((p,i)=>{
                        const j=(i+1)%pts.length, q=pts[j];
                        const dm=Math.hypot(q.x-p.x,q.y-p.y);
                        const{cx:ax,cy:ay}=toCanvas(p.x,p.y);
                        const{cx:bx,cy:by}=toCanvas(q.x,q.y);
                        const mx=(ax+bx)/2, my=(ay+by)/2;
                        const angD=edgeAngle(i);

                        // ── Resaltado de cara activa (hover o seleccionada desde panel) ──
                        if(activeEdge === i){
                            const isSelected = (selectedEdge === i); // seleccionada desde panel = borde sólido
                            ctx.save();
                            // Banda de relleno sobre la arista
                            const BAND=6;
                            const len=Math.hypot(bx-ax,by-ay)||1;
                            const nx2=(-(by-ay)/len)*BAND, ny2=((bx-ax)/len)*BAND;
                            ctx.beginPath();
                            ctx.moveTo(ax+nx2,ay+ny2); ctx.lineTo(bx+nx2,by+ny2);
                            ctx.lineTo(bx-nx2,by-ny2); ctx.lineTo(ax-nx2,ay-ny2);
                            ctx.closePath();
                            ctx.fillStyle = isSelected ? 'rgba(255,159,10,0.35)' : 'rgba(255,159,10,0.22)';
                            ctx.fill();
                            // Arista gruesa naranja
                            ctx.strokeStyle='#ff9f0a';
                            ctx.lineWidth = isSelected ? 4 : 3.5;
                            ctx.setLineDash(isSelected ? [] : []);
                            ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
                            // Etiqueta de cara en el centro de la arista
                            const faceNames=['FRONTAL','DERECHA','POSTERIOR','IZQUIERDA'];
                            const faceName = faceNames[i % 4] || `CARA ${i+1}`;
                            ctx.font='900 9px -apple-system,sans-serif';
                            ctx.textAlign='center'; ctx.textBaseline='middle';
                            const lx3=(ax+bx)/2, ly3=(ay+by)/2;
                            const bw=ctx.measureText(faceName).width+14;
                            ctx.fillStyle = isSelected ? 'rgba(255,159,10,0.95)' : 'rgba(0,0,0,0.82)';
                            roundRect(ctx, lx3-bw/2, ly3-9, bw, 18, 4);
                            ctx.fill();
                            ctx.fillStyle = isSelected ? '#000' : '#ff9f0a';
                            ctx.fillText(faceName, lx3, ly3+0.5);
                            ctx.restore();
                        }

                        // Etiqueta de longitud
                        ctx.save(); ctx.translate(mx,my);
                        let rot=-angD*Math.PI/180;
                        if(rot>Math.PI/2)rot-=Math.PI; if(rot<-Math.PI/2)rot+=Math.PI;
                        ctx.rotate(rot);
                        ctx.fillStyle=isDarkMode?'rgba(30,30,40,0.85)':'rgba(255,255,255,0.9)';
                        ctx.fillRect(-22,-9,44,12);
                        ctx.fillStyle=fg; ctx.font='bold 8px -apple-system,sans-serif';
                        ctx.textAlign='center'; ctx.textBaseline='middle';
                        ctx.fillText(`${dm.toFixed(2)}m`,0,-2); ctx.restore();

                        const bear=(((angD%360)+360)%360);
                        ctx.fillStyle=acc; ctx.globalAlpha=0.65;
                        ctx.font='7px -apple-system,sans-serif';
                        ctx.textAlign='center'; ctx.textBaseline='top';
                        ctx.fillText(`${bear.toFixed(1)}°`,mx,my+5); ctx.globalAlpha=1;
                    });

                    // Ángulos interiores en vértices
                    pts.forEach((p,i)=>{
                        const ang=interiorAngle(i);
                        const{cx,cy}=toCanvas(p.x,p.y);
                        ctx.fillStyle='#ff9f0a'; ctx.globalAlpha=0.9;
                        ctx.font='bold 7px -apple-system,sans-serif';
                        ctx.textAlign='center'; ctx.textBaseline='middle';
                        ctx.fillText(`${ang.toFixed(1)}°`,cx+9,cy-9); ctx.globalAlpha=1;
                    });

                    // Área + vértices en centroide
                    const area=PolyGeo.area(pts); const cen=PolyGeo.centroid(pts);
                    const{cx:lx,cy:ly}=toCanvas(cen.x,cen.y);
                    ctx.fillStyle=acc;
                    ctx.font='900 12px -apple-system,sans-serif';
                    ctx.textAlign='center'; ctx.textBaseline='middle';
                    ctx.fillText(`${area.toFixed(1)} m²`,lx,ly);
                    ctx.font='700 8px -apple-system,sans-serif'; ctx.globalAlpha=0.5;
                    ctx.fillText(`${pts.length} vértices`,lx,ly+15); ctx.globalAlpha=1;

                } else if(pts.length>0){
                    ctx.strokeStyle=acc; ctx.lineWidth=2; ctx.setLineDash([]);
                    ctx.beginPath();
                    pts.forEach((p,i)=>{const{cx,cy}=toCanvas(p.x,p.y);if(i===0)ctx.moveTo(cx,cy);else ctx.lineTo(cx,cy);});
                    ctx.stroke();
                    if(mouseM){
                        const sn=getSnap(mouseM.wx,mouseM.wy);
                        const last=pts[pts.length-1];
                        const{cx:lx2,cy:ly2}=toCanvas(last.x,last.y);
                        const{cx:mx2,cy:my2}=toCanvas(sn.wx,sn.wy);
                        ctx.save();
                        ctx.strokeStyle=isDarkMode?'rgba(255,255,255,0.2)':'rgba(0,0,0,0.18)';
                        ctx.lineWidth=1.5; ctx.setLineDash([5,4]);
                        ctx.beginPath(); ctx.moveTo(lx2,ly2); ctx.lineTo(mx2,my2); ctx.stroke();
                        const dm2=Math.hypot(sn.wx-last.x,sn.wy-last.y);
                        const ang2=Math.atan2(sn.wy-last.y,sn.wx-last.x)*180/Math.PI;
                        const bear2=(((ang2%360)+360)%360);
                        ctx.fillStyle=isDarkMode?'rgba(30,30,40,0.9)':'rgba(255,255,255,0.92)';
                        ctx.fillRect((lx2+mx2)/2-36,(ly2+my2)/2-18,72,20);
                        ctx.fillStyle=fg; ctx.font='bold 8px -apple-system,sans-serif';
                        ctx.textAlign='center'; ctx.textBaseline='middle';
                        ctx.fillText(`${dm2.toFixed(2)}m  ∠${bear2.toFixed(1)}°`,(lx2+mx2)/2,(ly2+my2)/2-7);
                        if(sn.type==='vertex'){ctx.strokeStyle='#34c759';ctx.lineWidth=1.5;ctx.setLineDash([]);ctx.beginPath();ctx.arc(mx2,my2,6,0,Math.PI*2);ctx.stroke();}
                        else if(sn.type==='ortho'){ctx.strokeStyle='#ff9f0a';ctx.lineWidth=1.5;ctx.setLineDash([]);ctx.beginPath();ctx.arc(mx2,my2,5,0,Math.PI*2);ctx.stroke();}
                        ctx.restore();
                        pts.forEach((p,i)=>{
                            if(i===0)return;
                            const prev=pts[i-1];
                            const d2=Math.hypot(p.x-prev.x,p.y-prev.y);
                            const{cx:ax2,cy:ay2}=toCanvas(prev.x,prev.y);
                            const{cx:bx2,cy:by2}=toCanvas(p.x,p.y);
                            ctx.fillStyle=fg; ctx.globalAlpha=0.45;
                            ctx.font='7px -apple-system,sans-serif';
                            ctx.textAlign='center'; ctx.textBaseline='middle';
                            ctx.fillText(`${d2.toFixed(2)}m`,(ax2+bx2)/2,(ay2+by2)/2-6);
                            ctx.globalAlpha=1;
                        });
                    }
                }

                // Vértices
                pts.forEach((p,i)=>{
                    const{cx,cy}=toCanvas(p.x,p.y);
                    const isFirst=i===0;
                    ctx.beginPath(); ctx.arc(cx,cy,isFirst?5:3.5,0,Math.PI*2);
                    ctx.fillStyle=isFirst?(hoverClose?'#34c759':acc):fg;
                    ctx.fill();
                    ctx.fillStyle=fg; ctx.globalAlpha=0.45;
                    ctx.font='6px -apple-system,sans-serif';
                    ctx.textAlign='center'; ctx.textBaseline='bottom';
                    ctx.fillText(i+1,cx,cy-5); ctx.globalAlpha=1;
                });

                // Barra de escala
                const barM=Math.max(1,Math.pow(10,Math.floor(Math.log10(80/scale))));
                const barPx=barM*scale;
                ctx.strokeStyle=fg; ctx.lineWidth=1.5; ctx.globalAlpha=0.4; ctx.setLineDash([]);
                const bx3=14, by3=H-18;
                ctx.beginPath(); ctx.moveTo(bx3,by3); ctx.lineTo(bx3+barPx,by3); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(bx3,by3-4); ctx.lineTo(bx3,by3+4); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(bx3+barPx,by3-4); ctx.lineTo(bx3+barPx,by3+4); ctx.stroke();
                ctx.fillStyle=fg; ctx.font='bold 8px -apple-system,sans-serif';
                ctx.textAlign='center'; ctx.fillText(`${barM}m`,bx3+barPx/2,by3-7);
                ctx.globalAlpha=1;
            }, [pts,closed,mouseM,pan,scale,hoverClose,hoverEdge,selectedEdge,isDarkMode,config.retirosCaras,config.retirosNormativos]);

            const commitAndClose = (finalPts) => { const f=PolyGeo.ensureCCW(finalPts); setPts(f);setClosed(true);setPolygon(f);setInputActive(false); };

            // anchor = last confirmed point (index pts.length-1 or -1 if no pts)
            // When inputActive, the cursor position informs the default angle
            const getDefaultAngle = () => {
                if(pts.length>=2&&mouseM){
                    const prev=pts[pts.length-2];
                    const last=pts[pts.length-1];
                    // angle from prev→last (the already-placed direction) is the initial guess
                    return Math.atan2(last.y-prev.y,last.x-prev.x)*180/Math.PI;
                }
                if(pts.length>=1&&mouseM){
                    return Math.atan2(mouseM.wy-pts[pts.length-1].y,mouseM.wx-pts[pts.length-1].x)*180/Math.PI;
                }
                return 0;
            };

            const onMouseDown = (e) => {
                const{x,y}=getEv(e);
                if(mode==='pan'||e.button===1){setIsPanning(true);setPanStart({x:e.clientX-pan.x,y:e.clientY-pan.y});return;}
                const{wx,wy}=toWorld(x,y);
                if(mode==='draw'&&!closed){
                    if(inputActive){ setInputActive(false); }
                    const sn=getSnap(wx,wy);
                    if(pts.length>=3){const{cx:fx,cy:fy}=toCanvas(pts[0].x,pts[0].y);if(Math.hypot(x-fx,y-fy)<CLOSE_PX){commitAndClose(pts);return;}}
                    const prevPt=pts.length>0?pts[pts.length-1]:null;
                    const newPts=[...pts,{x:sn.wx,y:sn.wy}];
                    setPts(newPts);
                    if(prevPt){
                        const dx=sn.wx-prevPt.x,dy=sn.wy-prevPt.y;
                        const ang=Math.atan2(dy,dx)*180/Math.PI;
                        setEditDist(Math.hypot(dx,dy).toFixed(3));
                        setEditAngle((((ang%360)+360)%360).toFixed(2));
                    } else { setEditDist(''); setEditAngle(''); }
                    setInputActive(true);
                } else if(mode==='cara'&&closed){
                    // Clic en modo Cara: selecciona la arista más cercana de forma persistente
                    let bestE=-1, bestDE=20/scaleRef.current;
                    pts.forEach((p,i)=>{
                        const j=(i+1)%pts.length, q=pts[j];
                        const dx2=q.x-p.x, dy2=q.y-p.y, len2=dx2*dx2+dy2*dy2;
                        if(len2===0) return;
                        const t=Math.max(0,Math.min(1,((wx-p.x)*dx2+(wy-p.y)*dy2)/len2));
                        const d=Math.hypot(wx-(p.x+t*dx2), wy-(p.y+t*dy2));
                        if(d<bestDE){bestDE=d;bestE=i;}
                    });
                    // Clic fuera de cualquier arista = deseleccionar
                    setSelectedEdge(bestE>=0 ? bestE : null);
                    setHoverEdge(null);
                }
            };
            const onMouseMove = (e) => {
                const{x,y}=getEv(e);
                if(isPanning){setPan({x:e.clientX-panStart.x,y:e.clientY-panStart.y});return;}
                const{wx,wy}=toWorld(x,y);setMouseM({wx,wy});
                if(!closed&&pts.length>=3){const{cx:fx,cy:fy}=toCanvas(pts[0].x,pts[0].y);setHoverClose(Math.hypot(x-fx,y-fy)<CLOSE_PX);}
                else setHoverClose(false);
                // ── Hover de arista en modo Cara: resalta la cara más cercana al cursor ──
                if(mode==='cara' && closed && pts.length>=2){
                    const EDGE_HIT_M = 1.2 / scaleRef.current;
                    let bestE=-1, bestD=EDGE_HIT_M;
                    pts.forEach((p,i)=>{
                        const j=(i+1)%pts.length, q=pts[j];
                        const dx2=q.x-p.x, dy2=q.y-p.y, len2=dx2*dx2+dy2*dy2;
                        if(len2===0) return;
                        const t=Math.max(0,Math.min(1,((wx-p.x)*dx2+(wy-p.y)*dy2)/len2));
                        const d=Math.hypot(wx-(p.x+t*dx2), wy-(p.y+t*dy2));
                        if(d<bestD){bestD=d;bestE=i;}
                    });
                    setHoverEdge(bestE>=0 ? bestE : null);
                } else {
                    setHoverEdge(null);
                }
            };
            const onMouseUp=()=>setIsPanning(false);
            const onWheel=(e)=>{e.preventDefault();setScale(s=>Math.max(4,Math.min(250,s*(e.deltaY<0?1.15:0.87))));};
            // Attach wheel and touch with {passive:false} natively
            useEffect(()=>{
                const el=canvasRef.current; if(!el) return;
                const wh=(e)=>{e.preventDefault();setScale(s=>Math.max(4,Math.min(250,s*(e.deltaY<0?1.15:0.87))));};
                const ts=(e)=>{e.preventDefault();onMouseDown(e);};
                const tm=(e)=>{e.preventDefault();onMouseMove(e);};
                const tu=()=>setIsPanning(false);
                el.addEventListener('wheel',wh,{passive:false});
                el.addEventListener('touchstart',ts,{passive:false});
                el.addEventListener('touchmove',tm,{passive:false});
                el.addEventListener('touchend',tu,{passive:false});
                return ()=>{
                    el.removeEventListener('wheel',wh);
                    el.removeEventListener('touchstart',ts);
                    el.removeEventListener('touchmove',tm);
                    el.removeEventListener('touchend',tu);
                };
            },[mode,pts,closed,inputActive,isPanning,pan]);
            const onDblClick=()=>{if(!closed&&pts.length>=3)commitAndClose(pts);};

            // applyNumInput: replace the LAST placed point with dist+angle from the point before it
            const applyNumInput = () => {
                const d=parseFloat(editDist);
                const typedA=parseFloat(editAngle);
                if(!isNaN(d)&&d>0){
                    if(!closed&&pts.length>=1){
                        const anchor=pts.length>=2?pts[pts.length-2]:{x:0,y:0};
                        const useAng=!isNaN(typedA)?typedA:0;
                        const rad=useAng*Math.PI/180;
                        const refined={x:anchor.x+d*Math.cos(rad),y:anchor.y+d*Math.sin(rad)};
                        setPts(p=>[...p.slice(0,-1),refined]);
                        setEditDist('');setEditAngle('');
                    }
                }
                setInputActive(false);
            };
            const onNumKeyDown=(e)=>{
                if(e.key==='Enter'){e.preventDefault();applyNumInput();}
                if(e.key==='Escape'){e.preventDefault();setInputActive(false);}
                if(e.key==='Tab'){e.preventDefault();document.getElementById('plant-angle-inp')?.focus();}
            };

            const handleFileLoad=(e)=>{
                const file=e.target.files[0];if(!file)return;
                const ext=file.name.split('.').pop().toLowerCase();
                if(ext==='dxf'){const rd=new FileReader();rd.onload=ev=>{try{const r=parseDXF(ev.target.result);if(!r||r.length<3){alert('Sin polígono en DXF');return;}const f=PolyGeo.ensureCCW(PolyGeo.normalize(r));setPts(f);setClosed(true);setPolygon(f);}catch(err){alert('Error DXF: '+err.message);}};rd.readAsText(file);}
                else if(ext==='shp'){const rd=new FileReader();rd.onload=ev=>{try{const r=parseSHP(ev.target.result);if(!r||r.length<3){alert('Sin polígono en SHP');return;}const f=PolyGeo.ensureCCW(PolyGeo.normalize(r));setPts(f);setClosed(true);setPolygon(f);}catch(err){alert('Error SHP: '+err.message);}};rd.readAsArrayBuffer(file);}
                else alert('Solo .dxf o .shp');
                e.target.value='';
            };

            const clearLot=()=>{setPts([]);setClosed(false);setPolygon(null);setInputActive(false);setSelectedEdge(null);};
            const resetToRect=()=>{const fw=Number(config.loteFrente)||15,fd=Number(config.loteFondo)||20;const f=PolyGeo.ensureCCW([{x:-fw/2,y:-fd/2},{x:fw/2,y:-fd/2},{x:fw/2,y:fd/2},{x:-fw/2,y:fd/2}]);setPts(f);setClosed(true);setPolygon(f);};
            const edgeLen=(i)=>pts.length>1?Math.hypot(pts[(i+1)%pts.length].x-pts[i].x,pts[(i+1)%pts.length].y-pts[i].y):0;
            const area=pts.length>=3?PolyGeo.area(pts):0;
            const bb=pts.length>=2?PolyGeo.bbox(pts):null;
            const perim=pts.length>=2?PolyGeo.perimeter(pts):0;

            return (
                <div style={{flex:1,minHeight:0,display:'flex',flexDirection:'column',position:'relative',overflow:'hidden'}}>
                    {/* ── Toolbar: 3 modos limpios ── */}
                    <div className="plant-toolbar" style={{flexWrap:'wrap',maxWidth:'calc(100% - 16px)',gap:3}}>

                        {/* ① Dibujar: trazar el contorno del lote */}
                        <button
                            className={`pt-btn ${mode==='draw'?'active':''}`}
                            onClick={()=>{ setMode('draw'); setSelectedEdge(null); }}
                            title="① Trazar el contorno del lote"
                        >
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" width="13" height="13"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4z"/></svg>
                            Dibujar
                        </button>

                        {/* ② Cara: seleccionar cara → asignar vía o retiro */}
                        <button
                            className={`pt-btn ${mode==='cara'?'active':''}`}
                            onClick={()=>{ setMode('cara'); }}
                            disabled={!closed}
                            title="② Clic en una cara para asignarle vía o retiro normativo"
                            style={{ opacity: closed ? 1 : 0.35 }}
                        >
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" width="13" height="13"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>
                            Cara
                        </button>

                        {/* Pan */}
                        <button className={`pt-btn ${mode==='pan'?'active':''}`} onClick={()=>setMode('pan')} title="Mover vista">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="13" height="13"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
                            Pan
                        </button>

                        <div className="pt-sep"/>

                        <button className="pt-btn" style={{background:'rgba(88,86,214,0.13)',color:'#5856d6',fontWeight:900}} onClick={()=>fileRef.current&&fileRef.current.click()} title="Importar DXF o SHP">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" width="13" height="13"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                            DXF/SHP
                        </button>
                        <input ref={fileRef} type="file" accept=".dxf,.shp" style={{display:'none'}} onChange={handleFileLoad}/>

                        <div className="pt-sep"/>
                        {!closed&&pts.length>=3&&<button className="pt-btn" style={{background:'rgba(52,199,89,0.15)',color:'#34c759',fontWeight:900}} onClick={()=>commitAndClose(pts)}>✓ Cerrar</button>}
                        {!closed&&pts.length>0&&<button className="pt-btn" style={{color:'#ff9f0a'}} onClick={()=>setPts(p=>p.slice(0,-1))}>← Undo</button>}
                        {closed&&<button className="pt-btn" style={{color:'#ff3b30'}} onClick={clearLot}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" width="13" height="13"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>Nuevo</button>}
                        <div className="pt-sep"/>
                        <button className="pt-btn" onClick={resetToRect} title="Rectángulo Frente×Fondo del panel Lote">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="13" height="13"><rect x="3" y="5" width="18" height="14" rx="1"/></svg>
                            Rect.
                        </button>
                    </div>

                    {/* Canvas */}
                    <div style={{flex:1,minHeight:0,position:'relative'}}>
                        <canvas
                            ref={canvasRef}
                            style={{
                                width:'100%', height:'100%', display:'block', touchAction:'none',
                                cursor: mode==='pan' ? 'grab' : (mode==='cara' && closed ? 'pointer' : (hoverClose?'pointer':'crosshair'))
                            }}
                            onMouseDown={onMouseDown} onMouseMove={onMouseMove} onMouseUp={onMouseUp} onMouseLeave={onMouseUp}
                            onDoubleClick={onDblClick}
                        />

                        {/* Panel numérico al dibujar vértice */}
                        {inputActive&&!closed&&pts.length>0&&(
                            <div style={{position:'absolute',bottom:44,left:'50%',transform:'translateX(-50%)',background:'var(--bg-card)',border:'2px solid #007aff',borderRadius:12,padding:'10px 14px',boxShadow:'0 6px 24px rgba(0,0,0,0.18)',display:'flex',flexDirection:'column',gap:8,zIndex:30,minWidth:270,pointerEvents:'auto'}}>
                                <div style={{fontSize:9,fontWeight:900,letterSpacing:'0.14em',textTransform:'uppercase',color:'#007aff'}}>Vértice {pts.length} — distancia + ángulo</div>
                                <div style={{display:'flex',gap:8}}>
                                    <div style={{flex:1}}>
                                        <div style={{fontSize:8,color:'var(--text-muted)',marginBottom:3,fontWeight:700}}>DISTANCIA (m)</div>
                                        <input ref={numInputRef} type="number" step="0.01" placeholder="ej. 12.50" value={editDist} onChange={e=>setEditDist(e.target.value)} onKeyDown={onNumKeyDown}
                                            style={{width:'100%',background:'var(--bg-input)',border:'1px solid var(--border)',borderRadius:8,padding:'7px',fontSize:15,fontWeight:900,color:'var(--text-main)',textAlign:'center'}}/>
                                    </div>
                                    <div style={{flex:1}}>
                                        <div style={{fontSize:8,color:'var(--text-muted)',marginBottom:3,fontWeight:700}}>ÁNGULO ° (opc.)</div>
                                        <input id="plant-angle-inp" type="number" step="0.1" placeholder="ej. 90" value={editAngle} onChange={e=>setEditAngle(e.target.value)} onKeyDown={onNumKeyDown}
                                            style={{width:'100%',background:'var(--bg-input)',border:'1px solid var(--border)',borderRadius:8,padding:'7px',fontSize:15,fontWeight:900,color:'var(--text-main)',textAlign:'center'}}/>
                                    </div>
                                </div>
                                <div style={{display:'flex',gap:6}}>
                                    <button onClick={applyNumInput} style={{flex:1,padding:'7px',borderRadius:8,border:'none',background:'#007aff',color:'#fff',fontSize:11,fontWeight:900,cursor:'pointer'}}>Aplicar ↵ Enter</button>
                                    <button onClick={()=>setInputActive(false)} style={{padding:'7px 12px',borderRadius:8,border:'1px solid var(--border)',background:'transparent',color:'var(--text-muted)',fontSize:11,cursor:'pointer'}}>✕</button>
                                </div>
                                <div style={{fontSize:8,color:'var(--text-muted)'}}>Tab → ángulo · Enter → aplicar · Esc → cerrar</div>
                            </div>
                        )}

                        {/* ── Panel de cara seleccionada: Retiro + Vía ─────────────────── */}
                        {/* Se muestra cuando hay una cara seleccionada (click en modo Cara) */}
                        {/* o cuando hay hover activo. selectedEdge tiene prioridad.          */}
                        {closed && mode==='cara' && (selectedEdge !== null || hoverEdge !== null) && (() => {
                            const ei = selectedEdge !== null ? selectedEdge : hoverEdge;
                            const isLocked = selectedEdge !== null; // seleccionada = borde dorado
                            const len = edgeLen(ei).toFixed(2);
                            const brg = (((edgeAngle(ei)%360)+360)%360).toFixed(1);
                            const faceNames = ['FRONTAL','DERECHA','POSTERIOR','IZQUIERDA'];
                            const faceName  = faceNames[ei % 4] || `CARA ${ei+1}`;
                            const curRet  = (config.retirosCaras || []).find(r=>r.edgeIdx===ei);
                            const curVia  = (config.viasCaras   || []).find(v=>v.edgeIdx===ei);
                            const retVal  = curRet  ? (curRet.val    || 0)    : 0;
                            const viaActiva = curVia ? (curVia.active || false) : false;
                            const viaAncho  = curVia ? (curVia.ancho  || 8)    : 8;
                            const viaFactor = curVia ? (curVia.factor || 1.5)  : 1.5;
                            return (
                                <div style={{
                                    position:'absolute', top:56, right:10,
                                    background:'var(--bg-card)',
                                    border: isLocked ? '2px solid #ff9f0a' : '1px solid var(--border)',
                                    borderRadius:12, padding:'12px 14px',
                                    zIndex:30, minWidth:230,
                                    boxShadow:'0 4px 20px rgba(0,0,0,0.18)',
                                    display:'flex', flexDirection:'column', gap:8,
                                    transition:'border-color 0.15s'
                                }}>
                                    {/* Cabecera */}
                                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                                        <div style={{display:'flex',alignItems:'center',gap:6}}>
                                            <div style={{background:'#ff9f0a',color:'#000',fontSize:8,fontWeight:900,letterSpacing:'0.14em',textTransform:'uppercase',padding:'2px 8px',borderRadius:4}}>
                                                {faceName}
                                            </div>
                                            <div style={{fontSize:8,fontWeight:700,color:'var(--text-muted)'}}>{len}m · {brg}°</div>
                                        </div>
                                        {isLocked && (
                                            <button onClick={()=>setSelectedEdge(null)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--text-muted)',fontSize:11,lineHeight:1,padding:2}}>✕</button>
                                        )}
                                    </div>

                                    {/* Retiro normativo */}
                                    <div>
                                        <div style={{fontSize:8,fontWeight:900,textTransform:'uppercase',letterSpacing:'0.1em',color:'#ff3b30',marginBottom:5}}>Retiro normativo</div>
                                        <div style={{display:'flex',alignItems:'center',gap:8}}>
                                            <input
                                                type="number" step="0.5" min="0"
                                                value={retVal}
                                                style={{flex:1,background:'var(--bg-input)',border:'1px solid #ff3b30',borderRadius:7,padding:'6px 8px',fontSize:15,fontWeight:900,color:'var(--text-main)',textAlign:'center'}}
                                                onChange={e=>{
                                                    const v=Math.max(0,parseFloat(e.target.value)||0);
                                                    const arr=[...(config.retirosCaras||[])];
                                                    const idx=arr.findIndex(r=>r.edgeIdx===ei);
                                                    if(idx>=0) arr[idx]={...arr[idx],val:v,active:v>0};
                                                    else arr.push({edgeIdx:ei,val:v,active:v>0});
                                                    updateConfig('retirosCaras',arr);
                                                    const faceMapL=['frontal','derecho','posterior','izquierdo'];
                                                    if(ei<4) updateConfig('retirosNormativos',{...config.retirosNormativos,[faceMapL[ei]]:{active:v>0,val:v}});
                                                }}
                                                onKeyDown={e=>{if(e.key==='Enter')e.target.blur();}}
                                            />
                                            <span style={{fontSize:9,fontWeight:700,color:'#ff3b30'}}>m</span>
                                        </div>
                                    </div>

                                    <div style={{height:1,background:'var(--border)'}}/>

                                    {/* Vía pública */}
                                    <div>
                                        <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',marginBottom:6}}>
                                            <input type="checkbox" checked={viaActiva}
                                                onChange={()=>{
                                                    const arr=[...(config.viasCaras||[])];
                                                    const idx=arr.findIndex(v=>v.edgeIdx===ei);
                                                    if(idx>=0) arr[idx]={...arr[idx],active:!arr[idx].active};
                                                    else arr.push({edgeIdx:ei,ancho:8,factor:1.5,active:true});
                                                    updateConfig('viasCaras',arr);
                                                }}
                                                style={{accentColor:'#007aff',width:13,height:13}}
                                            />
                                            <span style={{fontSize:9,fontWeight:900,textTransform:'uppercase',letterSpacing:'0.1em',color:'#007aff'}}>Da a vía pública</span>
                                        </label>
                                        {viaActiva && (
                                            <div style={{display:'flex',gap:8}}>
                                                <div style={{flex:1}}>
                                                    <div style={{fontSize:7,fontWeight:900,color:'var(--text-muted)',marginBottom:3,textTransform:'uppercase'}}>Ancho vía (m)</div>
                                                    <input type="number" step="0.5" min="0" value={viaAncho}
                                                        style={{width:'100%',background:'var(--bg-input)',border:'1px solid var(--border)',borderRadius:6,padding:'5px 6px',fontSize:12,fontWeight:900,color:'var(--text-main)',textAlign:'center'}}
                                                        onChange={e=>{const v=Math.max(0,parseFloat(e.target.value)||0);const arr=[...(config.viasCaras||[])];const idx=arr.findIndex(vc=>vc.edgeIdx===ei);if(idx>=0)arr[idx]={...arr[idx],ancho:v};else arr.push({edgeIdx:ei,ancho:v,factor:1.5,active:true});updateConfig('viasCaras',arr);}}
                                                        onKeyDown={e=>{if(e.key==='Enter')e.target.blur();}}
                                                    />
                                                </div>
                                                <div style={{flex:1}}>
                                                    <div style={{fontSize:7,fontWeight:900,color:'var(--text-muted)',marginBottom:3,textTransform:'uppercase'}}>Factor H</div>
                                                    <input type="number" step="0.1" min="1" max="5" value={viaFactor}
                                                        style={{width:'100%',background:'var(--bg-input)',border:'1px solid var(--border)',borderRadius:6,padding:'5px 6px',fontSize:12,fontWeight:900,color:'var(--text-main)',textAlign:'center'}}
                                                        onChange={e=>{const v=Math.max(1,parseFloat(e.target.value)||1.5);const arr=[...(config.viasCaras||[])];const idx=arr.findIndex(vc=>vc.edgeIdx===ei);if(idx>=0)arr[idx]={...arr[idx],factor:v};else arr.push({edgeIdx:ei,ancho:8,factor:v,active:true});updateConfig('viasCaras',arr);}}
                                                        onKeyDown={e=>{if(e.key==='Enter')e.target.blur();}}
                                                    />
                                                </div>
                                            </div>
                                        )}
                                        {viaActiva && (
                                            <div style={{marginTop:5,fontSize:8,fontWeight:700,color:'#007aff',background:'rgba(0,122,255,0.08)',borderRadius:6,padding:'4px 8px'}}>
                                                H máx esta cara: {((viaFactor||1.5)*((viaAncho||0)+(retVal||0))).toFixed(1)}m
                                            </div>
                                        )}
                                    </div>
                                </div>
                            );
                        })()}

                        {/* Coords */}
                        {mouseM&&<div style={{position:'absolute',bottom:8,right:8,background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:7,padding:'4px 9px',fontSize:9,fontWeight:700,color:'var(--text-muted)',pointerEvents:'none',fontVariantNumeric:'tabular-nums'}}>{mouseM.wx.toFixed(3)} , {mouseM.wy.toFixed(3)} m</div>}
                    </div>

                    {/* Status bar */}
                    <div style={{padding:'5px 12px',fontSize:9,fontWeight:700,color:'var(--text-muted)',background:'var(--bg-card)',borderTop:'1px solid var(--border)',textAlign:'center',flexShrink:0}}>
                        {!closed&&pts.length===0&&'① DIBUJAR — Clic para colocar vértices · Enter confirma distancia+ángulo · Doble clic o ① cierra el lote'}
                        {!closed&&pts.length>0&&`${pts.length} vértices · Clic en ① (verde) o doble clic para cerrar el lote`}
                        {closed&&mode==='draw'&&`✓ Lote: ${area.toFixed(1)} m² · ${pts.length} vért. · Cambia a modo CARA para asignar vías y retiros`}
                        {closed&&mode==='cara'&&(selectedEdge===null?'② CARA — Clic en una cara del lote para asignarle vía o retiro':`Cara ${selectedEdge+1} seleccionada · Edita retiro y vía en el panel · Clic en otra cara para cambiar`)}
                        {closed&&mode==='pan'&&`${area.toFixed(1)} m² · ${pts.length} vért. · Per.${perim.toFixed(1)}m`}
                    </div>
                </div>
            );
        };


        /* =========================================================================
           MOTOR PARAMÉTRICO URBANÍSTICO — ESTACIONAMIENTOS Y SÓTANOS (P4)
           
           Desacoplado del cálculo de densidad pero integrado paramétricamente:
           recibe { viviendas, catStats, aLote, ratioRes, ratioRampa, ratioCirc,
                    factorOcupacionSotano } y devuelve un breakdown completo.
           
           - calcRequerimiento: estacionamientos mínimos (residencial + comercial/eq)
           - calcCapacidadPorSotano: nº de cajones que entran en un sótano completo
                 después de descontar rampas y áreas de circulación
           - determinarSotanos: cuántos sótanos se necesitan para cubrir la demanda
           
           Reutilizable. NO depende de React ni del DOM.
           ========================================================================= */
        const parkingEngine = {
            // Área neta utilizable de un sótano (descuenta rampa y circulación)
            // Por cajón estándar: 12.5 m² (2.5 x 5.0)
            // Rampa típica: ~30 m² (incluye pendiente y radio de giro)
            // Circulación interna típica: 50% del área neta
            AREA_POR_CAJON: 12.5,
            AREA_RAMPA: 30,
            
            calcRequerimiento(viviendas, catStats, ratioResNum, ratioResDen) {
                const estReqRes = Math.ceil((Number(viviendas) || 0) * ((Number(ratioResNum) || 0) / (Number(ratioResDen) || 1)));
                let estReqNonRes = 0;
                (catStats || []).forEach(c => { estReqNonRes += (Number(c.req) || 0); });
                return { res: estReqRes, nonRes: estReqNonRes, total: estReqRes + estReqNonRes };
            },
            
            calcCapacidadPorSotano(aLote, factorOcupacion = 0.85, pctCirculacion = 0.5, areaRampa = this.AREA_RAMPA) {
                // factorOcupacion: % del lote utilizable (resta muros perimetrales, columnas, etc.)
                // pctCirculacion: % del área neta que se usa en pasillos de circulación
                const aBruta = Math.max(0, (Number(aLote) || 0) * factorOcupacion);
                const aNetaParaCajones = Math.max(0, aBruta - areaRampa) * (1 - pctCirculacion);
                return Math.floor(aNetaParaCajones / this.AREA_POR_CAJON);
            },
            
            determinarSotanos(estReqTotal, capacidadPorSotano, maxSotanos = 5) {
                if (capacidadPorSotano <= 0 || estReqTotal <= 0) return { numSotanos: 0, capacidadTotal: 0, deficit: estReqTotal, suficiente: estReqTotal === 0 };
                const numSotanos = Math.min(maxSotanos, Math.ceil(estReqTotal / capacidadPorSotano));
                const capacidadTotal = numSotanos * capacidadPorSotano;
                return { 
                    numSotanos, 
                    capacidadTotal, 
                    deficit: Math.max(0, estReqTotal - capacidadTotal),
                    suficiente: capacidadTotal >= estReqTotal
                };
            }
        };

        const CameraController = ({ hTotal, sys, fitTrigger }) => {

        /* ── CanvasCapture: expone gl.domElement al padre via ref ── */
        const CanvasCapture = React.memo(({ glRef }) => {

        /* =========================================================================
           3. VISOR 2D Y COMPONENTES 3D

        const Elevation2D = ({ sys, isDarkMode }) => {
            const [pan, setPan] = useState({ x: 0, y: 0 }); const [zoom, setZoom] = useState(1);

            const handleWheel = handleWheelFn;

            const handleTouchStart = (e) => { if (e.touches.length === 1) { isDragging.current = true; lastPos.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; } };

            const handleMouseMove = (e) => { if (!isDragging.current) return; const dx = e.clientX - lastPos.current.x; const dy = e.clientY - lastPos.current.y; setPan(p => ({ x: p.x + dx, y: p.y + dy })); lastPos.current = { x: e.clientX, y: e.clientY }; };

            const vias = sys.inputs.vias || {};

            const bgFill = isDarkMode ? "#1c1c1e" : "#f5f5f7";
            const streetFill = isDarkMode ? "#2c2c2e" : "#e5e5ea";
            const textMuted = isDarkMode ? "#98989d" : "#86868b";
            const lineStroke = isDarkMode ? "#f5f5f7" : "#1d1d1f";
            const propLine = isDarkMode ? "#666" : "#86868b";

            return (
                <div ref={containerRef} className="viewer-2d-container w-full h-full" onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={() => isDragging.current = false} onMouseLeave={() => isDragging.current = false} onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={() => isDragging.current = false}>
                    <div className="absolute top-2 left-4 z-10 pointer-events-none text-[9px] font-black uppercase tracking-widest theme-text-muted desktop-only">Corte Dinámico (Scroll: Zoom | Click: Mover)</div>
                    <svg width="100%" height="100%" style={{ touchAction: 'none' }}>
                        <g transform={`translate(${pan.x}, ${pan.y}) scale(${zoom * 8})`}>
                            <g transform="scale(1, -1)">
                                <rect x="-50" y="-15" width={totalWidth + 100} height={15} fill={bgFill} />
                                <rect x="10" y="-15" width={xLote - 10} height={15} fill={streetFill} />
                                <text x={10 + (xLote - 10)/2} y="8" fill={textMuted} fontSize="2" fontWeight="700" textAnchor="middle" transform="scale(1, -1)" letterSpacing="0.1em">VÍA PÚBLICA</text>
                                
                                {vias.izquierdo?.active && <text x={10 + (xLote - vias.izquierdo.ancho - 10)/2} y="4" fill={textMuted} fontSize="1.5" fontWeight="bold" textAnchor="middle" transform="scale(1, -1)">VÍA IZQ</text>}
                                {vias.derecho?.active && <text x={xLote + dLote + vias.derecho.ancho/2} y="4" fill={textMuted} fontSize="1.5" fontWeight="bold" textAnchor="middle" transform="scale(1, -1)">VÍA DER</text>}

                                <line x1="-50" y1="0" x2={totalWidth + 50} y2="0" stroke={lineStroke} strokeWidth="1.1" />

                                <line x1={xLote} y1="-15" x2={xLote} y2={maxDrawHeight + 5} stroke={propLine} strokeWidth="0.4" strokeDasharray="6 2 1 2" />
                                <text x={-(maxDrawHeight/2)} y={-(xLote - 1.2)} fill={propLine} fontSize="1.2" fontWeight="800" textAnchor="middle" transform="rotate(-90) scale(1, -1)" letterSpacing="0.2em">L.P.</text>

                                <line x1={xLote + dLote} y1="-15" x2={xLote + dLote} y2={maxDrawHeight + 5} stroke={propLine} strokeWidth="0.4" strokeDasharray="6 2 1 2" />
                                <text x={-(maxDrawHeight/2)} y={-(xLote + dLote + 1.2)} fill={propLine} fontSize="1.2" fontWeight="800" textAnchor="middle" transform="rotate(-90) scale(1, -1)" letterSpacing="0.2em">L.P.</text>

                                {sys.limits.retiroEfectivoFrontal > 0 && (
                                    <g>
                                        <rect x={xLote} y="0" width={sys.limits.retiroEfectivoFrontal} height={maxDrawHeight} fill="rgba(255,59,48,0.03)" />
                                        <line x1={xLote + sys.limits.retiroEfectivoFrontal} y1="0" x2={xLote + sys.limits.retiroEfectivoFrontal} y2={maxDrawHeight + 2} stroke="#ff3b30" strokeWidth="0.25" strokeDasharray="3 3" />
                                        <text x={-(maxDrawHeight/2)} y={-(xLote + sys.limits.retiroEfectivoFrontal/2 - 0.4)} fill="#ff3b30" fontSize="1.1" fontWeight="800" textAnchor="middle" transform="rotate(-90) scale(1, -1)" letterSpacing="0.1em">R.F.</text>
                                    </g>
                                )}
                                {sys.limits.retiroEfectivoPosterior > 0 && (
                                    <g>
                                        <rect x={xLote + dLote - sys.limits.retiroEfectivoPosterior} y="0" width={sys.limits.retiroEfectivoPosterior} height={maxDrawHeight} fill="rgba(255,59,48,0.03)" />
                                        <line x1={xLote + dLote - sys.limits.retiroEfectivoPosterior} y1="0" x2={xLote + dLote - sys.limits.retiroEfectivoPosterior} y2={maxDrawHeight + 2} stroke="#ff3b30" strokeWidth="0.25" strokeDasharray="3 3" />
                                        <text x={-(maxDrawHeight/2)} y={-(xLote + dLote - sys.limits.retiroEfectivoPosterior/2 - 0.4)} fill="#ff3b30" fontSize="1.1" fontWeight="800" textAnchor="middle" transform="rotate(-90) scale(1, -1)" letterSpacing="0.1em">R.P.</text>
                                    </g>
                                )}
                                
                                {sys.floors && sys.floors.reduce((acc, f, i) => {
                                    if(!f.blocks) return acc;
                                    const rects = f.blocks.map((b, bIdx) => {
                                        const fill = sys.indicators.isExcessH ? 'rgba(255,59,48,0.4)' : colors[f.type];
                                        const stroke = sys.indicators.isExcessH ? '#ff3b30' : '#ffffff';
                                        let minZ = Infinity, maxZ = -Infinity;
                                        if (b.polygon && b.polygon.length > 0) { b.polygon.forEach(p => { if (p && !isNaN(p.y)) { if (p.y < minZ) minZ = p.y; if (p.y > maxZ) maxZ = p.y; } }); } else { minZ = (b.z||0) - (b.d||1)/2; maxZ = (b.z||0) + (b.d||1)/2; }
                                        const depth = maxZ - minZ; const centerZ = minZ + depth/2; const x2D = xLote + (dLote/2 - (centerZ + depth/2));
                                        
                                        return (<rect key={`${i}-${bIdx}`} x={x2D} y={acc.z} width={Math.max(0.1, depth)} height={f.h||3} fill={fill} fillOpacity="0.85" stroke={stroke} strokeWidth="0.45" />);
                                    });
                                    acc.elements.push(rects); acc.z += (f.h||3); return acc;
                                }, { z: 0, elements: [] }).elements}
                                
                                <line x1="-10" y1={sys.limits.hLimitEfectivo} x2={totalWidth + 10} y2={sys.limits.hLimitEfectivo} stroke="#007aff" strokeWidth="0.4" strokeDasharray="5 3" />
                                <text x="0" y={-(sys.limits.hLimitEfectivo + 0.8)} fill="#007aff" fontSize="1.4" fontWeight="900" transform="scale(1, -1)" letterSpacing="0.05em">H MÁXIMA ({(sys.limits.hLimitEfectivo||0).toFixed(1)}m)</text>
                        </g>
                    </g>
                    </svg>
                </div>
            );
        };

/* =========================================================================
           3. MOTOR 3D Y EXTRUSIÓN (Fase 2: Arrastre Real y Primer Piso Normativo)
           ========================================================================= */
        /* ── Geometría imperativa con ciclo de vida gestionado ──
           <primitive> NO es liberado automáticamente por R3F: sin esto,
           cada re-render sube buffers nuevos a GPU y los viejos quedan
           huérfanos (degradación progresiva). Este wrapper libera la
           geometría anterior al reemplazarla o desmontar. */
        const ManagedGeometry = ({ object, attach = "geometry" }) => {
            useEffect(() => {
                return () => { if (object && object.dispose) object.dispose(); };
            }, [object]);
            return <primitive object={object} attach={attach} />;
        };

        /* ── Envolvente normativa poligonal (memoizada + dispose) ──
           Antes se creaba ExtrudeGeometry + EdgesGeometry en cada render
           dentro de un IIFE, sin liberar GPU. Ahora solo se reconstruye
           cuando cambian bp o H. */
        const EnvelopePoly = React.memo(({ bp, H, color, fillOpacity, edgeOpacity }) => {
            const geos = useMemo(() => {
                const shp = new THREE.Shape();
                shp.moveTo(bp[0].x, -bp[0].y);
                for (let i = 1; i < bp.length; i++) shp.lineTo(bp[i].x, -bp[i].y);
                shp.closePath();
                const solid = new THREE.ExtrudeGeometry(shp, { depth: H, bevelEnabled: false });
                const edges = new THREE.EdgesGeometry(solid);
                return { solid, edges };
            }, [bp, H]);
            useEffect(() => {
                return () => { geos.solid.dispose(); geos.edges.dispose(); };
            }, [geos]);
            return (
                <group rotation={[-Math.PI/2,0,0]} raycast={()=>null}>
                    <mesh raycast={()=>null}>
                        <primitive object={geos.solid} attach="geometry"/>
                        <meshBasicMaterial color={color} transparent opacity={fillOpacity} depthWrite={false} side={THREE.DoubleSide}/>
                    </mesh>
                    <lineSegments raycast={()=>null}>
                        <primitive object={geos.edges} attach="geometry"/>
                        <lineBasicMaterial color={color} transparent opacity={edgeOpacity}/>
                    </lineSegments>
                </group>
            );
        });

        const CustomExtrudedBlock = ({ polygon, height, color, isSelected, measureMode, onPointerDown, onPointerMove, onPointerOut }) => {
            const shape = useMemo(() => {
                const s = new THREE.Shape();
                try {
                    if (polygon && Array.isArray(polygon) && polygon.length >= 3) {
                        s.moveTo(polygon[0].x || 0, polygon[0].y || 0);
                        for (let i = 1; i < polygon.length; i++) { s.lineTo(polygon[i].x || 0, polygon[i].y || 0); }
                        s.lineTo(polygon[0].x || 0, polygon[0].y || 0);
                    } else { throw new Error("Polígono inválido"); }
                } catch(e) { s.moveTo(-0.1, -0.1); s.lineTo(0.1, -0.1); s.lineTo(0.1, 0.1); s.lineTo(-0.1, 0.1); s.lineTo(-0.1, -0.1); }
                return s;
            }, [polygon]);
            
            const extrudeSettings = useMemo(() => ({ depth: height || 3, bevelEnabled: false }), [height]);
            const edgesGeom = useMemo(() => {
                const solid = new THREE.ExtrudeGeometry(shape, extrudeSettings);
                const edges = new THREE.EdgesGeometry(solid);
                solid.dispose();
                return edges;
            }, [shape, extrudeSettings]);

            return (
                <group>
                    <mesh 
                        rotation={[-Math.PI / 2, 0, 0]} 
                        castShadow 
                        receiveShadow 
                        onPointerDown={onPointerDown} 
                        onPointerMove={onPointerMove} 
                        onPointerOut={onPointerOut}
                    >
                        <extrudeGeometry args={[shape, extrudeSettings]} />
                        <meshStandardMaterial color={color} roughness={0.2} transparent={isSelected || measureMode} opacity={measureMode ? 0.3 : (isSelected ? 0.7 : 1)} />
                    </mesh>
                    <lineSegments rotation={[-Math.PI / 2, 0, 0]}>
                        <ManagedGeometry object={edgesGeom} />
                        <lineBasicMaterial color={isSelected ? "#007aff" : "#ffffff"} transparent opacity={isSelected ? 1 : 0.5} />
                    </lineSegments>
                </group>
            );
        };

        const Building3D = React.memo(({ config, sys, activeExtrusion, setActiveExtrusion, setConfig, isPushPullMode, measureMode, measurePts, setMeasurePts, selectedFloorId, setSelectedFloorId, commitState, isDarkMode, orthoMode, selectedEdge }) => {
            let currentY = 0; 
            const fNum = Number(sys.inputs.f) || 1; 
            const dNum = Number(sys.inputs.d) || 1; 
            const vias = sys.inputs.vias || {};
            
            const [hoveredFace, setHoveredFace] = useState(null); 
            const [currentMousePos, setCurrentMousePos] = useState(null);
            const [snapType, setSnapType] = useState(null); // 'endpoint' | 'midpoint' | null
            
            // Refs para throttle (evita 60+ setState/seg en cotas)
            const rafIdRef = useRef(null);
            const pendingMouseRef = useRef(null);
            
            const cursorZ = "n-resize";
            const cursorX = "e-resize";

            // Snap CAD enriquecido: endpoints + midpoints de aristas + esquinas del lote
            // Ahora cada punto incluye su tipo para el indicador visual.
            const snapPoints = useMemo(() => {
                const pts = [];
                // Origen y esquinas del lote
                pts.push({ p: new THREE.Vector3(0, 0, 0), type: 'endpoint' });
                pts.push({ p: new THREE.Vector3(fNum/2, 0, dNum/2), type: 'endpoint' });
                pts.push({ p: new THREE.Vector3(-fNum/2, 0, dNum/2), type: 'endpoint' });
                pts.push({ p: new THREE.Vector3(fNum/2, 0, -dNum/2), type: 'endpoint' });
                pts.push({ p: new THREE.Vector3(-fNum/2, 0, -dNum/2), type: 'endpoint' });
                // Midpoints del lote
                pts.push({ p: new THREE.Vector3(0, 0, dNum/2), type: 'midpoint' });
                pts.push({ p: new THREE.Vector3(0, 0, -dNum/2), type: 'midpoint' });
                pts.push({ p: new THREE.Vector3(fNum/2, 0, 0), type: 'midpoint' });
                pts.push({ p: new THREE.Vector3(-fNum/2, 0, 0), type: 'midpoint' });
                
                let accY = 0;
                if (sys && sys.floors) {
                    sys.floors.forEach(f => {
                        if (f.blocks) {
                            f.blocks.forEach(b => {
                                const w = b.w || 1; const d = b.d || 1; const x = b.x || 0; const z = b.z || 0;
                                const yTop = accY + (f.h || 3);
                                // 8 vértices del bloque
                                pts.push({ p: new THREE.Vector3(x - w/2, accY, z - d/2), type: 'endpoint' });
                                pts.push({ p: new THREE.Vector3(x + w/2, accY, z - d/2), type: 'endpoint' });
                                pts.push({ p: new THREE.Vector3(x + w/2, accY, z + d/2), type: 'endpoint' });
                                pts.push({ p: new THREE.Vector3(x - w/2, accY, z + d/2), type: 'endpoint' });
                                pts.push({ p: new THREE.Vector3(x - w/2, yTop, z - d/2), type: 'endpoint' });
                                pts.push({ p: new THREE.Vector3(x + w/2, yTop, z - d/2), type: 'endpoint' });
                                pts.push({ p: new THREE.Vector3(x + w/2, yTop, z + d/2), type: 'endpoint' });
                                pts.push({ p: new THREE.Vector3(x - w/2, yTop, z + d/2), type: 'endpoint' });
                                // Midpoints de aristas horizontales (base y techo)
                                pts.push({ p: new THREE.Vector3(x, accY, z - d/2), type: 'midpoint' });
                                pts.push({ p: new THREE.Vector3(x, accY, z + d/2), type: 'midpoint' });
                                pts.push({ p: new THREE.Vector3(x - w/2, accY, z), type: 'midpoint' });
                                pts.push({ p: new THREE.Vector3(x + w/2, accY, z), type: 'midpoint' });
                                pts.push({ p: new THREE.Vector3(x, yTop, z - d/2), type: 'midpoint' });
                                pts.push({ p: new THREE.Vector3(x, yTop, z + d/2), type: 'midpoint' });
                                pts.push({ p: new THREE.Vector3(x - w/2, yTop, z), type: 'midpoint' });
                                pts.push({ p: new THREE.Vector3(x + w/2, yTop, z), type: 'midpoint' });
                            });
                        }
                        accY += (f.h || 3);
                    });
                }
                return pts;
            }, [sys, fNum, dNum]);

            const getSnapedOrthoPoint = (rawPoint) => {
                let targetPt = rawPoint.clone(); 
                let foundType = null;
                let minDist = 1.0; 
                // Endpoints tienen prioridad sobre midpoints (radio de captura más amplio)
                for (let s of snapPoints) {
                    const r = s.type === 'endpoint' ? 1.2 : 0.8;
                    const dist = s.p.distanceTo(rawPoint);
                    if (dist < r && dist < minDist) { 
                        targetPt.copy(s.p); 
                        foundType = s.type;
                        minDist = dist;
                    }
                }
                // Orto-snap (lock a eje X, Y o Z desde el primer punto)
                if (measurePts.length === 1) {
                    const startPt = measurePts[0]; 
                    const dx = Math.abs(targetPt.x - startPt.x); 
                    const dy = Math.abs(targetPt.y - startPt.y); 
                    const dz = Math.abs(targetPt.z - startPt.z);
                    if (dx >= dy && dx >= dz) { targetPt.y = startPt.y; targetPt.z = startPt.z; } 
                    else if (dy >= dx && dy >= dz) { targetPt.x = startPt.x; targetPt.z = startPt.z; } 
                    else { targetPt.x = startPt.x; targetPt.y = startPt.y; }
                } 
                return { point: targetPt, type: foundType };
            };

            const handleCADClick = (e) => {
                e.stopPropagation();
                if (measureMode) { 
                    const snapped = getSnapedOrthoPoint(e.point);
                    if (measurePts.length >= 2) setMeasurePts([snapped.point]); 
                    else setMeasurePts([...measurePts, snapped.point]); 
                }
            };

            // Throttled pointer move (cotas) — usa rAF para limitar a refresh rate
            const handleMeasurePointerMove = (e) => {
                if (!measureMode) return;
                e.stopPropagation();
                pendingMouseRef.current = e.point.clone();
                if (rafIdRef.current !== null) return;
                rafIdRef.current = requestAnimationFrame(() => {
                    rafIdRef.current = null;
                    if (!pendingMouseRef.current) return;
                    const snapped = getSnapedOrthoPoint(pendingMouseRef.current);
                    setCurrentMousePos(snapped.point);
                    setSnapType(snapped.type);
                });
            };

            // Cleanup rAF al desmontar / desactivar modo medición
            useEffect(() => {
                return () => { if (rafIdRef.current !== null) cancelAnimationFrame(rafIdRef.current); };
            }, []);

            // ========== POINTER CAPTURE GLOBAL PARA EXTRUSIÓN ==========
            // En lugar de un plano invisible R3F (que pierde eventos por z-fighting / pointerout),
            // usamos un raycaster manual sobre window pointer events. Esto es estándar CAD y elimina
            // el bug de "extrusión bloqueada".
            useEffect(() => {
                if (!activeExtrusion) return;
                
                const startPt = activeExtrusion.startPoint;
                const startRet = activeExtrusion.startRet;
                
                const handleWindowMove = (ev) => {
                    // Reproyección por delta del mouse: usamos los pixeles desplazados convertidos
                    // a unidades de mundo via el factor inicial. Más estable que raycaster (no se
                    // pierde si el cursor sale del canvas o pasa sobre otros meshes).
                    const canvas = document.querySelector('.viewer-3d-container canvas');
                    if (!canvas) return;
                    const rect = canvas.getBoundingClientRect();
                    const ndcX = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
                    const ndcY = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
                    
                    // Almacenamos en activeExtrusion las refs NDC iniciales para calcular delta
                    if (!activeExtrusion._ndc0) {
                        activeExtrusion._ndc0 = { x: ndcX, y: ndcY };
                        return;
                    }
                    
                    const dx = ndcX - activeExtrusion._ndc0.x;
                    const dy = ndcY - activeExtrusion._ndc0.y;
                    
                    // Sensibilidad calibrada con baseW/baseD del bloque para que 1 px ≈ 1cm aprox
                    const sens = Math.max(activeExtrusion.baseW, activeExtrusion.baseD) * 0.5;
                    
                    let newRet = startRet;
                    if (activeExtrusion.face === 'retF') newRet = startRet - dy * sens;
                    else if (activeExtrusion.face === 'retP') newRet = startRet + dy * sens;
                    else if (activeExtrusion.face === 'retD') newRet = startRet + dx * sens;
                    else if (activeExtrusion.face === 'retI') newRet = startRet - dx * sens;
                    
                    // ── Límites duros: el retiro nunca puede hacer que el bloque salga del lote ──
                    // baseW/baseD son las dimensiones del bloque DENTRO del polígono de retiro global.
                    // Para el piso 1 (modifiesGlobal=true) el retiro global modifica buildPoly,
                    // por lo que el techo real es fNum/dNum (lote original) menos el retiro opuesto.
                    // Para pisos superiores el techo es baseW/baseD menos el retiro opuesto de blockMods.
                    const baseW  = activeExtrusion.baseW;
                    const baseD  = activeExtrusion.baseD;
                    const blockMods = activeExtrusion.floorData.blockMods?.[activeExtrusion.bIdx] || {};
                    // Dimensiones reales del lote (sistema Three.js) — límite absoluto
                    // sys no está disponible aquí (estamos en useEffect), pero fNum/dNum sí porque
                    // activeExtrusion los captura al inicio del drag vía b.baseRef.w / b.baseRef.d.
                    // Para modifiesGlobal usamos baseW/baseD del bloque base (que es el lote menos nada,
                    // porque el piso 1 aún no tiene blockMods aplicados en su baseRef).
                    const lotW = activeExtrusion.modifiesGlobal ? baseW : baseW;
                    const lotD = activeExtrusion.modifiesGlobal ? baseD : baseD;

                    // Clamp: el retiro de una cara no puede superar (dim_lote - retiro_opuesto - margen)
                    const oppF = activeExtrusion.modifiesGlobal ? 0 : (blockMods.retF || 0);
                    const oppP = activeExtrusion.modifiesGlobal ? 0 : (blockMods.retP || 0);
                    const oppD = activeExtrusion.modifiesGlobal ? 0 : (blockMods.retD || 0);
